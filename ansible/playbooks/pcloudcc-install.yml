---
- name: Install pCloud console client
  hosts: piserv
  gather_facts: true
  roles:
    - role: pcloudcc
      vars:
        pcloudcc_runtime_user: operator
        pcloudcc_mount_root: /mnt/pcloud
        pcloudcc_harden_credentials: true
        pcloudcc_manage_user_service: true
        pcloudcc_enable_linger: true
