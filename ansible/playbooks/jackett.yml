---
- name: Deploy jackett-search on PiServ
  hosts: piserv
  gather_facts: true
  become: true
  vars:
    piserv_jackett_user: admin
    piserv_jackett_port: 9117
    piserv_jackett_lan_ipv4_cidr: >-
      {{ ansible_facts.default_ipv4.network }}/{{ ansible_facts.default_ipv4.prefix }}
    piserv_jackett_firewall_script: >-
      /usr/local/libexec/piserv-jackett-search-docker-firewall
    piserv_jackett_docker_dropin_dir: /etc/systemd/system/docker.service.d
    piserv_jackett_docker_dropin_path: >-
      {{ piserv_jackett_docker_dropin_dir }}/piserv-jackett-search-firewall.conf
    piserv_jackett_docker_firewall_chain: PISERV-JACKETT-SEARCH
    piserv_jackett_validation_address: 127.0.0.1
  pre_tasks:
    - name: Apply PiServ Docker ingress policy prerequisites
      ansible.builtin.import_tasks: ../tasks/jackett/firewall.yml

  tasks:
    - name: Install jackett-search and its upstream-managed components
      ansible.builtin.include_role:
        name: jackett_search
      vars:
        jackett_search_runtime_user: "{{ piserv_jackett_user }}"
        jackett_search_repo_version: 1053269cbda9bb1d3b69d31f62e48fc100be8d61
        jackett_search_manage_components: true
        jackett_search_component_config_dir: >-
          /home/{{ piserv_jackett_user }}/.config/jackett-search
        jackett_search_timezone: Europe/Rome
        jackett_search_jackett_bind_address: 0.0.0.0
        jackett_search_jackett_port: "{{ piserv_jackett_port }}"
        jackett_search_flaresolverr_port: 8191
        jackett_search_api_url: >-
          http://{{ piserv_jackett_validation_address }}:{{ piserv_jackett_port }}

  post_tasks:
    - name: Validate PiServ Docker ingress policy
      ansible.builtin.import_tasks: ../tasks/jackett/validate-firewall.yml

  handlers:
    - name: Reload systemd after adding the Jackett Search ingress policy
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: not ansible_check_mode
