---
- name: Install Tailscale on PiServ
  hosts: piserv
  gather_facts: true
  vars:
    piserv_tailscale_lan_ipv4_cidr: >-
      {{
        ansible_facts.default_ipv4.network
        ~ '/'
        ~ ansible_facts.default_ipv4.prefix
      }}
    piserv_tailscale_advertised_routes:
      - "{{ piserv_tailscale_lan_ipv4_cidr }}"
    piserv_tailscale_advertised_routes_argument: >-
      {{ piserv_tailscale_advertised_routes | join(',') }}
    piserv_tailscale_up_args: >-
      --hostname=piserv
      --advertise-routes={{ piserv_tailscale_advertised_routes_argument }}
      --accept-routes=false
      --snat-subnet-routes=true
  roles:
    - role: artis3n.tailscale.machine
      vars:
        state: present
        release_stability: stable
        tailscale_up_skip: true
        tailscale_args: "{{ piserv_tailscale_up_args }}"

  tasks:
    - name: Enable IPv4 forwarding for the PiServ subnet router
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-piserv-tailscale-subnet-router.conf
        reload: true
      become: true

    - name: Inspect the installed Tailscale runtime in check mode
      when: ansible_check_mode
      block:
        - name: Read the installed Tailscale binary state
          ansible.builtin.stat:
            path: /usr/bin/tailscale
          register: piserv_tailscale_binary

        - name: Read the installed Tailscale service state
          ansible.builtin.service_facts:
          when: piserv_tailscale_binary.stat.exists

    - name: Determine whether Tailscale preferences can be managed
      vars:
        piserv_tailscale_services: >-
          {{ ansible_facts.services | default({}) }}
        piserv_tailscale_service_state: >-
          {{
            piserv_tailscale_services
            .get(
              'tailscaled.service',
              piserv_tailscale_services.get('tailscaled', {})
            )
            .get('state', '')
          }}
      ansible.builtin.set_fact:
        piserv_tailscale_preferences_runtime_available: >-
          {{
            not ansible_check_mode
            or (
              piserv_tailscale_binary.stat.exists | default(false)
              and piserv_tailscale_service_state == 'running'
            )
          }}

    - name: Read Tailscale preferences
      ansible.builtin.command:
        argv:
          - tailscale
          - debug
          - prefs
      become: true
      changed_when: false
      check_mode: false
      register: piserv_tailscale_preferences
      when: piserv_tailscale_preferences_runtime_available

    - name: Determine whether Tailscale preference changes are pending
      vars:
        piserv_tailscale_current_state: >-
          {{ piserv_tailscale_preferences.stdout | from_json }}
      ansible.builtin.set_fact:
        piserv_tailscale_preferences_change_pending: >-
          {{
            ((piserv_tailscale_current_state.AdvertiseRoutes
              | default([], true)
              | sort)
             != (piserv_tailscale_advertised_routes | sort))
            or
            (piserv_tailscale_current_state.RouteAll
              | default(false)
              | bool)
            or
            (piserv_tailscale_current_state.NoSNAT
              | default(false)
              | bool)
          }}
      when: piserv_tailscale_preferences_runtime_available

    - name: Advertise the PiServ local IPv4 LAN
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - >-
            --advertise-routes={{ piserv_tailscale_advertised_routes_argument }}
      become: true
      changed_when: true
      when:
        - piserv_tailscale_preferences_runtime_available
        - >-
          ((piserv_tailscale_preferences.stdout | from_json).AdvertiseRoutes
          | default([], true)
          | sort)
          != (piserv_tailscale_advertised_routes | sort)

    - name: Disable acceptance of advertised subnet routes
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --accept-routes=false
      become: true
      changed_when: true
      when:
        - piserv_tailscale_preferences_runtime_available
        - >-
          (piserv_tailscale_preferences.stdout | from_json).RouteAll
          | default(false)
          | bool

    - name: Enable subnet-route source NAT
      ansible.builtin.command:
        argv:
          - tailscale
          - set
          - --snat-subnet-routes=true
      become: true
      changed_when: true
      when:
        - piserv_tailscale_preferences_runtime_available
        - >-
          (piserv_tailscale_preferences.stdout | from_json).NoSNAT
          | default(false)
          | bool

    - name: Read enforced Tailscale preferences
      ansible.builtin.command:
        argv:
          - tailscale
          - debug
          - prefs
      become: true
      changed_when: false
      check_mode: false
      register: piserv_tailscale_enforced_preferences
      when:
        - piserv_tailscale_preferences_runtime_available
        - >-
          not ansible_check_mode
          or not piserv_tailscale_preferences_change_pending

    - name: Assert advertised subnet routes are not accepted
      vars:
        piserv_tailscale_enforced_state: >-
          {{ piserv_tailscale_enforced_preferences.stdout | from_json }}
      ansible.builtin.assert:
        that:
          - >-
            (piserv_tailscale_enforced_state.RouteAll
            | default(false)
            | bool) == false
          - >-
            (piserv_tailscale_enforced_state.AdvertiseRoutes
            | default([], true)
            | sort)
            == (piserv_tailscale_advertised_routes | sort)
          - >-
            (piserv_tailscale_enforced_state.NoSNAT
            | default(false)
            | bool) == false
        fail_msg: >-
          PiServ subnet-router preferences do not match the required local-LAN
          routing policy. Apply the Tailscale playbook again.
      when:
        - piserv_tailscale_preferences_runtime_available
        - >-
          not ansible_check_mode
          or not piserv_tailscale_preferences_change_pending
