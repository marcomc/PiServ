---
- name: Validate PiServ installation entrypoint invocation
  hosts: piserv
  gather_facts: false
  tasks:
    - name: Require the complete PiServ installation entrypoint
      ansible.builtin.assert:
        that:
          - >-
            (ansible_run_tags | default([]) | difference(['all']) | length) == 0
        fail_msg: >-
          Targeted tags are unsupported because they can bypass storage,
          networking, firewall, and service safety ordering. Run the supported
          scripts/run-piserv-install.sh wrapper without partial-execution
          controls. Direct ansible-playbook invocation is an unsupported bypass
          for full PiServ convergence; invoke a specific playbook directly only
          after completing its documented prerequisites.
      tags:
        - always
