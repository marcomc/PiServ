---
- name: Configure PiServ base host policy
  hosts: piserv
  gather_facts: true
  roles:
    - role: msmtp
      vars:
        msmtp_config_management: create
        msmtp_aliases_management: create
        msmtp_harden_existing_config: true
        msmtp_harden_existing_aliases: true
        msmtp_manage_compat_wrapper: true
    - role: base
      vars:
        base_ssh_dropin_comment: "Managed by PiServ hardening."
        base_cloud_init_disabled_marker_content: |
          Disabled by PiServ hardening on 2026-07-08.
          Configuration is managed by Ansible after SSH is reachable.
