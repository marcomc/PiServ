---
- name: Configure PiServ base host policy
  hosts: piserv
  gather_facts: true
  vars:
    piserv_base_lan_ipv4_cidr: >-
      {{
        ansible_facts.default_ipv4.network
        ~ '/'
        ~ ansible_facts.default_ipv4.prefix
      }}
  pre_tasks:
    - name: Validate firewall policy for the LAN Glances listener
      when: piserv_glances_bind_address == '0.0.0.0'
      block:
        - name: Read UFW policy before enabling the LAN Glances listener
          ansible.builtin.command:
            argv:
              - /usr/sbin/ufw
              - status
              - verbose
          register: piserv_base_ufw_status
          changed_when: false
          failed_when: false
          check_mode: false
          become: true

        - name: Require the PiServ firewall policy before enabling the LAN Glances listener
          ansible.builtin.assert:
            that:
              - "'Status: active' in piserv_base_ufw_status.stdout"
              - "'Default: deny (incoming)' in piserv_base_ufw_status.stdout"
              - >-
                piserv_base_ufw_status.stdout is regex(
                  '(?m)^'
                  ~ (piserv_glances_port | string)
                  ~ '/tcp\\s+ALLOW IN\\s+'
                  ~ (piserv_base_lan_ipv4_cidr | regex_escape)
                  ~ '\\s+# PiServ LAN Glances API$'
                )
              - >-
                piserv_base_ufw_status.stdout is regex(
                  '(?m)^Anywhere\\s+on\\s+tailscale0\\s+ALLOW IN\\s+Anywhere'
                  ~ '\\s+# PiServ Tailscale ingress$'
                )
            fail_msg: >-
              Apply ansible/playbooks/firewall.yml before binding the Glances API
              to the LAN. UFW must be active with default incoming deny, the
              source-scoped PiServ LAN Glances API rule, and PiServ Tailscale
              ingress policy.
  roles:
    - role: msmtp
      vars:
        msmtp_config_management: unmanaged
        msmtp_aliases_management: unmanaged
        msmtp_harden_existing_config: true
        msmtp_harden_existing_aliases: true
        msmtp_manage_compat_wrapper: true
    - role: journald
      vars:
        journald_dropin_path: /etc/systemd/journald.conf.d/99-piserv-persistent.conf
        journald_storage: persistent
        journald_compress: true
        journald_system_max_use: 1G
        journald_system_keep_free: 5G
        journald_system_max_file_size: 128M
        journald_max_retention_sec: 14day
    - role: base
      vars:
        base_ssh_dropin_comment: "Managed by PiServ hardening."
        base_manage_kernel_reboot_mode: true
        base_kernel_reboot_mode: cold
        base_vnc_output: DSI-1
        base_cockpit_packages:
          - cockpit
          - cockpit-storaged
          - cockpit-sosreport
          - cockpit-packagekit
        base_cockpit_expected_modules:
          - storage
          - sosreport
          - updates
        base_glances_bind_address: "{{ piserv_glances_bind_address }}"
        base_glances_validation_address: "{{ piserv_glances_validation_address }}"
        base_glances_port: "{{ piserv_glances_port }}"
        base_cloud_init_disabled_marker_content: |
          Disabled by PiServ hardening on 2026-07-08.
          Configuration is managed by Ansible after SSH is reachable.
    - role: cgroup_memory_controller
