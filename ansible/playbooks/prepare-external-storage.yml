---
- name: Destructively prepare the PiServ external storage disk
  hosts: piserv
  gather_facts: false
  become: true
  vars_files:
    - ../vars/external-storage.yml
  vars:
    piserv_external_storage_format_confirmed: false
  tasks:
    - name: Require explicit confirmation before erasing the external disk
      ansible.builtin.assert:
        that:
          - piserv_external_storage_format_confirmed | bool
        fail_msg: >-
          This playbook erases {{ piserv_external_storage_device }}. Re-run it
          with -e piserv_external_storage_format_confirmed=true only after
          confirming that the disk may be destroyed.

    - name: Verify the configured external storage device identity
      ansible.builtin.command:
        argv:
          - udevadm
          - info
          - --query=property
          - --name={{ piserv_external_storage_device }}
      register: piserv_external_storage_udev
      changed_when: false
      check_mode: false

    - name: Assert the destructive target is the expected external disk
      ansible.builtin.assert:
        that:
          - "'ID_TYPE=disk' in piserv_external_storage_udev.stdout_lines"
          - piserv_external_storage_expected_model | trim | length > 0
          - piserv_external_storage_expected_serial | trim | length > 0
          - >-
            ('ID_MODEL=' ~ (piserv_external_storage_expected_model | trim))
            in piserv_external_storage_udev.stdout_lines
          - >-
            ('ID_SERIAL_SHORT=' ~ (piserv_external_storage_expected_serial | trim))
            in piserv_external_storage_udev.stdout_lines
        fail_msg: >-
          The configured external storage identity does not match the expected
          ASM246X disk. Refusing to erase the wrong device.

    - name: List the external storage disk and every child block device
      ansible.builtin.command:
        argv:
          - lsblk
          - --noheadings
          - --raw
          - --paths
          - --output
          - PATH
          - "{{ piserv_external_storage_device }}"
      register: piserv_external_storage_block_devices
      changed_when: false
      check_mode: false

    - name: Check every external storage block device for mounts
      ansible.builtin.command:
        argv:
          - findmnt
          - --source
          - "{{ item }}"
      loop: "{{ piserv_external_storage_block_devices.stdout_lines }}"
      register: piserv_external_storage_block_device_mounts
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check whether the configured external storage mountpoint is active
      ansible.builtin.command:
        argv:
          - findmnt
          - --mountpoint
          - "{{ piserv_external_storage_mountpoint }}"
      register: piserv_external_storage_mountpoint_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse to repartition mounted external storage devices
      ansible.builtin.assert:
        that:
          - piserv_external_storage_block_devices.stdout_lines | length > 0
          - >-
            (piserv_external_storage_block_device_mounts.results
            | selectattr('rc', 'ne', 0) | list | length) ==
            (piserv_external_storage_block_device_mounts.results | length)
          - piserv_external_storage_mountpoint_state.rc != 0
          - piserv_external_storage_mountpoint_state.stdout | trim == ''
        fail_msg: >-
          The external storage disk, one of its child devices, or its configured
          mountpoint is active. Stop and unmount it before running this
          destructive playbook.

    - name: Install external storage preparation tooling
      ansible.builtin.apt:
        name:
          - e2fsprogs
          - parted
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Clear all external storage filesystem and partition signatures
      ansible.builtin.command:
        argv:
          - wipefs
          - --all
          - --force
          - "{{ piserv_external_storage_device }}"
      changed_when: true

    - name: Create one aligned ext4 partition on a GPT disk
      community.general.parted:
        device: "{{ piserv_external_storage_device }}"
        label: gpt
        number: 1
        name: external-data
        fs_type: ext4
        part_start: 1MiB
        part_end: 100%
        state: present

    - name: Wait for the new partition device to settle
      ansible.builtin.command: udevadm settle
      changed_when: false
      check_mode: false

    - name: Create the journaled ext4 filesystem with its stable label
      community.general.filesystem:
        dev: "{{ piserv_external_storage_partition_device }}"
        fstype: ext4
        opts: "-L {{ piserv_external_storage_volume_label }}"
        force: true
        state: present

    - name: Flush the newly formatted external disk
      ansible.builtin.command:
        argv:
          - blockdev
          - --flushbufs
          - "{{ piserv_external_storage_device }}"
      changed_when: false
      check_mode: false

    - name: Apply the steady-state external storage policy
      ansible.builtin.include_tasks: ../tasks/external-storage.yml
