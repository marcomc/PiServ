---
- name: Migrate PiServ boot media from microSD to NVMe
  hosts: piserv
  become: true
  gather_facts: false
  vars:
    target_disk: /dev/nvme0n1
    boot_order: "0xf16"
    allow_destructive_nvme_reimage: false
  tasks:
    - name: Require explicit destructive opt-in
      ansible.builtin.assert:
        that:
          - allow_destructive_nvme_reimage | bool
        fail_msg: >-
          Set allow_destructive_nvme_reimage=true to repartition and format the
          target NVMe disk.

    - name: Ensure PiServ libexec directory exists
      ansible.builtin.file:
        path: /usr/local/libexec/piserv
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Copy migration script
      ansible.builtin.copy:
        src: ../../scripts/remote/migrate-sd-to-nvme-remote.sh
        dest: /usr/local/libexec/piserv/migrate-sd-to-nvme-remote.sh
        owner: root
        group: root
        mode: "0700"

    - name: Run migration script
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/piserv/migrate-sd-to-nvme-remote.sh
          - "{{ target_disk }}"
          - "{{ boot_order }}"
      changed_when: true
