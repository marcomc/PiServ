---
- name: Rotate the Hermes dashboard credential
  hosts: piserv
  gather_facts: true
  become: true
  vars_files:
    -
      - ../vars/hermes-agent.yml
      - ../vars/hermes-agent.yml.example
  vars:
    piserv_hermes_agent_rotate_dashboard_basic_auth: false
    piserv_hermes_agent_enabled_toolsets:
      - memory
      - skills
      - terminal
    hermes_agent_manage_dashboard: true
    hermes_agent_dashboard_host: >-
      {{ piserv_hermes_agent_dashboard_host }}
    hermes_agent_dashboard_manage_basic_auth: >-
      {{ piserv_hermes_agent_dashboard_manage_basic_auth }}
    hermes_agent_dashboard_basic_auth_username: >-
      {{ piserv_hermes_agent_dashboard_basic_auth_username }}
    hermes_agent_dashboard_service_name: hermes-agent-dashboard.service
    hermes_agent_model: gpt-5.6-luna
    hermes_agent_fallback_providers:
      - {provider: openai-codex, model: gpt-5.3-codex-spark}
      - {provider: openai-codex, model: gpt-5.6-terra}
      - {provider: openai-codex, model: gpt-5.6-sol}
    hermes_agent_reasoning_effort: medium
    hermes_agent_reasoning_overrides:
      gpt-5.3-codex-spark: low
      gpt-5.6-terra: high
      gpt-5.6-sol: xhigh
    hermes_agent_model_aliases:
      terra: {provider: openai-codex, model: gpt-5.6-terra}
      sol: {provider: openai-codex, model: gpt-5.6-sol}
    hermes_agent_manage_inference_provenance: true
    hermes_agent_inference_provenance_plugin_name: piserv-inference-provenance
    hermes_agent_inference_provenance_label: Codex via ChatGPT Pro
    hermes_agent_inference_provenance_default_models: [gpt-5.6-luna]
    hermes_agent_inference_provenance_fallback_models:
      - gpt-5.3-codex-spark
      - gpt-5.6-terra
      - gpt-5.6-sol
    hermes_agent_manage_dashboard_chat: true
    hermes_agent_manage_home_assistant_mcp: "{{ piserv_hermes_agent_manage_home_assistant_mcp }}"
    hermes_agent_home_assistant_mcp_url: "{{ piserv_hermes_agent_home_assistant_mcp_url }}"
    hermes_agent_enabled_toolsets: "{{ piserv_hermes_agent_enabled_toolsets }}"
    hermes_agent_disabled_toolsets:
      - bfl
      - browser
      - clarify
      - code_execution
      - computer_use
      - context_engine
      - cronjob
      - delegation
      - file
      - homeassistant
      - image_gen
      - session_search
      - spotify
      - stt
      - todo
      - tts
      - video
      - video_gen
      - vision
      - web
      - x_search
      - yuanbao
    hermes_agent_dashboard_bind_read_only_paths:
      - {source: /etc/hermes-agent/policies/smart-home-AGENTS.md, destination: /var/lib/hermes-agent/workspace/AGENTS.md, source_managed_in_run: true}
  pre_tasks:
    - name: Require explicit dashboard credential rotation intent
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - "'rotate-dashboard-credentials' in ansible_run_tags"
          - piserv_hermes_agent_rotate_dashboard_basic_auth | bool
          - piserv_hermes_agent_dashboard_manage_basic_auth | bool
        fail_msg: >-
          This playbook changes the dashboard password. Re-run with
          --tags rotate-dashboard-credentials and
          -e piserv_hermes_agent_rotate_dashboard_basic_auth=true.
      tags: always

    - name: Authenticate Hermes runtime before interrupted rotation recovery
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: runtime-user.yml
        public: true
        apply:
          tags: rotate-dashboard-credentials
      vars:
        hermes_agent_runtime_user_phase: preflight
      tags: rotate-dashboard-credentials

    - name: Reconcile an interrupted dashboard credential rotation
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: dashboard-auth-rotation-recover.yml
        public: true
        apply:
          tags: rotate-dashboard-credentials
      vars:
        hermes_agent_runtime_user_available: true
      tags: rotate-dashboard-credentials

    - name: Stop after recovering an interrupted dashboard credential rotation
      ansible.builtin.assert:
        that:
          - not hermes_agent_dashboard_rotation_recovered | bool
        fail_msg: >-
          An interrupted credential rotation was reconciled. Retrieve and verify
          the current root-only proposal before starting a new rotation.
      tags: rotate-dashboard-credentials

    - name: Establish the dashboard credential rotation preconditions
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: dashboard-auth-rotation-preflight.yml
        public: true
        apply:
          tags: rotate-dashboard-credentials
      tags: rotate-dashboard-credentials

  tasks:
    - name: Rotate dashboard credentials through the validated role lifecycle
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: dashboard-auth.yml
        public: true
        apply:
          tags: rotate-dashboard-credentials
      vars:
        hermes_agent_dashboard_rotate_basic_auth: true
        hermes_agent_dashboard_defer_bootstrap_password_publication: true
        hermes_agent_runtime_user_available: true
      tags: rotate-dashboard-credentials

    - name: Render dashboard configuration with rotated credentials
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: dashboard-auth-render.yml
        public: true
        apply:
          tags: rotate-dashboard-credentials
      vars:
        hermes_agent_runtime_user_available: true
      tags: rotate-dashboard-credentials

    - name: Apply the rotated dashboard credential
      ansible.builtin.meta: flush_handlers
      tags: rotate-dashboard-credentials

    - name: Verify the rotated Hermes dashboard credential
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: dashboard-auth-rotation-verify.yml
        public: true
        apply:
          tags: rotate-dashboard-credentials
      tags: rotate-dashboard-credentials

    - name: Mark the rotated dashboard credential active
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: dashboard-auth-rotation-activate.yml
        public: true
        apply:
          tags: rotate-dashboard-credentials
      tags: rotate-dashboard-credentials

    - name: Publish the active rotated dashboard password
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: dashboard-auth-rotation-finalize.yml
        public: true
        apply:
          tags: rotate-dashboard-credentials
      tags: rotate-dashboard-credentials

  handlers:
    - name: Restart Hermes Agent dashboard
      ansible.builtin.systemd_service:
        name: "{{ hermes_agent_dashboard_service_name }}"
        state: restarted
      when: not ansible_check_mode
