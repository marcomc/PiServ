---
- name: Install locked-down Hermes Agent
  hosts: piserv
  gather_facts: true
  become: true
  vars:
    piserv_hermes_agent_lan_ipv4_cidr: >-
      {{ ansible_facts.default_ipv4.network ~ '/' ~ ansible_facts.default_ipv4.prefix }}
    piserv_hermes_agent_enabled_toolsets:
      - memory
      - skills
      - terminal
  vars_files:
    -
      - ../vars/hermes-agent.yml
      - ../vars/hermes-agent.yml.example
    -
      - ../vars/external-storage.yml
      - ../vars/external-storage.yml.example
  pre_tasks:
    - name: Validate concrete external backup storage identity and layout
      ansible.builtin.include_tasks: ../tasks/external-storage-preflight.yml

    - name: Validate firewall policy for the network Hermes dashboard
      when: piserv_hermes_agent_dashboard_host == '0.0.0.0'
      block:
        - name: Read UFW policy before enabling the network Hermes dashboard
          ansible.builtin.command:
            argv:
              - /usr/sbin/ufw
              - status
              - verbose
          register: piserv_hermes_agent_ufw_status
          changed_when: false
          check_mode: false

        - name: Require the PiServ firewall policy before enabling the network Hermes dashboard
          ansible.builtin.assert:
            that:
              - "'Status: active' in piserv_hermes_agent_ufw_status.stdout"
              - "'Default: deny (incoming)' in piserv_hermes_agent_ufw_status.stdout"
              - >-
                piserv_hermes_agent_ufw_status.stdout is regex(
                  '(?m)^9119/tcp\\s+ALLOW IN\\s+'
                  ~ (piserv_hermes_agent_lan_ipv4_cidr | regex_escape)
                  ~ '\\s+# PiServ LAN Hermes dashboard$'
                )
              - >-
                piserv_hermes_agent_ufw_status.stdout is regex(
                  '(?m)^Anywhere\\s+on\\s+tailscale0\\s+ALLOW IN\\s+Anywhere'
                  ~ '\\s+# PiServ Tailscale ingress$'
                )
            fail_msg: >-
              Apply ansible/playbooks/firewall.yml before exposing Hermes. UFW
              must have default incoming deny, a source-scoped LAN dashboard
              rule, and PiServ Tailscale ingress policy.

    - name: Authenticate and create the Hermes policy parent chain
      ansible.builtin.include_tasks: ../tasks/hermes-policy-parent-chain.yml
      vars:
        piserv_hermes_policy_system_root: /etc
        piserv_hermes_policy_service_root: /etc/hermes-agent
        piserv_hermes_policy_directory: /etc/hermes-agent/policies
        piserv_hermes_policy_system_root_uid: 0
        piserv_hermes_policy_system_root_gid: 0
        piserv_hermes_policy_managed_uid: 0
        piserv_hermes_policy_managed_gid: 0
        piserv_hermes_policy_realpath_executable: /usr/bin/realpath

    - name: Install root-controlled PiServ smart-home policy source
      ansible.builtin.copy:
        src: hermes-smart-home-AGENTS.md
        dest: /etc/hermes-agent/policies/smart-home-AGENTS.md
        owner: root
        group: root
        mode: "0644"
      notify: Restart Hermes Agent dashboard
      when:
        - >-
          not ansible_check_mode or
          (piserv_hermes_policy_directory_postcreate.stat.exists |
          default(false))

    - name: Determine whether Hermes requires project CLI orchestration
      ansible.builtin.set_fact:
        piserv_hermes_homeassistant_cli_required: >-
          {{
            piserv_hermes_agent_manage_home_assistant_mcp | bool and
            'terminal' in piserv_hermes_agent_enabled_toolsets
          }}

    - name: Preflight the Hermes runtime identity before project CLI setup
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: runtime-user.yml
      vars:
        hermes_agent_runtime_user_phase: preflight
        hermes_agent_manage_backup: true
        hermes_agent_backup_group: external-data
      when: piserv_hermes_homeassistant_cli_required

    - name: Establish the Hermes runtime identity before project CLI setup
      ansible.builtin.include_role:
        name: hermes_agent
        tasks_from: runtime-user.yml
      vars:
        hermes_agent_runtime_user_phase: mutate
        hermes_agent_manage_backup: true
        hermes_agent_backup_group: external-data
      when: piserv_hermes_homeassistant_cli_required

    - name: Install Home Assistant CLI for the Hermes terminal
      ansible.builtin.include_role:
        name: homeassistant_cli
      vars:
        homeassistant_cli_runtime_user: hermes-agent
        homeassistant_cli_runtime_group: hermes-agent
        homeassistant_cli_server: >-
          {{ piserv_hermes_agent_home_assistant_mcp_url
          | regex_replace('/api/mcp/?$', '') }}
        homeassistant_cli_token_env_file: >-
          /var/lib/hermes-agent/home-assistant-mcp.env
        homeassistant_cli_token_env_var: HASS_MCP_TOKEN
      when:
        - piserv_hermes_homeassistant_cli_required
        - hermes_agent_runtime_user_available | default(false)
  roles:
    - role: hermes_agent
      vars:
        hermes_agent_model: gpt-5.6-luna
        hermes_agent_previous_installer_checksums:
          - sha256:45f589461248c7a6ec3aecd7522a69dd49c5c8dbf4798ba1296af5c0c5e7ccd3
        hermes_agent_fallback_providers:
          # Spark has a separate ChatGPT Pro preview allowance but accepts text only.
          - provider: openai-codex
            model: gpt-5.3-codex-spark
          - provider: openai-codex
            model: gpt-5.6-terra
          - provider: openai-codex
            model: gpt-5.6-sol
        hermes_agent_reasoning_effort: medium
        hermes_agent_reasoning_overrides:
          gpt-5.3-codex-spark: low
          gpt-5.6-terra: high
          gpt-5.6-sol: xhigh
        hermes_agent_model_aliases:
          terra:
            provider: openai-codex
            model: gpt-5.6-terra
          sol:
            provider: openai-codex
            model: gpt-5.6-sol
        hermes_agent_manage_inference_provenance: true
        hermes_agent_inference_provenance_plugin_name: piserv-inference-provenance
        hermes_agent_inference_provenance_label: Codex via ChatGPT Pro
        hermes_agent_inference_provenance_default_models:
          - gpt-5.6-luna
        hermes_agent_inference_provenance_fallback_models:
          - gpt-5.3-codex-spark
          - gpt-5.6-terra
          - gpt-5.6-sol
        hermes_agent_manage_dashboard_chat: true
        hermes_agent_dashboard_host: >-
          {{ piserv_hermes_agent_dashboard_host }}
        hermes_agent_dashboard_manage_basic_auth: >-
          {{ piserv_hermes_agent_dashboard_manage_basic_auth }}
        hermes_agent_dashboard_basic_auth_username: >-
          {{ piserv_hermes_agent_dashboard_basic_auth_username }}
        hermes_agent_manage_home_assistant_mcp: >-
          {{ piserv_hermes_agent_manage_home_assistant_mcp }}
        hermes_agent_home_assistant_mcp_url: >-
          {{ piserv_hermes_agent_home_assistant_mcp_url }}
        hermes_agent_enabled_toolsets: >-
          {{ piserv_hermes_agent_enabled_toolsets }}
        hermes_agent_disabled_toolsets:
          - bfl
          - browser
          - clarify
          - code_execution
          - computer_use
          - context_engine
          - cronjob
          - delegation
          - file
          - homeassistant
          - image_gen
          - session_search
          - spotify
          - stt
          - todo
          - tts
          - video
          - video_gen
          - vision
          - web
          - x_search
          - yuanbao
        hermes_agent_dashboard_bind_read_only_paths:
          - source: /etc/hermes-agent/policies/smart-home-AGENTS.md
            destination: /var/lib/hermes-agent/workspace/AGENTS.md
            source_managed_in_run: true
        hermes_agent_manage_backup: true
        hermes_agent_backup_group: external-data
        hermes_agent_backup_dir: /mnt/external-data/backups/hermes-agent
        hermes_agent_backup_on_calendar: "*-*-* 03:20:00"
        hermes_agent_backup_timezone: Europe/Rome
        # Re-enable only after a guarded 64K proof on hardware with more RAM.
        hermes_agent_manage_local_models: false
