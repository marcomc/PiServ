---
- name: Reject credential leaf metadata drift | {{ fixture.name }}
  block:
    - name: Validate drifted credential leaf | {{ fixture.name }}
      ansible.builtin.include_tasks: ../roles/hermes_agent/tasks/validate-dashboard-credential-ancestors.yml
      vars:
        hermes_agent_dashboard_credential_path: >-
          {{ credential_leaf_initial_states.results[fixture.state_index].stat.path }}
        hermes_agent_dashboard_credential_expected_stat: >-
          {{ credential_leaf_initial_states.results[fixture.state_index].stat }}

    - name: Fail after unexpected credential metadata drift acceptance | {{ fixture.name }}
      ansible.builtin.fail:
        msg: The drifted {{ fixture.name }} credential unexpectedly passed.
  rescue:
    - name: Require the intended credential metadata drift rejection | {{ fixture.name }}
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_task.name ==
            'Require unchanged Hermes dashboard credential before consumption'

- name: Reinspect credential leaf after rejected drift | {{ fixture.name }}
  ansible.builtin.stat:
    path: "{{ credential_leaf_initial_states.results[fixture.state_index].stat.path }}"
    follow: false
  register: credential_leaf_after_rejection

- name: Prove rejected credential leaf retained its inode | {{ fixture.name }}
  ansible.builtin.assert:
    that:
      - >-
        credential_leaf_after_rejection.stat.dev ==
        credential_leaf_initial_states.results[fixture.state_index].stat.dev
      - >-
        credential_leaf_after_rejection.stat.inode ==
        credential_leaf_initial_states.results[fixture.state_index].stat.inode
