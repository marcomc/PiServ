---
- name: Verify Hermes MCP SSH template boundaries
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hermes_agent_user: hermes-agent
    hermes_agent_group: hermes-agent
    hermes_agent_home: /var/lib/hermes-agent
    hermes_agent_codex_home: /var/lib/hermes-agent/.codex
    # The wrapper is rendered from hermes-agent.yml post_tasks, after the role
    # variable scope has ended.  Its conditional must therefore use the
    # PiServ play setting rather than the role default.
    piserv_hermes_agent_manage_home_assistant_mcp: true
    hermes_agent_manage_home_assistant_mcp: false
    hermes_agent_home_assistant_mcp_token_env_file: /var/lib/hermes-agent/home-assistant-mcp.env
    hermes_agent_managed_config_path: /etc/hermes-agent/config.yaml
    hermes_agent_binary_path: "/usr/local/bin/hermes;echo mcp-wrapper-injected"
    piserv_hermes_mcp_ssh_user: codex-hermes-mcp
    piserv_hermes_mcp_ssh_group: codex-hermes-mcp
    piserv_hermes_mcp_ssh_home: /var/lib/codex-hermes-mcp
    piserv_hermes_mcp_ssh_authorized_keys_path: /var/lib/codex-hermes-mcp/.ssh/authorized_keys
    piserv_hermes_mcp_ssh_wrapper_path: /usr/local/libexec/hermes-agent/codex-mcp-ssh
    piserv_hermes_mcp_ssh_sudoers_path: /etc/sudoers.d/codex-hermes-mcp
    piserv_hermes_mcp_ssh_copy_admin_authorized_keys: true
    piserv_hermes_mcp_ssh_source_user: admin
    piserv_hermes_mcp_ssh_source_authorized_keys_path: /home/admin/.ssh/authorized_keys
    piserv_hermes_mcp_ssh_key_provenance: automatic-admin-copy
    piserv_hermes_mcp_ssh_source_public_key_lines:
      - >-
        ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA1
        test@example.invalid
  tasks:
    - name: Create a private temporary template test directory
      ansible.builtin.tempfile:
        state: directory
        prefix: hermes-mcp-ssh-test-
      register: hermes_mcp_ssh_template_test_directory
      # This fixture intentionally materializes only under Ansible's temporary
      # directory so that its rendered-template checks also execute under
      # --check.  The managed MCP task itself must leave a fresh host untouched.
      check_mode: false

    - name: Render the Hermes MCP SSH templates
      ansible.builtin.template:
        src: "{{ item.source }}"
        dest: "{{ hermes_mcp_ssh_template_test_directory.path }}/{{ item.destination }}"
        mode: "0600"
      loop:
        - source: ../playbooks/templates/hermes-mcp-ssh-wrapper.sh.j2
          destination: wrapper.sh
        - source: ../playbooks/templates/hermes-mcp-ssh-authorized_keys.j2
          destination: authorized_keys
        - source: ../playbooks/templates/hermes-mcp-ssh-sshd.conf.j2
          destination: sshd.conf
        - source: ../playbooks/templates/hermes-mcp-ssh-state.json.j2
          destination: lifecycle-state.json
      check_mode: false

    - name: Render the Hermes MCP SSH wrapper without Home Assistant MCP
      ansible.builtin.template:
        src: ../playbooks/templates/hermes-mcp-ssh-wrapper.sh.j2
        dest: "{{ hermes_mcp_ssh_template_test_directory.path }}/wrapper-without-home-assistant.sh"
        mode: "0600"
      vars:
        piserv_hermes_agent_manage_home_assistant_mcp: false
        hermes_agent_manage_home_assistant_mcp: true
      check_mode: false

    - name: Render provisioning Hermes MCP SSH lifecycle state
      ansible.builtin.template:
        src: ../playbooks/templates/hermes-mcp-ssh-state.json.j2
        dest: "{{ hermes_mcp_ssh_template_test_directory.path }}/lifecycle-state-provisioning.json"
        mode: "0600"
      vars:
        piserv_hermes_mcp_ssh_lifecycle_phase: provisioning
      check_mode: false

    - name: Validate the rendered Hermes MCP SSH wrapper shell syntax
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -n
          - "{{ hermes_mcp_ssh_template_test_directory.path }}/wrapper.sh"
      changed_when: false

    - name: Validate rendered Hermes MCP SSH wrappers with ShellCheck
      ansible.builtin.command:
        argv:
          - shellcheck
          - --enable=all
          - "{{ hermes_mcp_ssh_template_test_directory.path }}/wrapper.sh"
          - "{{ hermes_mcp_ssh_template_test_directory.path }}/wrapper-without-home-assistant.sh"
      changed_when: false

    - name: Read the rendered Hermes MCP SSH templates
      ansible.builtin.slurp:
        src: "{{ hermes_mcp_ssh_template_test_directory.path }}/{{ item }}"
      loop:
        - wrapper.sh
        - wrapper-without-home-assistant.sh
        - authorized_keys
        - sshd.conf
        - lifecycle-state.json
        - lifecycle-state-provisioning.json
      register: hermes_mcp_ssh_rendered_templates

    - name: Parse the rendered Hermes MCP SSH lifecycle state
      ansible.builtin.set_fact:
        hermes_mcp_ssh_lifecycle_state: >-
          {{ hermes_mcp_ssh_rendered_templates.results[4].content | b64decode |
          from_json }}

    - name: Parse the rendered provisioning Hermes MCP SSH lifecycle state
      ansible.builtin.set_fact:
        hermes_mcp_ssh_provisioning_lifecycle_state: >-
          {{ hermes_mcp_ssh_rendered_templates.results[5].content | b64decode |
          from_json }}

    - name: Require safe rendered Hermes MCP SSH template contracts
      ansible.builtin.assert:
        fail_msg: >-
          A fresh check-mode fixture must model missing Hermes runtime identities
          and a missing wrapper parent before the MCP task predicts publication.
        that:
          - >-
            '--property=User=hermes-agent'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            '--property=Group=hermes-agent'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            '--property=EnvironmentFile=/var/lib/hermes-agent/home-assistant-mcp.env'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            "'/usr/local/bin/hermes;echo mcp-wrapper-injected' mcp serve"
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            'BindReadOnlyPaths=/etc/hermes-agent/config.yaml:/var/lib/hermes-agent/config.yaml'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            'BindReadOnlyPaths=/etc/hermes-agent/policies/smart-home-AGENTS.md:/var/lib/hermes-agent/workspace/AGENTS.md'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            '--property=WorkingDirectory=/var/lib/hermes-agent/workspace'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            '--property=NoNewPrivileges=true'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            '--property=ProtectSystem=strict'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            '--property=ProtectHome=true'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            '--property=ReadWritePaths=/var/lib/hermes-agent'
            in (hermes_mcp_ssh_rendered_templates.results[0].content | b64decode)
          - >-
            'EnvironmentFile=' not in
            (hermes_mcp_ssh_rendered_templates.results[1].content | b64decode)
          - >-
            'command="/usr/bin/sudo -n /usr/local/libexec/hermes-agent/codex-mcp-ssh",restrict'
            in (hermes_mcp_ssh_rendered_templates.results[2].content | b64decode)
          - >-
            'Match User codex-hermes-mcp'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'AuthorizedKeysFile /var/lib/codex-hermes-mcp/.ssh/authorized_keys'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'AuthorizedKeysCommand none'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'TrustedUserCAKeys none'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'PubkeyAuthentication yes'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'AuthenticationMethods publickey'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'PasswordAuthentication no'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'KbdInteractiveAuthentication no'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'ForceCommand /usr/bin/sudo -n /usr/local/libexec/hermes-agent/codex-mcp-ssh'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'DisableForwarding yes'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'PermitTTY no'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'PermitUserRC no'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'X11Forwarding no'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - >-
            'Match all'
            in (hermes_mcp_ssh_rendered_templates.results[3].content | b64decode)
          - hermes_mcp_ssh_lifecycle_state.schema == 'piserv-hermes-mcp-ssh-state-v1'
          - hermes_mcp_ssh_lifecycle_state.phase == 'active'
          - hermes_mcp_ssh_provisioning_lifecycle_state.phase == 'provisioning'
          - hermes_mcp_ssh_lifecycle_state.mcp_ssh_user == 'codex-hermes-mcp'
          - hermes_mcp_ssh_lifecycle_state.mcp_ssh_group == 'codex-hermes-mcp'
          - hermes_mcp_ssh_lifecycle_state.mcp_ssh_home == '/var/lib/codex-hermes-mcp'
          - >-
            hermes_mcp_ssh_lifecycle_state.authorized_keys_path ==
            '/var/lib/codex-hermes-mcp/.ssh/authorized_keys'
          - >-
            hermes_mcp_ssh_lifecycle_state.wrapper_path ==
            '/usr/local/libexec/hermes-agent/codex-mcp-ssh'
          - >-
            hermes_mcp_ssh_lifecycle_state.sudoers_path ==
            '/etc/sudoers.d/codex-hermes-mcp'
          - hermes_mcp_ssh_lifecycle_state.key_provenance == 'automatic-admin-copy'
          - hermes_mcp_ssh_lifecycle_state.key_source_user == 'admin'
          - >-
            hermes_mcp_ssh_lifecycle_state.key_source_path ==
            '/home/admin/.ssh/authorized_keys'

    - name: Verify automatic key copy rejects every SSH key option
      ansible.builtin.assert:
        that:
          - >-
            'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA1 operator command=comment'
            is match(hermes_mcp_ssh_plain_public_key_pattern)
          - >-
            'no-command="not a forced command" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA1 operator'
            is not match(hermes_mcp_ssh_plain_public_key_pattern)
          - >-
            'from="192.0.2.10",command="unsafe command" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA1 operator'
            is not match(hermes_mcp_ssh_plain_public_key_pattern)
          - >-
            'environment="X ssh-ed25519 placeholder",command="unsafe" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA1 operator'
            is not match(hermes_mcp_ssh_plain_public_key_pattern)
      vars:
        hermes_mcp_ssh_plain_public_key_pattern: >-
          ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|
          sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com)\s+.*$

    - name: Model absent wrapper parent for fresh-host check mode
      ansible.builtin.set_fact:
        hermes_mcp_ssh_fresh_wrapper_parent: >-
          {{ hermes_mcp_ssh_template_test_directory.path }}/missing-wrapper-parent
        piserv_hermes_mcp_ssh_state_path: >-
          {{ hermes_mcp_ssh_template_test_directory.path }}/missing-wrapper-parent/lifecycle-state.json
        piserv_hermes_mcp_ssh_publication_parent_state:
          results:
            - item:
                path: /usr/local/libexec
              stat:
                exists: false
            - item:
                path: >-
                  {{ hermes_mcp_ssh_template_test_directory.path }}/missing-wrapper-parent
              stat:
                exists: false

    - name: Exercise provisioning lifecycle publication guard on a fresh host
      ansible.builtin.include_tasks: ../tasks/hermes-mcp-ssh-publish-lifecycle.yml
      vars:
        piserv_hermes_mcp_ssh_lifecycle_phase: provisioning
        piserv_hermes_mcp_ssh_wrapper_path: >-
          {{ hermes_mcp_ssh_fresh_wrapper_parent }}/codex-mcp-ssh
        piserv_hermes_mcp_ssh_lifecycle_template_source: >-
          {{ playbook_dir }}/../playbooks/templates/hermes-mcp-ssh-state.json.j2
      when: ansible_check_mode

    - name: Require provisioning lifecycle publication to defer on a fresh check-mode host
      ansible.builtin.assert:
        that:
          - piserv_hermes_mcp_ssh_lifecycle_publication is skipped
      when: ansible_check_mode

    - name: Exercise active lifecycle publication guard on a fresh host
      ansible.builtin.include_tasks: ../tasks/hermes-mcp-ssh-publish-lifecycle.yml
      vars:
        piserv_hermes_mcp_ssh_lifecycle_phase: active
        piserv_hermes_mcp_ssh_wrapper_path: >-
          {{ hermes_mcp_ssh_fresh_wrapper_parent }}/codex-mcp-ssh
        piserv_hermes_mcp_ssh_lifecycle_template_source: >-
          {{ playbook_dir }}/../playbooks/templates/hermes-mcp-ssh-state.json.j2
      when: ansible_check_mode

    - name: Require active lifecycle publication to defer on a fresh check-mode host
      ansible.builtin.assert:
        that:
          - piserv_hermes_mcp_ssh_lifecycle_publication is skipped
      when: ansible_check_mode

    - name: Model an unprovenanced partial Hermes MCP SSH deployment
      ansible.builtin.set_fact:
        hermes_mcp_ssh_fixture_account_record: ['x', '995', '995', '', '/var/lib/codex-hermes-mcp', '/bin/sh']
        hermes_mcp_ssh_fixture_group_record: ['x', '995', '']
        hermes_mcp_ssh_fixture_account_paths_present: 2
        hermes_mcp_ssh_fixture_privileged_artifacts_present: 1
        hermes_mcp_ssh_fixture_state_present: false

    - name: Reject unprovenanced partial Hermes MCP SSH deployment
      block:
        - name: Require lifecycle provenance for the partial fixture
          ansible.builtin.assert:
            that:
              - >-
                hermes_mcp_ssh_fixture_state_present or
                (hermes_mcp_ssh_fixture_account_record | length == 0 and
                hermes_mcp_ssh_fixture_group_record | length == 0 and
                hermes_mcp_ssh_fixture_account_paths_present == 0 and
                hermes_mcp_ssh_fixture_privileged_artifacts_present == 0)

        - name: Fail if unprovenanced partial fixture was accepted
          ansible.builtin.fail:
            msg: Unprovenanced partial Hermes MCP SSH deployment was accepted.
      rescue:
        - name: Verify the partial fixture failed lifecycle provenance validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require lifecycle provenance for the partial fixture'

        - name: Record expected provenance rejection
          ansible.builtin.set_fact:
            hermes_mcp_ssh_partial_fixture_rejected: true

    - name: Require rejection of the unprovenanced partial fixture
      ansible.builtin.assert:
        that:
          - hermes_mcp_ssh_partial_fixture_rejected | default(false)

    - name: Model a complete legacy-shaped deployment without lifecycle provenance
      ansible.builtin.set_fact:
        hermes_mcp_ssh_fixture_privileged_artifacts_present: 3

    - name: Reject complete legacy-shaped deployment without lifecycle provenance
      block:
        - name: Require lifecycle provenance for the complete legacy fixture
          ansible.builtin.assert:
            that:
              - >-
                hermes_mcp_ssh_fixture_state_present or
                (hermes_mcp_ssh_fixture_account_record | length == 0 and
                hermes_mcp_ssh_fixture_group_record | length == 0 and
                hermes_mcp_ssh_fixture_account_paths_present == 0 and
                hermes_mcp_ssh_fixture_privileged_artifacts_present == 0)

        - name: Fail if complete legacy fixture was accepted
          ansible.builtin.fail:
            msg: Complete legacy-shaped deployment without provenance was accepted.
      rescue:
        - name: Verify the complete legacy fixture failed lifecycle provenance validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require lifecycle provenance for the complete legacy fixture'

        - name: Record expected complete legacy provenance rejection
          ansible.builtin.set_fact:
            hermes_mcp_ssh_complete_legacy_fixture_rejected: true

    - name: Require rejection of the complete legacy fixture
      ansible.builtin.assert:
        that:
          - hermes_mcp_ssh_complete_legacy_fixture_rejected | default(false)

    - name: Model an authenticated group-only provisioning resume
      ansible.builtin.set_fact:
        piserv_hermes_mcp_ssh_account_passwd_record: []
        piserv_hermes_mcp_ssh_account_group_record: ['x', '995', '']
        piserv_hermes_mcp_ssh_account_identity_is_absent: false
        piserv_hermes_mcp_ssh_account_path_state:
          results:
            - stat: {exists: false}
            - stat: {exists: false}
        piserv_hermes_mcp_ssh_privileged_artifact_state:
          results:
            - stat: {exists: true}
            - stat: {exists: false}
            - stat: {exists: false}
            - stat: {exists: false}
        piserv_hermes_mcp_ssh_lifecycle_state:
          schema: piserv-hermes-mcp-ssh-state-v1
          phase: provisioning
          mcp_ssh_user: codex-hermes-mcp
          mcp_ssh_group: codex-hermes-mcp
          mcp_ssh_home: /var/lib/codex-hermes-mcp
          authorized_keys_path: /var/lib/codex-hermes-mcp/.ssh/authorized_keys
          wrapper_path: /usr/local/libexec/hermes-agent/codex-mcp-ssh
          sudoers_path: /etc/sudoers.d/codex-hermes-mcp
          key_provenance: automatic-admin-copy
          key_source_user: admin
          key_source_path: /home/admin/.ssh/authorized_keys

    - name: Exercise the production provenance gate for a group-only resume
      ansible.builtin.include_tasks: ../tasks/hermes-mcp-ssh-provenance.yml

    - name: Require exact authenticated group-only provisioning resume acceptance
      ansible.builtin.assert:
        that:
          - piserv_hermes_mcp_ssh_account_group_only_provisioning_resume

    - name: Model a group-only resume with active lifecycle provenance
      ansible.builtin.set_fact:
        piserv_hermes_mcp_ssh_lifecycle_state: >-
          {{ piserv_hermes_mcp_ssh_lifecycle_state | combine({'phase': 'active'}) }}

    - name: Preserve active lifecycle provenance through the production phase selector
      ansible.builtin.include_tasks: ../tasks/hermes-mcp-ssh-lifecycle-phase.yml

    - name: Require active lifecycle provenance to remain active on convergence
      ansible.builtin.assert:
        that:
          - piserv_hermes_mcp_ssh_lifecycle_phase == 'active'

    - name: Reject an active lifecycle group-only resume through the production gate
      block:
        - name: Exercise the production provenance gate with active lifecycle state
          ansible.builtin.include_tasks: ../tasks/hermes-mcp-ssh-provenance.yml

        - name: Fail if active lifecycle group-only fixture was accepted
          ansible.builtin.fail:
            msg: Active lifecycle group-only fixture was accepted.
      rescue:
        - name: Verify the active group-only fixture failed provenance validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require lifecycle provenance before adopting Hermes MCP SSH state'

        - name: Record expected active group-only provenance rejection
          ansible.builtin.set_fact:
            hermes_mcp_ssh_group_only_fixture_active_rejected: true

    - name: Require rejection of the active lifecycle group-only fixture
      ansible.builtin.assert:
        that:
          - hermes_mcp_ssh_group_only_fixture_active_rejected | default(false)

    - name: Model a group-only resume without lifecycle provenance
      ansible.builtin.set_fact:
        piserv_hermes_mcp_ssh_privileged_artifact_state:
          results:
            - stat: {exists: false}
            - stat: {exists: false}
            - stat: {exists: false}
            - stat: {exists: false}

    - name: Reject an unprovenanced group-only resume through the production gate
      block:
        - name: Exercise the production provenance gate without lifecycle state
          ansible.builtin.include_tasks: ../tasks/hermes-mcp-ssh-provenance.yml

        - name: Fail if unprovenanced group-only fixture was accepted
          ansible.builtin.fail:
            msg: Unprovenanced group-only fixture was accepted.
      rescue:
        - name: Verify the absent group-only fixture failed provenance validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require lifecycle provenance before adopting Hermes MCP SSH state'

        - name: Record expected absent group-only provenance rejection
          ansible.builtin.set_fact:
            hermes_mcp_ssh_group_only_fixture_absent_rejected: true

    - name: Require rejection of the unprovenanced group-only fixture
      ansible.builtin.assert:
        that:
          - hermes_mcp_ssh_group_only_fixture_absent_rejected | default(false)

  post_tasks:
    - name: Remove the temporary Hermes MCP SSH template test directory
      ansible.builtin.file:
        path: "{{ hermes_mcp_ssh_template_test_directory.path }}"
        state: absent
      when: hermes_mcp_ssh_template_test_directory is defined
      check_mode: false
