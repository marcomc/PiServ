---
- name: Test Hermes policy parent-chain authentication
  hosts: localhost
  gather_facts: false
  vars:
    test_uid: "{{ lookup('ansible.builtin.pipe', 'id -u') | int }}"
    test_gid: "{{ lookup('ansible.builtin.pipe', 'id -g') | int }}"
    test_realpath_executable: "{{ lookup('ansible.builtin.pipe', 'command -v realpath') }}"
  tasks:
    - name: Create isolated Hermes parent-chain fixtures
      ansible.builtin.tempfile:
        state: directory
        prefix: piserv-hermes-policy-
      register: test_workspace

    - name: Canonicalize the isolated fixture workspace
      ansible.builtin.command:
        argv:
          - "{{ test_realpath_executable }}"
          - "{{ test_workspace.path }}"
      register: test_workspace_canonical
      changed_when: false

    - name: Exercise parent-chain states
      block:
        - name: Create the absent-state system root
          ansible.builtin.file:
            path: "{{ test_workspace_canonical.stdout }}/absent/etc"
            state: directory
            mode: "0755"

        - name: Converge an absent Hermes policy parent chain
          ansible.builtin.include_tasks: ../tasks/hermes-policy-parent-chain.yml
          vars:
            piserv_hermes_policy_system_root: "{{ test_workspace_canonical.stdout }}/absent/etc"
            piserv_hermes_policy_service_root: "{{ test_workspace_canonical.stdout }}/absent/etc/hermes-agent"
            piserv_hermes_policy_directory: "{{ test_workspace_canonical.stdout }}/absent/etc/hermes-agent/policies"
            piserv_hermes_policy_system_root_uid: "{{ test_uid }}"
            piserv_hermes_policy_system_root_gid: "{{ test_gid }}"
            piserv_hermes_policy_managed_uid: "{{ test_uid }}"
            piserv_hermes_policy_managed_gid: "{{ test_gid }}"
            piserv_hermes_policy_realpath_executable: "{{ test_realpath_executable }}"

        - name: Recheck the converged Hermes policy parent chain
          ansible.builtin.include_tasks: ../tasks/hermes-policy-parent-chain.yml
          vars:
            piserv_hermes_policy_system_root: "{{ test_workspace_canonical.stdout }}/absent/etc"
            piserv_hermes_policy_service_root: "{{ test_workspace_canonical.stdout }}/absent/etc/hermes-agent"
            piserv_hermes_policy_directory: "{{ test_workspace_canonical.stdout }}/absent/etc/hermes-agent/policies"
            piserv_hermes_policy_system_root_uid: "{{ test_uid }}"
            piserv_hermes_policy_system_root_gid: "{{ test_gid }}"
            piserv_hermes_policy_managed_uid: "{{ test_uid }}"
            piserv_hermes_policy_managed_gid: "{{ test_gid }}"
            piserv_hermes_policy_realpath_executable: "{{ test_realpath_executable }}"

        - name: Create invalid Hermes parent fixtures
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ test_workspace_canonical.stdout }}/symlink/etc"
            - "{{ test_workspace_canonical.stdout }}/symlink/target"
            - "{{ test_workspace_canonical.stdout }}/non-root/etc/hermes-agent"
            - "{{ test_workspace_canonical.stdout }}/wrong-type/etc"

        - name: Create a symlinked Hermes service directory fixture
          ansible.builtin.file:
            src: "{{ test_workspace_canonical.stdout }}/symlink/target"
            dest: "{{ test_workspace_canonical.stdout }}/symlink/etc/hermes-agent"
            state: link

        - name: Create a wrong-type Hermes service directory fixture
          ansible.builtin.copy:
            content: invalid
            dest: "{{ test_workspace_canonical.stdout }}/wrong-type/etc/hermes-agent"
            mode: "0644"

        - name: Reject invalid Hermes policy parent chains
          ansible.builtin.include_tasks: reject-hermes-policy-parent-fixture.yml
          loop:
            - name: symlink
              root: "{{ test_workspace_canonical.stdout }}/symlink/etc"
              managed_uid: "{{ test_uid }}"
            - name: non-root
              root: "{{ test_workspace_canonical.stdout }}/non-root/etc"
              managed_uid: "{{ test_uid | int + 1 }}"
            - name: wrong-type
              root: "{{ test_workspace_canonical.stdout }}/wrong-type/etc"
              managed_uid: "{{ test_uid }}"
          loop_control:
            loop_var: fixture
      always:
        - name: Remove isolated Hermes parent-chain fixtures
          ansible.builtin.file:
            path: "{{ test_workspace.path }}"
            state: absent
