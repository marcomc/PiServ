---
- name: Initialize fixture rejection state | {{ fixture.name }}
  ansible.builtin.set_fact:
    hermes_parent_fixture_rejected: false
    hermes_parent_fixture_failure_task: ""

- name: Exercise invalid fixture | {{ fixture.name }}
  block:
    - name: Attempt fixture convergence | {{ fixture.name }}
      ansible.builtin.include_tasks: ../tasks/hermes-policy-parent-chain.yml
      vars:
        piserv_hermes_policy_system_root: "{{ fixture.root }}"
        piserv_hermes_policy_service_root: "{{ fixture.root }}/hermes-agent"
        piserv_hermes_policy_directory: "{{ fixture.root }}/hermes-agent/policies"
        piserv_hermes_policy_system_root_uid: "{{ test_uid }}"
        piserv_hermes_policy_system_root_gid: "{{ test_gid }}"
        piserv_hermes_policy_managed_uid: "{{ fixture.managed_uid }}"
        piserv_hermes_policy_managed_gid: "{{ test_gid }}"
        piserv_hermes_policy_realpath_executable: "{{ test_realpath_executable }}"

    - name: Fail after unexpected fixture acceptance | {{ fixture.name }}
      ansible.builtin.fail:
        msg: The invalid {{ fixture.name }} fixture unexpectedly passed validation.
  rescue:
    - name: Record fixture rejection | {{ fixture.name }}
      ansible.builtin.set_fact:
        hermes_parent_fixture_rejected: true
        hermes_parent_fixture_failure_task: "{{ ansible_failed_task.name }}"

- name: Assert pre-mutation fixture rejection | {{ fixture.name }}
  ansible.builtin.assert:
    that:
      - hermes_parent_fixture_rejected
      - not (fixture.root + '/hermes-agent/policies') is exists
      - >-
        hermes_parent_fixture_failure_task
        == (
          'Inspect the complete Hermes policy parent chain before mutation'
          if fixture.name == 'wrong-type'
          else 'Authenticate every existing Hermes policy parent before mutation'
        )
