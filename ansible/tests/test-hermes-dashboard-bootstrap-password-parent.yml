---
- name: Test Hermes dashboard bootstrap-password parent policy
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  vars:
    trusted_root: >-
      {{
        lookup(
          'ansible.builtin.pipe',
          'test -d /private/var/root && printf /private/var/root || printf /root'
        )
      }}
  tasks:
    - name: Create bootstrap-password parent fixture root
      ansible.builtin.tempfile:
        state: directory
        path: "{{ trusted_root }}"
        prefix: piserv-hermes-bootstrap-password-parent-
      register: bootstrap_password_fixture
      check_mode: false

    - name: Exercise bootstrap-password parent policy
      block:
        - name: Exercise absent bootstrap-password parent
          ansible.builtin.include_tasks: ../roles/hermes_agent/tasks/validate-dashboard-credential-ancestors.yml
          vars:
            hermes_agent_dashboard_credential_path: >-
              {{ bootstrap_password_fixture.path }}/absent/bootstrap-password

        - name: Inspect absent bootstrap-password parent result
          ansible.builtin.stat:
            path: "{{ bootstrap_password_fixture.path }}/absent"
            follow: false
          register: absent_bootstrap_password_parent

        - name: Require absent-parent behavior for the active mode
          ansible.builtin.assert:
            that: >-
              (ansible_check_mode and
              not absent_bootstrap_password_parent.stat.exists) or
              (not ansible_check_mode and
              absent_bootstrap_password_parent.stat.isdir and
              not absent_bootstrap_password_parent.stat.islnk and
              absent_bootstrap_password_parent.stat.uid == 0 and
              absent_bootstrap_password_parent.stat.gid == 0 and
              absent_bootstrap_password_parent.stat.mode == '0700')

        - name: Inspect predicted absent-parent child state
          ansible.builtin.stat:
            path: >-
              {{ bootstrap_password_fixture.path }}/absent/bootstrap-password
            follow: false
          register: absent_bootstrap_password_child
          when: ansible_check_mode

        - name: Require check mode to leave the predicted parent untouched
          ansible.builtin.assert:
            that:
              - not absent_bootstrap_password_parent.stat.exists
              - not absent_bootstrap_password_child.stat.exists
          when: ansible_check_mode

        - name: Create safe and invalid bootstrap-password ancestor directories
          ansible.builtin.file:
            path: "{{ fixture.parent }}"
            state: directory
            owner: "{{ fixture.owner | default(0) }}"
            group: 0
            mode: "{{ fixture.mode }}"
          loop:
            - name: safe-existing
              parent: "{{ bootstrap_password_fixture.path }}/safe-existing/nested"
              mode: "0700"
            - name: owner-mismatch
              parent: "{{ bootstrap_password_fixture.path }}/owner-mismatch"
              owner: daemon
              mode: "0700"
            - name: group-writable
              parent: "{{ bootstrap_password_fixture.path }}/group-writable"
              mode: "0720"
            - name: other-writable
              parent: "{{ bootstrap_password_fixture.path }}/other-writable"
              mode: "0702"
          loop_control:
            loop_var: fixture
            label: "{{ fixture.name }}"
          when: not ansible_check_mode

        - name: Create non-directory bootstrap-password parent
          ansible.builtin.copy:
            content: invalid
            dest: "{{ bootstrap_password_fixture.path }}/non-directory"
            owner: 0
            group: 0
            mode: "0600"
          when: not ansible_check_mode

        - name: Create bootstrap-password symlink target
          ansible.builtin.file:
            path: "{{ bootstrap_password_fixture.path }}/symlink-target"
            state: directory
            owner: 0
            group: 0
            mode: "0700"
          when: not ansible_check_mode

        - name: Create symlinked bootstrap-password parent
          ansible.builtin.file:
            src: "{{ bootstrap_password_fixture.path }}/symlink-target"
            dest: "{{ bootstrap_password_fixture.path }}/symlink"
            state: link
          when: not ansible_check_mode

        - name: Accept safe nested bootstrap-password ancestors
          ansible.builtin.include_tasks: ../roles/hermes_agent/tasks/validate-dashboard-credential-ancestors.yml
          vars:
            hermes_agent_dashboard_credential_path: >-
              {{ bootstrap_password_fixture.path }}/safe-existing/nested/bootstrap-password
          when: not ansible_check_mode

        - name: Create credential leaf reauthentication fixtures
          ansible.builtin.copy:
            content: fixture
            dest: >-
              {{ bootstrap_password_fixture.path }}/safe-existing/nested/{{ item }}
            owner: 0
            group: 0
            mode: "0600"
          loop:
            - authentication-state
            - bootstrap-password
            - bootstrap-managed-state
          when: not ansible_check_mode

        - name: Inspect credential leaves before metadata drift
          ansible.builtin.stat:
            path: >-
              {{ bootstrap_password_fixture.path }}/safe-existing/nested/{{ item }}
            follow: false
          loop:
            - authentication-state
            - bootstrap-password
            - bootstrap-managed-state
          register: credential_leaf_initial_states
          when: not ansible_check_mode

        - name: Drift credential leaf metadata without replacing inodes
          ansible.builtin.file:
            path: "{{ item.path }}"
            owner: "{{ item.owner }}"
            group: 0
            mode: "{{ item.mode }}"
          loop:
            - path: >-
                {{ bootstrap_password_fixture.path }}/safe-existing/nested/authentication-state
              owner: 0
              mode: "0640"
            - path: >-
                {{ bootstrap_password_fixture.path }}/safe-existing/nested/bootstrap-password
              owner: daemon
              mode: "0600"
            - path: >-
                {{ bootstrap_password_fixture.path }}/safe-existing/nested/bootstrap-managed-state
              owner: 0
              mode: "0660"
          when: not ansible_check_mode

        - name: Reject same-inode credential metadata drift
          ansible.builtin.include_tasks: reject-hermes-dashboard-credential-leaf-drift.yml
          loop:
            - name: authentication-state-mode
              state_index: 0
            - name: bootstrap-password-owner
              state_index: 1
            - name: bootstrap-managed-state-mode
              state_index: 2
          loop_control:
            loop_var: fixture
            label: "{{ fixture.name }}"
          when: not ansible_check_mode

        - name: Reject unsafe existing bootstrap-password parents
          ansible.builtin.include_tasks: reject-hermes-dashboard-bootstrap-password-parent.yml
          loop:
            - name: owner-mismatch
              parent: "{{ bootstrap_password_fixture.path }}/owner-mismatch"
            - name: group-writable
              parent: "{{ bootstrap_password_fixture.path }}/group-writable"
            - name: other-writable
              parent: "{{ bootstrap_password_fixture.path }}/other-writable"
            - name: symlink
              parent: "{{ bootstrap_password_fixture.path }}/symlink"
            - name: non-directory
              parent: "{{ bootstrap_password_fixture.path }}/non-directory"
          loop_control:
            loop_var: fixture
            label: "{{ fixture.name }}"
          when: not ansible_check_mode
      always:
        - name: Remove bootstrap-password parent fixtures
          ansible.builtin.file:
            path: "{{ bootstrap_password_fixture.path }}"
            state: absent
          check_mode: false
