---
- name: Inspect invalid bootstrap-password parent before validation | {{ fixture.name }}
  ansible.builtin.stat:
    path: "{{ fixture.parent }}"
    follow: false
  register: bootstrap_password_parent_before

- name: Reject invalid bootstrap-password parent | {{ fixture.name }}
  block:
    - name: Validate invalid bootstrap-password parent | {{ fixture.name }}
      ansible.builtin.include_tasks: ../roles/hermes_agent/tasks/validate-dashboard-credential-ancestors.yml
      vars:
        hermes_agent_dashboard_credential_path: >-
          {{ fixture.parent }}/nested/bootstrap-password

    - name: Fail after unexpected bootstrap-password parent acceptance | {{ fixture.name }}
      ansible.builtin.fail:
        msg: The invalid {{ fixture.name }} fixture unexpectedly passed validation.
  rescue:
    - name: Require the expected bootstrap-password parent rejection | {{ fixture.name }}
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_task.name ==
            'Authenticate every existing Hermes dashboard credential ancestor'

- name: Inspect invalid bootstrap-password parent after validation | {{ fixture.name }}
  ansible.builtin.stat:
    path: "{{ fixture.parent }}"
    follow: false
  register: bootstrap_password_parent_after

- name: Prove invalid bootstrap-password fixture remained unchanged | {{ fixture.name }}
  ansible.builtin.assert:
    that:
      - >-
        bootstrap_password_parent_after.stat.exists ==
        bootstrap_password_parent_before.stat.exists
      - >-
        bootstrap_password_parent_after.stat.islnk ==
        bootstrap_password_parent_before.stat.islnk
      - >-
        bootstrap_password_parent_after.stat.isdir ==
        bootstrap_password_parent_before.stat.isdir
      - >-
        bootstrap_password_parent_after.stat.isreg ==
        bootstrap_password_parent_before.stat.isreg
      - >-
        bootstrap_password_parent_after.stat.uid ==
        bootstrap_password_parent_before.stat.uid
      - >-
        bootstrap_password_parent_after.stat.gid ==
        bootstrap_password_parent_before.stat.gid
      - >-
        bootstrap_password_parent_after.stat.mode ==
        bootstrap_password_parent_before.stat.mode
      - not (fixture.parent + '/nested/bootstrap-password') is exists
