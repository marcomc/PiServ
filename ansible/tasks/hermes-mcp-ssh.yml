---
- name: Validate Hermes MCP SSH access settings
  ansible.builtin.assert:
    that:
      - piserv_hermes_mcp_ssh_user is match('^[a-z_][a-z0-9_-]*$')
      - piserv_hermes_mcp_ssh_user not in ['root', hermes_agent_user]
      - piserv_hermes_mcp_ssh_group is match('^[a-z_][a-z0-9_-]*$')
      - piserv_hermes_mcp_ssh_group not in ['root', hermes_agent_group]
      - piserv_hermes_mcp_ssh_home is match('^/var/lib/[a-z0-9_-]+$')
      - >-
        piserv_hermes_mcp_ssh_authorized_keys_path ==
        piserv_hermes_mcp_ssh_home ~ '/.ssh/authorized_keys'
      - piserv_hermes_mcp_ssh_wrapper_path is match('^/usr/local/libexec/hermes-agent/[a-z0-9_-]+$')
      - piserv_hermes_mcp_ssh_sudoers_path is match('^/etc/sudoers\.d/[a-z0-9_-]+$')
      - piserv_hermes_mcp_ssh_source_user == 'admin'
      - piserv_hermes_mcp_ssh_source_authorized_keys_path == '/home/admin/.ssh/authorized_keys'
      - hermes_agent_user is match('^[a-z_][a-z0-9_-]*$')
      - hermes_agent_user not in ['root', piserv_hermes_mcp_ssh_user]
      - hermes_agent_group is match('^[a-z_][a-z0-9_-]*$')
      - hermes_agent_group not in ['root', piserv_hermes_mcp_ssh_group]
      - hermes_agent_home is match('^/')
      - hermes_agent_codex_home is match('^/')
      - hermes_agent_binary_path is match('^/')
    fail_msg: >-
      Hermes MCP SSH access must use dedicated non-root identities and the
      fixed, system-owned paths declared by the PiServ playbook.

- name: Read Hermes runtime account and group before MCP SSH access setup
  ansible.builtin.getent:
    database: "{{ item }}"
    key: "{{ hermes_agent_user if item == 'passwd' else hermes_agent_group }}"
    fail_key: false
  loop:
    - passwd
    - group
  check_mode: false

- name: Normalize Hermes runtime identity records
  ansible.builtin.set_fact:
    piserv_hermes_mcp_ssh_runtime_passwd_record: >-
      {{ (ansible_facts.getent_passwd | default({}, true)).get(hermes_agent_user, []) }}
    piserv_hermes_mcp_ssh_runtime_group_record: >-
      {{ (ansible_facts.getent_group | default({}, true)).get(hermes_agent_group, []) }}

- name: Classify a fresh check-mode Hermes runtime identity simulation
  ansible.builtin.set_fact:
    piserv_hermes_mcp_ssh_runtime_identity_is_fresh_check_mode: >-
      {{ ansible_check_mode and
      piserv_hermes_mcp_ssh_runtime_passwd_record | length == 0 and
      piserv_hermes_mcp_ssh_runtime_group_record | length == 0 }}

- name: Require complete Hermes runtime identity records
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_mcp_ssh_runtime_identity_is_fresh_check_mode or
        piserv_hermes_mcp_ssh_runtime_passwd_record | length == 6
      - >-
        piserv_hermes_mcp_ssh_runtime_identity_is_fresh_check_mode or
        piserv_hermes_mcp_ssh_runtime_group_record | length == 3
    fail_msg: >-
      Deploy Hermes before configuring its restricted SSH MCP entry point.

- name: Require the configured Hermes runtime account
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_mcp_ssh_runtime_identity_is_fresh_check_mode or
        (piserv_hermes_mcp_ssh_runtime_passwd_record | length == 6 and
        piserv_hermes_mcp_ssh_runtime_passwd_record[1] != '0')
      - >-
        piserv_hermes_mcp_ssh_runtime_identity_is_fresh_check_mode or
        (piserv_hermes_mcp_ssh_runtime_passwd_record | length == 6 and
        piserv_hermes_mcp_ssh_runtime_passwd_record[2] != '0')
      - >-
        piserv_hermes_mcp_ssh_runtime_identity_is_fresh_check_mode or
        (piserv_hermes_mcp_ssh_runtime_group_record | length == 3 and
        piserv_hermes_mcp_ssh_runtime_group_record[1] != '0')
      - >-
        piserv_hermes_mcp_ssh_runtime_identity_is_fresh_check_mode or
        (piserv_hermes_mcp_ssh_runtime_passwd_record | length == 6 and
        piserv_hermes_mcp_ssh_runtime_group_record | length == 3 and
        piserv_hermes_mcp_ssh_runtime_passwd_record[2] ==
        piserv_hermes_mcp_ssh_runtime_group_record[1])
    fail_msg: >-
      Deploy Hermes before configuring its restricted SSH MCP entry point.

- name: Read existing Hermes MCP SSH account and group
  ansible.builtin.getent:
    database: "{{ item }}"
    key: "{{ piserv_hermes_mcp_ssh_user if item == 'passwd' else piserv_hermes_mcp_ssh_group }}"
    fail_key: false
  loop:
    - passwd
    - group
  check_mode: false

- name: Normalize existing Hermes MCP SSH identity records
  ansible.builtin.set_fact:
    piserv_hermes_mcp_ssh_account_passwd_record: >-
      {{ (ansible_facts.getent_passwd | default({}, true)).get(piserv_hermes_mcp_ssh_user, []) }}
    piserv_hermes_mcp_ssh_account_group_record: >-
      {{ (ansible_facts.getent_group | default({}, true)).get(piserv_hermes_mcp_ssh_group, []) }}

- name: Classify an absent Hermes MCP SSH account identity
  ansible.builtin.set_fact:
    piserv_hermes_mcp_ssh_account_identity_is_absent: >-
      {{ piserv_hermes_mcp_ssh_account_passwd_record | length == 0 and
      piserv_hermes_mcp_ssh_account_group_record | length == 0 }}

- name: Require a safe existing Hermes MCP SSH account identity
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_mcp_ssh_account_identity_is_absent or
        (piserv_hermes_mcp_ssh_account_passwd_record | length == 6 and
        piserv_hermes_mcp_ssh_account_passwd_record[1] != '0' and
        piserv_hermes_mcp_ssh_account_passwd_record[2] != '0' and
        piserv_hermes_mcp_ssh_account_passwd_record[4] == piserv_hermes_mcp_ssh_home and
        piserv_hermes_mcp_ssh_account_passwd_record[5] == '/bin/sh')
      - >-
        piserv_hermes_mcp_ssh_account_identity_is_absent or
        (piserv_hermes_mcp_ssh_account_group_record | length == 3 and
        piserv_hermes_mcp_ssh_account_group_record[1] != '0')
      - >-
        piserv_hermes_mcp_ssh_account_identity_is_absent or
        (piserv_hermes_mcp_ssh_account_passwd_record | length == 6 and
        piserv_hermes_mcp_ssh_account_group_record | length == 3 and
        piserv_hermes_mcp_ssh_account_passwd_record[2] ==
        piserv_hermes_mcp_ssh_account_group_record[1])
      - >-
        piserv_hermes_mcp_ssh_account_identity_is_absent or
        (piserv_hermes_mcp_ssh_account_passwd_record | length == 6 and
        piserv_hermes_mcp_ssh_runtime_passwd_record | length == 6 and
        piserv_hermes_mcp_ssh_account_passwd_record[1] !=
        piserv_hermes_mcp_ssh_runtime_passwd_record[1])
      - >-
        piserv_hermes_mcp_ssh_account_identity_is_absent or
        (piserv_hermes_mcp_ssh_account_group_record | length == 3 and
        piserv_hermes_mcp_ssh_runtime_group_record | length == 3 and
        piserv_hermes_mcp_ssh_account_group_record[1] !=
        piserv_hermes_mcp_ssh_runtime_group_record[1])
    fail_msg: >-
      An existing Hermes MCP SSH account must already use the dedicated home,
      shell, and primary group. Refusing to adopt another account.

- name: Inspect the Hermes MCP SSH home and key directory before mutation
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ piserv_hermes_mcp_ssh_home }}"
    - "{{ piserv_hermes_mcp_ssh_home }}/.ssh"
  register: piserv_hermes_mcp_ssh_account_path_state
  changed_when: false
  check_mode: false

- name: Authenticate existing Hermes MCP SSH account paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isdir
      - not item.stat.exists or not item.stat.islnk
      - >-
        not item.stat.exists or
        (item.stat.pw_name == piserv_hermes_mcp_ssh_user and
        item.stat.gr_name == piserv_hermes_mcp_ssh_group)
    fail_msg: >-
      Existing Hermes MCP SSH account paths must be dedicated, non-symlinked
      directories owned by the dedicated account before they are managed.
  loop: "{{ piserv_hermes_mcp_ssh_account_path_state.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Define the Hermes MCP SSH lifecycle state path
  ansible.builtin.set_fact:
    piserv_hermes_mcp_ssh_state_path: >-
      {{ (piserv_hermes_mcp_ssh_wrapper_path | dirname) ~
      '/.codex-hermes-mcp-state.json' }}
    piserv_hermes_mcp_ssh_key_provenance: >-
      {{ 'automatic-admin-copy' if
      piserv_hermes_mcp_ssh_copy_admin_authorized_keys else
      'manual-operator-managed' }}
    piserv_hermes_mcp_ssh_lifecycle_phase: provisioning

- name: Inspect existing privileged Hermes MCP SSH artifacts before mutation
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - path: "{{ piserv_hermes_mcp_ssh_state_path }}"
      mode: "0600"
      marker: '(?m)^  "schema": "piserv-hermes-mcp-ssh-state-v1",$'
    - path: "{{ piserv_hermes_mcp_ssh_wrapper_path }}"
      mode: "0755"
      marker: '(?m)^# Managed by Ansible\. This entry point is callable only through the restricted$'
    - path: /etc/ssh/sshd_config.d/60-codex-hermes-mcp.conf
      mode: "0644"
      marker: '(?m)^# Managed by Ansible\. Restrict this principal even when its authorized_keys$'
    - path: "{{ piserv_hermes_mcp_ssh_sudoers_path }}"
      mode: "0440"
      marker: '(?m)^# Managed by Ansible\. Permit only the no-argument Hermes MCP entry point\.$'
  register: piserv_hermes_mcp_ssh_privileged_artifact_state
  changed_when: false
  check_mode: false

- name: Authenticate existing privileged Hermes MCP SSH artifacts
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isreg
      - not item.stat.exists or not item.stat.islnk
      - not item.stat.exists or item.stat.pw_name == 'root'
      - not item.stat.exists or item.stat.gr_name == 'root'
      - not item.stat.exists or item.stat.mode == item.item.mode
    fail_msg: >-
      {{ item.item.path }} must be absent or a root-owned regular file with
      its managed mode before the Hermes MCP SSH policy can replace it.
  loop: "{{ piserv_hermes_mcp_ssh_privileged_artifact_state.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Read existing Hermes MCP SSH lifecycle state
  ansible.builtin.slurp:
    src: "{{ piserv_hermes_mcp_ssh_state_path }}"
  register: piserv_hermes_mcp_ssh_lifecycle_state_raw
  no_log: true
  when: piserv_hermes_mcp_ssh_privileged_artifact_state.results[0].stat.exists

- name: Decode existing Hermes MCP SSH lifecycle state
  ansible.builtin.set_fact:
    piserv_hermes_mcp_ssh_lifecycle_state: >-
      {{ piserv_hermes_mcp_ssh_lifecycle_state_raw.content | b64decode |
      from_json }}
  no_log: true
  when: piserv_hermes_mcp_ssh_privileged_artifact_state.results[0].stat.exists

- name: Require lifecycle provenance before adopting Hermes MCP SSH state
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_mcp_ssh_privileged_artifact_state.results[0].stat.exists or
        (piserv_hermes_mcp_ssh_account_passwd_record | length == 0 and
        piserv_hermes_mcp_ssh_account_group_record | length == 0 and
        piserv_hermes_mcp_ssh_account_path_state.results |
        selectattr('stat.exists') | list | length == 0 and
        piserv_hermes_mcp_ssh_privileged_artifact_state.results[1:] |
        selectattr('stat.exists') | list | length == 0)
      - >-
        not piserv_hermes_mcp_ssh_privileged_artifact_state.results[0].stat.exists or
        (piserv_hermes_mcp_ssh_lifecycle_state.schema ==
        'piserv-hermes-mcp-ssh-state-v1' and
        piserv_hermes_mcp_ssh_lifecycle_state.mcp_ssh_user ==
        piserv_hermes_mcp_ssh_user and
        piserv_hermes_mcp_ssh_lifecycle_state.mcp_ssh_group ==
        piserv_hermes_mcp_ssh_group and
        piserv_hermes_mcp_ssh_lifecycle_state.mcp_ssh_home ==
        piserv_hermes_mcp_ssh_home and
        piserv_hermes_mcp_ssh_lifecycle_state.authorized_keys_path ==
        piserv_hermes_mcp_ssh_authorized_keys_path and
        piserv_hermes_mcp_ssh_lifecycle_state.wrapper_path ==
        piserv_hermes_mcp_ssh_wrapper_path and
        piserv_hermes_mcp_ssh_lifecycle_state.sudoers_path ==
        piserv_hermes_mcp_ssh_sudoers_path and
        piserv_hermes_mcp_ssh_lifecycle_state.key_provenance ==
        piserv_hermes_mcp_ssh_key_provenance and
        piserv_hermes_mcp_ssh_lifecycle_state.key_source_user ==
        piserv_hermes_mcp_ssh_source_user and
        piserv_hermes_mcp_ssh_lifecycle_state.key_source_path ==
        piserv_hermes_mcp_ssh_source_authorized_keys_path and
        (piserv_hermes_mcp_ssh_lifecycle_state.phase | default('active')) in
        ['provisioning', 'active'])
    fail_msg: >-
      Refusing to adopt or rotate a Hermes MCP SSH identity without matching
      root-owned lifecycle provenance. Remove the complete old deployment with
      the documented rollback before changing its identity or key-management
      mode.

- name: Read markers from existing managed Hermes MCP SSH artifacts
  ansible.builtin.slurp:
    src: "{{ item.item.path }}"
  register: piserv_hermes_mcp_ssh_privileged_artifact_markers
  no_log: true
  when:
    - item.stat.exists
    - item.item.path != piserv_hermes_mcp_ssh_state_path
  loop: "{{ piserv_hermes_mcp_ssh_privileged_artifact_state.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Require managed markers before replacing Hermes MCP SSH artifacts
  ansible.builtin.assert:
    that:
      - item.content | b64decode is search(item.item.item.marker)
    fail_msg: >-
      {{ item.item.item.path }} lacks the expected managed marker and will not
      be replaced by the Hermes MCP SSH policy.
  no_log: true
  when: not (item.skipped | default(false))
  loop: "{{ piserv_hermes_mcp_ssh_privileged_artifact_markers.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item.path }}"

- name: Inspect every Hermes MCP SSH wrapper ancestor before mutation
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - path: /
      required: true
      mode: "0755"
    - path: /usr
      required: true
      mode: "0755"
    - path: /usr/local
      required: true
      mode: "0755"
    - path: /usr/local/libexec
      required: false
      mode: "0755"
      create_if_absent: true
      policy: managed-wrapper-directory
    - path: "{{ piserv_hermes_mcp_ssh_wrapper_path | dirname }}"
      required: false
      mode: "0755"
      create_if_absent: true
      policy: managed-wrapper-directory
    - path: "{{ piserv_hermes_mcp_ssh_sudoers_path | dirname }}"
      required: true
      mode: "0755"
      create_if_absent: false
      policy: safe-system-directory
    - path: /etc/ssh/sshd_config.d
      required: true
      mode: "0755"
      create_if_absent: false
      policy: safe-system-directory
  register: piserv_hermes_mcp_ssh_publication_parent_state
  changed_when: false
  check_mode: false

- name: Authenticate every Hermes MCP SSH wrapper ancestor before mutation
  ansible.builtin.assert:
    that:
      - item.stat.exists or not item.item.required
      - not item.stat.exists or item.stat.isdir
      - not item.stat.exists or not item.stat.islnk
      - not item.stat.exists or item.stat.pw_name == 'root'
      - not item.stat.exists or item.stat.gr_name == 'root'
      - >-
        not item.stat.exists or
        (item.item.policy == 'managed-wrapper-directory' and
        item.stat.mode == '0755') or
        ((item.item.policy | default('safe-system-directory')) == 'safe-system-directory' and
        item.stat.mode is match('^0?[0-7][0145][0145]$'))
    fail_msg: >-
      {{ item.item.path }} must be absent for managed creation or a root-owned,
      non-group-writable and non-world-writable system directory before
      privileged Hermes MCP SSH artifacts are published.
  loop: "{{ piserv_hermes_mcp_ssh_publication_parent_state.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Inspect the Hermes MCP SSH ancestor canonicalization executable
  ansible.builtin.stat:
    path: /usr/bin/realpath
    follow: false
  register: piserv_hermes_mcp_ssh_realpath_state
  changed_when: false
  check_mode: false

- name: Authenticate the Hermes MCP SSH ancestor canonicalization executable
  ansible.builtin.assert:
    that:
      - piserv_hermes_mcp_ssh_realpath_state.stat.exists
      - piserv_hermes_mcp_ssh_realpath_state.stat.isreg
      - not piserv_hermes_mcp_ssh_realpath_state.stat.islnk
      - piserv_hermes_mcp_ssh_realpath_state.stat.pw_name == 'root'
      - piserv_hermes_mcp_ssh_realpath_state.stat.gr_name == 'root'
      - piserv_hermes_mcp_ssh_realpath_state.stat.mode == '0755'
    fail_msg: >-
      /usr/bin/realpath must be a root-owned regular executable before it is
      used to authenticate Hermes MCP SSH wrapper ancestors.

- name: Canonicalize every existing Hermes MCP SSH wrapper ancestor before mutation
  ansible.builtin.command:
    argv:
      - /usr/bin/realpath
      - "{{ item.item.path }}"
  loop: "{{ piserv_hermes_mcp_ssh_publication_parent_state.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  register: piserv_hermes_mcp_ssh_publication_parent_canonical_state
  changed_when: false
  check_mode: false
  when: item.stat.exists

- name: Require exact canonical Hermes MCP SSH wrapper ancestors before mutation
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.item.path
    fail_msg: >-
      {{ item.item.item.path }} canonicalizes to {{ item.stdout }}. Refusing
      to publish a privileged Hermes MCP SSH artifact through another path.
  loop: "{{ piserv_hermes_mcp_ssh_publication_parent_canonical_state.results }}"
  loop_control:
    label: "{{ item.item.item.path }}"
  when: not (item.skipped | default(false))

- name: Inspect the administrator authorized keys selected for automatic copy
  ansible.builtin.stat:
    path: "{{ piserv_hermes_mcp_ssh_source_authorized_keys_path }}"
    follow: false
  register: piserv_hermes_mcp_ssh_source_authorized_keys_state
  changed_when: false
  check_mode: false
  no_log: true
  when: piserv_hermes_mcp_ssh_copy_admin_authorized_keys

- name: Require a private regular administrator authorized keys source
  ansible.builtin.assert:
    that:
      - piserv_hermes_mcp_ssh_source_authorized_keys_state.stat.exists
      - piserv_hermes_mcp_ssh_source_authorized_keys_state.stat.isreg
      - not piserv_hermes_mcp_ssh_source_authorized_keys_state.stat.islnk
      - >-
        piserv_hermes_mcp_ssh_source_authorized_keys_state.stat.pw_name ==
        piserv_hermes_mcp_ssh_source_user
      - >-
        piserv_hermes_mcp_ssh_source_authorized_keys_state.stat.gr_name ==
        piserv_hermes_mcp_ssh_source_user
      - piserv_hermes_mcp_ssh_source_authorized_keys_state.stat.mode == '0600'
    fail_msg: >-
      Automatic key copying requires a private, regular authorized_keys file
      owned by the configured administrator. Refusing to read another path.
  no_log: true
  when: piserv_hermes_mcp_ssh_copy_admin_authorized_keys

- name: Read administrator authorized keys for automatic MCP SSH access
  ansible.builtin.slurp:
    src: "{{ piserv_hermes_mcp_ssh_source_authorized_keys_path }}"
  register: piserv_hermes_mcp_ssh_source_authorized_keys
  no_log: true
  when: piserv_hermes_mcp_ssh_copy_admin_authorized_keys

- name: Normalize administrator public keys for automatic MCP SSH access
  ansible.builtin.set_fact:
    piserv_hermes_mcp_ssh_source_public_key_lines: >-
      {{ piserv_hermes_mcp_ssh_source_authorized_keys.content | b64decode |
      split('\n') | map('trim') | reject('equalto', '') |
      reject('match', '^#') | list }}
  no_log: true
  when: piserv_hermes_mcp_ssh_copy_admin_authorized_keys

- name: Reject administrator keys that already declare a forced command
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_mcp_ssh_source_authorized_keys.content | b64decode
        is not search('(^|\\s)command=')
    fail_msg: >-
      Automatic key copying cannot safely compose an existing SSH forced
      command with the Hermes MCP forced command. Use manual key management.
  no_log: true
  when: piserv_hermes_mcp_ssh_copy_admin_authorized_keys

- name: Require plain administrator public keys for automatic MCP SSH access
  ansible.builtin.assert:
    that:
      - piserv_hermes_mcp_ssh_source_public_key_lines | length > 0
      - >-
        piserv_hermes_mcp_ssh_source_public_key_lines |
        select('match',
        '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\\.com|sk-ecdsa-sha2-nistp256@openssh\\.com)\\s+[^\\s]+(?:\\s+.*)?$') |
        list | length == piserv_hermes_mcp_ssh_source_public_key_lines | length
    fail_msg: >-
      Automatic key copying requires at least one plain SSH public-key line.
      Keys with SSH options, including source restrictions, must be installed
      manually because their options cannot be safely composed.
  no_log: true
  when: piserv_hermes_mcp_ssh_copy_admin_authorized_keys

- name: Inspect the Hermes MCP runtime launch prerequisites
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - path: /usr/bin/systemd-run
      owner: root
      group: root
      mode: "0755"
  register: piserv_hermes_mcp_ssh_runtime_prerequisite_state
  changed_when: false
  check_mode: false

- name: Authenticate the Hermes MCP runtime launch prerequisites
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - not item.stat.islnk
      - item.stat.pw_name == item.item.owner
      - item.stat.gr_name == item.item.group
      - item.stat.mode == item.item.mode
    fail_msg: >-
      {{ item.item.path }} must be a private, regular, non-symlinked runtime
      launch prerequisite with its expected owner and mode.
  loop: "{{ piserv_hermes_mcp_ssh_runtime_prerequisite_state.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not ansible_check_mode

- name: Create the Hermes MCP SSH libexec parent directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: >-
    not (piserv_hermes_mcp_ssh_publication_parent_state.results |
    selectattr('item.path', 'equalto', '/usr/local/libexec') |
    map(attribute='stat.exists') | first)

- name: Create the dedicated Hermes MCP SSH wrapper directory
  ansible.builtin.file:
    path: "{{ piserv_hermes_mcp_ssh_wrapper_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: >-
    not (piserv_hermes_mcp_ssh_publication_parent_state.results |
    selectattr('item.path', 'equalto', piserv_hermes_mcp_ssh_wrapper_path | dirname) |
    map(attribute='stat.exists') | first)

- name: Provision Hermes MCP SSH lifecycle provenance before account mutation
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/hermes-mcp-ssh-state.json.j2"
    dest: "{{ piserv_hermes_mcp_ssh_state_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Install SSH forced-command policy before publishing MCP keys
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/hermes-mcp-ssh-sshd.conf.j2"
    dest: /etc/ssh/sshd_config.d/60-codex-hermes-mcp.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH service

- name: Validate the complete SSH daemon configuration before publishing MCP keys
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -t
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Activate SSH forced-command policy before publishing MCP keys
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode

- name: Create Hermes MCP SSH system group
  ansible.builtin.group:
    name: "{{ piserv_hermes_mcp_ssh_group }}"
    system: true
    state: present

- name: Create password-locked Hermes MCP SSH system user
  ansible.builtin.user:
    name: "{{ piserv_hermes_mcp_ssh_user }}"
    group: "{{ piserv_hermes_mcp_ssh_group }}"
    groups: []
    append: false
    home: "{{ piserv_hermes_mcp_ssh_home }}"
    create_home: true
    shell: /bin/sh
    password_lock: true
    system: true
    state: present

- name: Set dedicated Hermes MCP SSH home permissions
  ansible.builtin.file:
    path: "{{ piserv_hermes_mcp_ssh_home }}"
    state: directory
    owner: "{{ piserv_hermes_mcp_ssh_user }}"
    group: "{{ piserv_hermes_mcp_ssh_group }}"
    mode: "0750"

- name: Create private Hermes MCP SSH directory
  ansible.builtin.file:
    path: "{{ piserv_hermes_mcp_ssh_home }}/.ssh"
    state: directory
    owner: "{{ piserv_hermes_mcp_ssh_user }}"
    group: "{{ piserv_hermes_mcp_ssh_group }}"
    mode: "0700"

- name: Inspect existing Hermes MCP SSH authorized keys file
  ansible.builtin.stat:
    path: "{{ piserv_hermes_mcp_ssh_authorized_keys_path }}"
    follow: false
  register: piserv_hermes_mcp_ssh_authorized_keys_state
  changed_when: false
  check_mode: false

- name: Require a safe existing Hermes MCP SSH authorized keys file
  ansible.builtin.assert:
    that:
      - >-
        not piserv_hermes_mcp_ssh_authorized_keys_state.stat.exists or
        (piserv_hermes_mcp_ssh_authorized_keys_state.stat.isreg and
        not piserv_hermes_mcp_ssh_authorized_keys_state.stat.islnk and
        piserv_hermes_mcp_ssh_authorized_keys_state.stat.pw_name ==
        piserv_hermes_mcp_ssh_user and
        piserv_hermes_mcp_ssh_authorized_keys_state.stat.gr_name ==
        piserv_hermes_mcp_ssh_group and
        piserv_hermes_mcp_ssh_authorized_keys_state.stat.mode == '0600')
    fail_msg: >-
      An existing Hermes MCP SSH authorized_keys file must be a private regular
      file owned by the dedicated account; it is never normalized or replaced.

- name: Read the automatic Hermes MCP SSH authorized keys marker
  ansible.builtin.slurp:
    src: "{{ piserv_hermes_mcp_ssh_authorized_keys_path }}"
  register: piserv_hermes_mcp_ssh_authorized_keys_marker
  no_log: true
  when:
    - piserv_hermes_mcp_ssh_copy_admin_authorized_keys
    - piserv_hermes_mcp_ssh_authorized_keys_state.stat.exists

- name: Require the automatic Hermes MCP SSH authorized keys marker
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_mcp_ssh_authorized_keys_marker.content | b64decode is
        search('(?m)^### Managed by Ansible: automatic administrator key copy for Hermes MCP SSH\\.$')
    fail_msg: >-
      Automatic Hermes MCP SSH authorized_keys must carry its managed marker
      before it can be refreshed from administrator keys.
  no_log: true
  when:
    - piserv_hermes_mcp_ssh_copy_admin_authorized_keys
    - piserv_hermes_mcp_ssh_authorized_keys_state.stat.exists

- name: Create an empty operator-managed Hermes MCP SSH authorized keys file
  ansible.builtin.copy:
    content: ""
    dest: "{{ piserv_hermes_mcp_ssh_authorized_keys_path }}"
    owner: "{{ piserv_hermes_mcp_ssh_user }}"
    group: "{{ piserv_hermes_mcp_ssh_group }}"
    mode: "0600"
    force: false
  when: not piserv_hermes_mcp_ssh_copy_admin_authorized_keys

- name: Publish restricted copies of administrator SSH public keys
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/hermes-mcp-ssh-authorized_keys.j2"
    dest: "{{ piserv_hermes_mcp_ssh_authorized_keys_path }}"
    owner: "{{ piserv_hermes_mcp_ssh_user }}"
    group: "{{ piserv_hermes_mcp_ssh_group }}"
    mode: "0600"
  no_log: true
  when: piserv_hermes_mcp_ssh_copy_admin_authorized_keys

- name: Install root-owned Hermes MCP SSH wrapper
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/hermes-mcp-ssh-wrapper.sh.j2"
    dest: "{{ piserv_hermes_mcp_ssh_wrapper_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Install restricted Hermes MCP SSH sudoers policy
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/hermes-mcp-ssh-sudoers.j2"
    dest: "{{ piserv_hermes_mcp_ssh_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Mark Hermes MCP SSH lifecycle provenance active after sudoers publication
  ansible.builtin.set_fact:
    piserv_hermes_mcp_ssh_lifecycle_phase: active

- name: Publish active Hermes MCP SSH lifecycle provenance
  ansible.builtin.template:
    src: "{{ playbook_dir }}/templates/hermes-mcp-ssh-state.json.j2"
    dest: "{{ piserv_hermes_mcp_ssh_state_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Verify the dedicated Hermes MCP SSH account has only the wrapper privilege
  ansible.builtin.command:
    argv:
      - /usr/bin/sudo
      - -n
      - -l
      - -U
      - "{{ piserv_hermes_mcp_ssh_user }}"
  register: piserv_hermes_mcp_ssh_sudo_policy
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Require the exact Hermes MCP SSH sudo privilege
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_mcp_ssh_sudo_policy.stdout is regex(
          '(?m)^\s*\(root\) NOPASSWD: '
          ~ (piserv_hermes_mcp_ssh_wrapper_path | regex_escape)
          ~ ' ""$'
        )
      - >-
        piserv_hermes_mcp_ssh_sudo_policy.stdout is not regex(
          '(?m)^\s*\(ALL\s*: ALL\) ALL$|\(ALL\) NOPASSWD: ALL'
        )
      - >-
        piserv_hermes_mcp_ssh_sudo_policy.stdout |
        regex_findall('(?m)^\s*\([^)]*\)(?:\s+NOPASSWD:)?\s+.*$') |
        length == 1
    fail_msg: >-
      The MCP SSH account must have exactly one no-argument sudo command and
      no broad sudo privilege.
  when: not ansible_check_mode
