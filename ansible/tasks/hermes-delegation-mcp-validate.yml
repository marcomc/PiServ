---
- name: Require bounded Hermes delegation MCP adapter settings
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_delegation_mcp_adapter_path is match(
        '^/usr/local/libexec/hermes-agent/[a-z0-9_-]+\.py$')
      - >-
        piserv_hermes_delegation_mcp_python_path is match(
        '^/usr/local/lib/hermes-agent/venv/bin/python$')
      - >-
        piserv_hermes_delegation_mcp_config_path is match(
        '^/usr/local/lib/hermes-agent/\.hermes-delegation-config\.yaml$')
      - >-
        piserv_hermes_delegation_mcp_broker_path is match(
        '^/usr/local/libexec/hermes-agent/[a-z0-9_-]+\.py$')
      - >-
        piserv_hermes_delegation_mcp_broker_wrapper_path is match(
        '^/usr/local/libexec/hermes-agent/[a-z0-9_-]+$')
      - >-
        piserv_hermes_delegation_mcp_broker_sudoers_path is match(
        '^/etc/sudoers\.d/[a-z0-9_-]+$')
      - piserv_hermes_delegation_mcp_timeout_seconds is integer
      - piserv_hermes_delegation_mcp_timeout_seconds >= 30
      - piserv_hermes_delegation_mcp_timeout_seconds <= 1800
      - piserv_hermes_delegation_mcp_terminate_grace_seconds is integer
      - piserv_hermes_delegation_mcp_terminate_grace_seconds >= 1
      - piserv_hermes_delegation_mcp_terminate_grace_seconds <= 30
      - >-
        piserv_hermes_delegation_mcp_terminate_grace_seconds <
        piserv_hermes_delegation_mcp_timeout_seconds
      - piserv_hermes_delegation_mcp_max_prompt_bytes is integer
      - piserv_hermes_delegation_mcp_max_prompt_bytes >= 1024
      - piserv_hermes_delegation_mcp_max_prompt_bytes <= 131072
      - piserv_hermes_delegation_mcp_max_output_bytes is integer
      - piserv_hermes_delegation_mcp_max_output_bytes >= 65536
      - piserv_hermes_delegation_mcp_max_output_bytes <= 8388608
      - piserv_hermes_delegation_mcp_max_turns is integer
      - piserv_hermes_delegation_mcp_max_turns >= 1
      - piserv_hermes_delegation_mcp_max_turns <= 500
      - piserv_hermes_delegation_mcp_memory_max_bytes is integer
      - piserv_hermes_delegation_mcp_memory_max_bytes >= 268435456
      - piserv_hermes_delegation_mcp_memory_max_bytes <= 3221225472
      - piserv_hermes_delegation_mcp_limit_as_bytes is integer
      - piserv_hermes_delegation_mcp_limit_as_bytes >= 268435456
      - piserv_hermes_delegation_mcp_limit_as_bytes <= 3221225472
      - >-
        piserv_hermes_delegation_mcp_memory_max_bytes <=
        piserv_hermes_delegation_mcp_limit_as_bytes
      - piserv_hermes_delegation_mcp_broker_max_frame_bytes is integer
      - piserv_hermes_delegation_mcp_broker_max_frame_bytes >= 65536
      - piserv_hermes_delegation_mcp_broker_max_frame_bytes <= 8388608
      - >-
        piserv_hermes_delegation_mcp_broker_max_frame_bytes >=
        piserv_hermes_delegation_mcp_max_prompt_bytes
      - piserv_hermes_delegation_mcp_native_toolsets is sequence
      - piserv_hermes_delegation_mcp_native_toolsets is not string
      - >-
        piserv_hermes_delegation_mcp_native_toolsets | sort ==
        ['delegation', 'file', 'memory', 'session_search', 'skills',
        'terminal', 'todo']
      - piserv_hermes_delegation_mcp_integration_toolsets is sequence
      - piserv_hermes_delegation_mcp_integration_toolsets is not string
      - >-
        piserv_hermes_delegation_mcp_integration_toolsets | unique | list |
        length == piserv_hermes_delegation_mcp_integration_toolsets | length
      - >-
        piserv_hermes_delegation_mcp_integration_toolsets |
        reject('match', '^[a-z0-9][a-z0-9_-]*$') | list | length == 0
      - >-
        piserv_hermes_delegation_mcp_integration_toolsets ==
        ([piserv_hermes_agent_home_assistant_mcp_name]
        if piserv_hermes_agent_manage_home_assistant_mcp else [])
      - hermes_agent_binary_path is match('^/')
    fail_msg: >-
      Hermes delegation MCP settings must use fixed managed paths and bounded
      prompt, output, turn, frame, memory, address-space, grace, and runtime
      limits, with the Home Assistant integration enabled only when managed.
