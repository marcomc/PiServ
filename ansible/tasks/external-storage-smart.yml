---
- name: Install external storage SMART health tooling
  ansible.builtin.apt:
    name: smartmontools
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: piserv_external_storage_smartmontools_package
  become: true

- name: Validate external storage SMART health when tooling is available
  when: >-
    not ansible_check_mode or
    not (piserv_external_storage_smartmontools_package.changed | default(false))
  block:
    - name: Try external storage SMART health autodetection
      ansible.builtin.command:
        argv:
          - /usr/sbin/smartctl
          - -H
          - "{{ piserv_external_storage_device }}"
      register: piserv_external_storage_smart_auto
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Try ASMedia NVMe SMART pass-through when autodetection fails
      ansible.builtin.command:
        argv:
          - /usr/sbin/smartctl
          - -H
          - -d
          - sntasmedia
          - "{{ piserv_external_storage_device }}"
      register: piserv_external_storage_smart_bridge
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - piserv_external_storage_smart_auto.rc != 0
        - piserv_external_storage_smart_device_type == 'sntasmedia'

    - name: Select the successful external storage SMART probe
      ansible.builtin.set_fact:
        piserv_external_storage_smart_result: >-
          {{ piserv_external_storage_smart_bridge
             if (not (piserv_external_storage_smart_bridge.skipped | default(false)) and
                 (piserv_external_storage_smart_bridge.rc | default(1)) == 0)
             else piserv_external_storage_smart_auto }}

    - name: Report unavailable external storage SMART health
      ansible.builtin.debug:
        msg: >-
          External storage SMART health is unavailable through the discovered USB
          bridge. Autodetection returned {{ piserv_external_storage_smart_auto.rc }}:
          {{ piserv_external_storage_smart_auto.stdout | trim }}
          {% if not (piserv_external_storage_smart_bridge.skipped | default(false)) %}
          ASMedia pass-through returned {{ piserv_external_storage_smart_bridge.rc | default(1) }}:
          {{ piserv_external_storage_smart_bridge.stdout | default('') | trim }}
          {% endif %}
      when: >-
        piserv_external_storage_smart_result.rc != 0 or
        'SMART overall-health self-assessment test result: PASSED'
        not in piserv_external_storage_smart_result.stdout

    - name: Require passing external storage SMART health when configured
      ansible.builtin.assert:
        that:
          - piserv_external_storage_smart_result.rc == 0
          - >-
            'SMART overall-health self-assessment test result: PASSED'
            in piserv_external_storage_smart_result.stdout
        fail_msg: >-
          External storage SMART health validation failed. Autodetection returned
          {{ piserv_external_storage_smart_auto.rc }}:
          {{ piserv_external_storage_smart_auto.stdout | trim }}
          {% if not (piserv_external_storage_smart_bridge.skipped | default(false)) %}
          ASMedia pass-through returned {{ piserv_external_storage_smart_bridge.rc | default(1) }}:
          {{ piserv_external_storage_smart_bridge.stdout | default('') | trim }}
          {% endif %}
      when: piserv_external_storage_smart_required | bool
