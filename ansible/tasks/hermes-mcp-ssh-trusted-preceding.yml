---
- name: Require exact trusted preceding Hermes MCP SSH Match policies
  ansible.builtin.assert:
    that:
      - >-
        piserv_hermes_mcp_ssh_preceding_sshd_config.results |
        selectattr('item', 'equalto', item.path) | list | length == 1
      - >-
        (piserv_hermes_mcp_ssh_preceding_sshd_config.results |
        selectattr('item', 'equalto', item.path) |
        map(attribute='content') | first | b64decode) is search(
        '(?m)^# Managed by Ansible\\. Restrict this principal even when its authorized_keys$')
      - >-
        (piserv_hermes_mcp_ssh_preceding_sshd_config.results |
        selectattr('item', 'equalto', item.path) |
        map(attribute='content') | first | b64decode) is search(
        '(?m)^Match User ' ~ (item.user | regex_escape) ~ '$')
      - >-
        (piserv_hermes_mcp_ssh_preceding_sshd_config.results |
        selectattr('item', 'equalto', item.path) |
        map(attribute='content') | first | b64decode) is search(
        '(?m)^    AuthorizedKeysFile ' ~
        (item.authorized_keys_path | regex_escape) ~ '$')
      - >-
        (piserv_hermes_mcp_ssh_preceding_sshd_config.results |
        selectattr('item', 'equalto', item.path) |
        map(attribute='content') | first | b64decode) is search(
        '(?m)^    ForceCommand /usr/bin/sudo -n ' ~
        (item.wrapper_path | regex_escape) ~ '$')
      - >-
        (piserv_hermes_mcp_ssh_preceding_sshd_config.results |
        selectattr('item', 'equalto', item.path) |
        map(attribute='content') | first | b64decode) is search(
        '(?m)^Match all\\s*$')
      - >-
        ((piserv_hermes_mcp_ssh_preceding_sshd_config.results |
        selectattr('item', 'equalto', item.path) |
        map(attribute='content') | first | b64decode) |
        regex_findall('(?im)^\\s*Match\\s+')) | length == 2
      - >-
        (piserv_hermes_mcp_ssh_preceding_sshd_config.results |
        selectattr('item', 'equalto', item.path) |
        map(attribute='content') | first | b64decode) is not search(
        '(?im)^\\s*Include\\s+')
    fail_msg: >-
      {{ item.path }} is not the exact authenticated managed sibling Match
      policy required before this Hermes MCP SSH endpoint.
  loop: "{{ piserv_hermes_mcp_ssh_trusted_preceding_match_configs }}"
  loop_control:
    label: "{{ item.path }}"
