---
- name: Manage jackett-search source parent directory
  ansible.builtin.include_tasks: source-parent.yml

- name: Ensure jackett-search source directory exists
  ansible.builtin.file:
    path: "{{ jackett_search_source_dir }}"
    state: directory
    owner: "{{ jackett_search_runtime_user }}"
    group: "{{ jackett_search_runtime_group }}"
    mode: "0755"
  become: true

- name: Check out jackett-search source
  ansible.builtin.git:
    repo: "{{ jackett_search_repo_url }}"
    dest: "{{ jackett_search_source_dir }}"
    version: "{{ jackett_search_repo_version }}"
    update: "{{ jackett_search_repo_update }}"
    force: "{{ jackett_search_repo_force }}"
  become: true
  become_user: "{{ jackett_search_runtime_user }}"
  register: jackett_search_git_checkout
