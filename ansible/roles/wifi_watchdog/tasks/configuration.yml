---
- name: Inspect Wi-Fi watchdog script ancestors
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr
    - /usr/local
  register: wifi_watchdog_script_ancestors
  become: true

- name: Require trusted Wi-Fi watchdog script ancestors
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir
      - item.stat.uid == 0
      - item.stat.mode[-2] not in ['2', '3', '6', '7']
      - item.stat.mode[-1] not in ['2', '3', '6', '7']
    fail_msg: >-
      The existing {{ item.item }} ancestor must be root-owned and not writable
      by its group or other users before installing a root-executed watchdog.
  loop: "{{ wifi_watchdog_script_ancestors.results }}"

- name: Inspect Wi-Fi watchdog script parent
  ansible.builtin.stat:
    path: "{{ wifi_watchdog_script_path | dirname }}"
  register: wifi_watchdog_script_parent
  become: true

- name: Create missing Wi-Fi watchdog script parent
  ansible.builtin.file:
    path: "{{ wifi_watchdog_script_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not wifi_watchdog_script_parent.stat.exists
  become: true

- name: Inspect Wi-Fi watchdog service parent
  ansible.builtin.stat:
    path: "{{ wifi_watchdog_service_path | dirname }}"
  register: wifi_watchdog_service_parent
  become: true

- name: Require a trusted existing Wi-Fi watchdog script parent
  ansible.builtin.assert:
    that:
      - wifi_watchdog_script_parent.stat.uid == 0
      - wifi_watchdog_script_parent.stat.mode[-2] not in ['2', '3', '6', '7']
      - wifi_watchdog_script_parent.stat.mode[-1] not in ['2', '3', '6', '7']
    fail_msg: >-
      The existing {{ wifi_watchdog_script_path | dirname }} parent must be root-owned and not writable
      by its group or other users before installing a root-executed watchdog.
  when: wifi_watchdog_script_parent.stat.exists

- name: Require a trusted existing Wi-Fi watchdog service parent
  ansible.builtin.assert:
    that:
      - wifi_watchdog_service_parent.stat.uid == 0
      - wifi_watchdog_service_parent.stat.mode[-2] not in ['2', '3', '6', '7']
      - wifi_watchdog_service_parent.stat.mode[-1] not in ['2', '3', '6', '7']
    fail_msg: >-
      The existing {{ wifi_watchdog_service_path | dirname }} parent must be root-owned and not writable
      by its group or other users before installing a root-executed watchdog.
  when: wifi_watchdog_service_parent.stat.exists

- name: Inspect configured active reboot-mode control
  ansible.builtin.stat:
    path: "{{ wifi_watchdog_reboot_mode_path }}"
    follow: false
  register: wifi_watchdog_reboot_mode_control
  changed_when: false
  check_mode: false
  when: wifi_watchdog_required_reboot_mode | length > 0
  become: true

- name: Require a safe configured active reboot-mode control
  ansible.builtin.assert:
    that:
      - wifi_watchdog_reboot_mode_control.stat.exists
      - wifi_watchdog_reboot_mode_control.stat.isreg
      - not wifi_watchdog_reboot_mode_control.stat.islnk
      - wifi_watchdog_reboot_mode_control.stat.uid == 0
      - wifi_watchdog_reboot_mode_control.stat.mode[-2] not in ['2', '3', '6', '7']
      - wifi_watchdog_reboot_mode_control.stat.mode[-1] not in ['2', '3', '6', '7']
    fail_msg: >-
      The configured active reboot-mode control must be a root-owned,
      non-symlink regular file that is not writable by group or other users.
  when: wifi_watchdog_required_reboot_mode | length > 0

- name: Read configured active reboot mode
  ansible.builtin.slurp:
    path: "{{ wifi_watchdog_reboot_mode_path }}"
  register: wifi_watchdog_reboot_mode
  changed_when: false
  check_mode: false
  when: wifi_watchdog_required_reboot_mode | length > 0
  become: true

- name: Require configured active reboot mode before enabling automatic reboot
  ansible.builtin.assert:
    that:
      - >-
        wifi_watchdog_reboot_mode.content | b64decode | trim ==
        wifi_watchdog_required_reboot_mode
    fail_msg: >-
      Automatic reboot requires {{ wifi_watchdog_reboot_mode_path }} to report
      {{ wifi_watchdog_required_reboot_mode }} before the watchdog is enabled.
  when: wifi_watchdog_required_reboot_mode | length > 0

- name: Create missing Wi-Fi watchdog service parent
  ansible.builtin.file:
    path: "{{ wifi_watchdog_service_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not wifi_watchdog_service_parent.stat.exists
  become: true

- name: Inspect Wi-Fi watchdog service unit
  ansible.builtin.stat:
    path: "{{ wifi_watchdog_service_path }}"
  register: wifi_watchdog_service_unit
  become: true

- name: Install Wi-Fi watchdog
  become: true
  block:
    - name: Install Wi-Fi watchdog script
      ansible.builtin.template:
        src: wifi-connectivity-watchdog.sh.j2
        dest: "{{ wifi_watchdog_script_path }}"
        owner: root
        group: root
        mode: "0750"
      when: not ansible_check_mode or wifi_watchdog_script_parent.stat.exists
      notify: Restart Wi-Fi watchdog

    - name: Install Wi-Fi watchdog service
      ansible.builtin.template:
        src: wifi-connectivity-watchdog.service.j2
        dest: "{{ wifi_watchdog_service_path }}"
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode or wifi_watchdog_service_parent.stat.exists
      notify:
        - Reload systemd
        - Restart Wi-Fi watchdog

    - name: Enable Wi-Fi watchdog service
      ansible.builtin.systemd:
        name: "{{ wifi_watchdog_service_name }}"
        daemon_reload: true
        enabled: true
        state: started
      when: not ansible_check_mode or wifi_watchdog_service_unit.stat.exists
