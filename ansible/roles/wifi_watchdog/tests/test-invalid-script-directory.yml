---
- name: Reject a Wi-Fi watchdog script outside the trusted system directory
  hosts: localhost
  gather_facts: false
  vars:
    wifi_watchdog_script_path: /opt/wifi-connectivity-watchdog
  tasks:
    - name: Validate role input
      ansible.builtin.include_role:
        name: wifi_watchdog
        tasks_from: validate-input.yml
