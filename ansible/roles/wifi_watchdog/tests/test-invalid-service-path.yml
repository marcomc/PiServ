---
- name: Reject a Wi-Fi watchdog service path with another unit filename
  hosts: localhost
  gather_facts: false
  vars:
    wifi_watchdog_service_name: wifi-connectivity-watchdog.service
    wifi_watchdog_service_path: /etc/systemd/system/other.service
  tasks:
    - name: Validate role input
      ansible.builtin.include_role:
        name: wifi_watchdog
        tasks_from: validate-input.yml
