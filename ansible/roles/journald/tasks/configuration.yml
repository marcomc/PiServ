---
- name: Inspect the journald drop-in parent
  ansible.builtin.stat:
    path: "{{ journald_dropin_path | dirname }}"
  register: journald_dropin_parent

- name: Create a missing journald drop-in parent
  ansible.builtin.file:
    path: "{{ journald_dropin_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: not journald_dropin_parent.stat.exists

- name: Configure journald policy
  ansible.builtin.template:
    src: journald.conf.j2
    dest: "{{ journald_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: not ansible_check_mode or journald_dropin_parent.stat.exists
  notify: Restart and flush systemd-journald
