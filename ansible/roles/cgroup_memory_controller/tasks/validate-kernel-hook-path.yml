---
- name: Read cgroup memory-controller kernel hook paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - path: /etc
      required: true
      kind: directory
    - path: /etc/kernel
      required: true
      kind: directory
    - path: /etc/kernel/postinst.d
      required: false
      kind: directory
    - path: "{{ cgroup_memory_controller_kernel_hook_path }}"
      required: false
      kind: file
  register: cgroup_memory_controller_kernel_hook_paths
  changed_when: false
  become: true

- name: Require safe cgroup memory-controller kernel hook paths
  ansible.builtin.assert:
    that:
      - item.stat.exists or not item.item.required
      - >-
        not item.stat.exists
        or (item.item.kind == 'directory' and item.stat.isdir | default(false))
        or (item.item.kind == 'file' and item.stat.isreg | default(false))
      - not item.stat.exists or not (item.stat.islnk | default(false))
      - not item.stat.exists or (item.stat.uid | default(-1)) == 0
      - >-
        not item.stat.exists
        or (item.stat.mode | default('0000'))[-2]
        not in ['2', '3', '6', '7']
      - >-
        not item.stat.exists
        or (item.stat.mode | default('0000'))[-1]
        not in ['2', '3', '6', '7']
    fail_msg: >-
      {{ item.item.path }} must be a root-owned {{ item.item.kind }} that is not
      writable by its group or other users before managing a root-executed
      kernel hook. Mandatory ancestors must already exist; the final hook target
      may be absent.
  loop: "{{ cgroup_memory_controller_kernel_hook_paths.results }}"
