---
- name: Test cgroup_memory_controller input validation
  hosts: localhost
  gather_facts: false
  vars:
    cgroup_memory_controller_test_role_path: "{{ playbook_dir | dirname }}"
  tasks:
    - name: Reject a managed DTB path that does not match its configured name
      block:
        - name: Validate inconsistent cgroup memory-controller DTB input
          ansible.builtin.include_role:
            name: "{{ cgroup_memory_controller_test_role_path }}"
            tasks_from: configuration.yml
          vars:
            cgroup_memory_controller_vendor_dtb: /boot/firmware/example.dtb
            cgroup_memory_controller_managed_dtb_name: expected.dtb
            cgroup_memory_controller_managed_dtb_path: >-
              /boot/firmware/different.dtb

        - name: Require inconsistent managed DTB input to fail validation
          ansible.builtin.fail:
            msg: The inconsistent managed DTB input unexpectedly passed validation.
      rescue:
        - name: Assert inconsistent managed DTB input failed validation
          ansible.builtin.assert:
            that:
              - >-
                'policy requires safe absolute paths'
                in ansible_failed_result.msg

    - name: Reject a non-atomic disabled boot argument
      block:
        - name: Validate malformed cgroup memory-controller boot argument
          ansible.builtin.include_role:
            name: "{{ cgroup_memory_controller_test_role_path }}"
            tasks_from: configuration.yml
          vars:
            cgroup_memory_controller_vendor_dtb: /boot/firmware/example.dtb
            cgroup_memory_controller_disabled_argument: cgroup_disable memory

        - name: Require malformed boot argument to fail validation
          ansible.builtin.fail:
            msg: The malformed boot argument unexpectedly passed validation.
      rescue:
        - name: Assert malformed boot argument failed validation
          ansible.builtin.assert:
            that:
              - >-
                'policy requires safe absolute paths'
                in ansible_failed_result.msg

    - name: Reject reserved cgroup memory-controller backup filenames
      ansible.builtin.include_tasks: assert-invalid-backup-filename.yml
      loop:
        - .
        - ..
      loop_control:
        loop_var: cgroup_memory_controller_invalid_backup_filename

    - name: Reject aliased cgroup memory-controller backup filenames
      block:
        - name: Validate aliased cgroup memory-controller backup filenames
          ansible.builtin.include_role:
            name: "{{ cgroup_memory_controller_test_role_path }}"
            tasks_from: configuration.yml
          vars:
            cgroup_memory_controller_vendor_dtb: /boot/firmware/example.dtb
            cgroup_memory_controller_config_backup_filename: shared.backup
            cgroup_memory_controller_vendor_dtb_backup_filename: shared.backup

        - name: Require aliased backup filenames to fail validation
          ansible.builtin.fail:
            msg: The aliased backup filenames unexpectedly passed validation.
      rescue:
        - name: Assert aliased backup filenames failed validation
          ansible.builtin.assert:
            that:
              - "'policy requires safe absolute paths' in ansible_failed_result.msg"
