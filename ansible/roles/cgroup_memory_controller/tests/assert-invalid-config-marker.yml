---
- name: Reject unsafe configuration marker
  block:
    - name: Validate unsafe cgroup memory-controller marker
      ansible.builtin.include_role:
        name: "{{ cgroup_memory_controller_test_role_path }}"
        tasks_from: configuration.yml
      vars:
        cgroup_memory_controller_vendor_dtb: /boot/firmware/example.dtb
        cgroup_memory_controller_config_marker: >-
          {{ cgroup_memory_controller_invalid_marker_case.value }}

    - name: Require unsafe marker to fail validation
      ansible.builtin.fail:
        msg: >-
          The {{ cgroup_memory_controller_invalid_marker_case.name }} marker
          unexpectedly passed validation.
  rescue:
    - name: Assert unsafe marker failed validation
      ansible.builtin.assert:
        that:
          - "'policy requires safe absolute paths' in ansible_failed_result.msg"
