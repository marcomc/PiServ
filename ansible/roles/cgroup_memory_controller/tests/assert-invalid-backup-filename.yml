---
- name: Reject reserved backup filename
  block:
    - name: Validate reserved cgroup memory-controller backup filename
      ansible.builtin.include_role:
        name: "{{ cgroup_memory_controller_test_role_path }}"
        tasks_from: configuration.yml
      vars:
        cgroup_memory_controller_vendor_dtb: /boot/firmware/example.dtb
        cgroup_memory_controller_config_backup_filename: >-
          {{ cgroup_memory_controller_invalid_backup_filename.config_filename }}
        cgroup_memory_controller_vendor_dtb_backup_filename: >-
          {{ cgroup_memory_controller_invalid_backup_filename.vendor_filename }}

    - name: Require reserved backup filename to fail validation
      ansible.builtin.fail:
        msg: >-
          The {{ cgroup_memory_controller_invalid_backup_filename.name }}
          filename unexpectedly passed validation.
  rescue:
    - name: Assert reserved backup filename failed validation
      ansible.builtin.assert:
        that:
          - "'policy requires safe absolute paths' in ansible_failed_result.msg"
