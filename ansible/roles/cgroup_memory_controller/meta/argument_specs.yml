---
argument_specs:
  main:
    short_description: Enable the cgroup v2 memory controller through a Device Tree overlay.
    description:
      - Builds and validates a Device Tree overlay that removes one vendor boot argument.
      - Supports explicit rollback without changing the vendor Device Tree Blob.
    options:
      cgroup_memory_controller_manage:
        type: bool
        default: true
        description: Whether to manage the cgroup v2 memory-controller boot policy.
      cgroup_memory_controller_enabled:
        type: bool
        default: true
        description: Whether the managed overlay should enable the memory controller.
      cgroup_memory_controller_require_runtime:
        type: bool
        default: false
        description: Whether to require active cgroup and optional systemd-service validation.
      cgroup_memory_controller_packages:
        type: list
        elements: str
        description: Packages required to generate and validate the Device Tree overlay.
      cgroup_memory_controller_vendor_dtb:
        type: path
        required: true
        description: Vendor Device Tree Blob used as the overlay source.
      cgroup_memory_controller_config_path:
        type: path
        default: /boot/firmware/config.txt
        description: Firmware configuration file that loads the managed overlay.
      cgroup_memory_controller_overlay_name:
        type: str
        default: ansible-enable-cgroup-memory
        description: Overlay name without the .dtbo suffix.
      cgroup_memory_controller_overlay_path:
        type: path
        default: /boot/firmware/overlays/ansible-enable-cgroup-memory.dtbo
        description: Destination path for the managed overlay.
      cgroup_memory_controller_disabled_argument:
        type: str
        default: cgroup_disable=memory
        description: Exact vendor boot argument removed by the managed overlay.
      cgroup_memory_controller_helper_path:
        type: path
        default: /usr/local/libexec/cgroup-memory-controller/enable-cgroup-memory-overlay
        description: Root-owned helper that validates and generates the boot overlay.
      cgroup_memory_controller_kernel_hook_path:
        type: path
        default: /etc/kernel/postinst.d/zz-ansible-cgroup-memory-controller
        description: Kernel post-install hook that refreshes the overlay after a DTB update.
      cgroup_memory_controller_kernel_refresh_dependency_path:
        type: path
        default: ""
        description: Optional earlier kernel hook that refreshes the vendor DTB.
      cgroup_memory_controller_backup_dir:
        type: path
        default: /var/lib/ansible/cgroup-memory-controller
        description: Root-only directory retaining initial boot artifacts and source state.
      cgroup_memory_controller_config_backup_filename:
        type: str
        default: config.before-cgroup-memory-controller
        description: Basename used for the initial firmware configuration backup.
      cgroup_memory_controller_vendor_dtb_backup_filename:
        type: str
        default: vendor.dtb.before-cgroup-memory-controller
        description: Basename used for the initial vendor DTB backup.
      cgroup_memory_controller_config_marker:
        type: str
        default: "ANSIBLE MANAGED: cgroup v2 memory controller"
        description: Marker text for the managed firmware configuration block.
      cgroup_memory_controller_runtime_systemd_service:
        type: str
        default: ""
        description: Optional systemd service whose cgroup must expose memory.events.
