---
- name: Validate I2C device exists
  ansible.builtin.stat:
    path: "{{ freenove_case_i2c_device }}"
  register: freenove_case_i2c_device_stat

- name: Require I2C device after setup
  ansible.builtin.assert:
    that:
      - freenove_case_i2c_device_stat.stat.exists
    fail_msg: "{{ freenove_case_i2c_device }} is missing. Reboot may be required after enabling I2C."

- name: Validate Freenove Python runtime imports
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "import luma.oled; import PyQt5; import psutil; import smbus"
  changed_when: false

- name: Validate Freenove Python source syntax
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "import ast, pathlib, sys; [ast.parse(pathlib.Path(path).read_text(encoding='utf-8'), filename=path) for path in sys.argv[1:]]"
      - "{{ freenove_case_install_dir }}/Code/app_ui.py"
      - "{{ freenove_case_install_dir }}/Code/task_manager.py"
      - "{{ freenove_case_install_dir }}/Code/task_led.py"
      - "{{ freenove_case_install_dir }}/Code/task_fan.py"
      - "{{ freenove_case_install_dir }}/Code/task_oled.py"
  changed_when: false

- name: Validate Freenove hardware apply helper syntax
  when: freenove_case_apply_hardware_config | bool
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -m
      - py_compile
      - "{{ freenove_case_hardware_apply_script }}"
  changed_when: false

- name: Validate Freenove app configuration JSON
  when: freenove_case_manage_app_config | bool
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -m
      - json.tool
      - "{{ freenove_case_install_dir }}/Code/app_config.json"
  changed_when: false

- name: Validate touchscreen idle runtime
  when: freenove_case_manage_touchscreen_idle | bool
  block:
    - name: Validate touchscreen backlight helper syntax
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -n
          - "{{ freenove_case_touchscreen_idle_helper_path }}"
      changed_when: false

    - name: Validate touchscreen idle user service is active
      when: freenove_case_touchscreen_idle_service_state != "stopped"
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - is-active
          - "{{ freenove_case_touchscreen_idle_service_name }}"
      become: true
      become_user: "{{ freenove_case_install_user }}"
      environment:
        XDG_RUNTIME_DIR: "{{ freenove_case_touchscreen_idle_runtime_dir }}"
        DBUS_SESSION_BUS_ADDRESS: >-
          unix:path={{ freenove_case_touchscreen_idle_runtime_dir }}/bus
      changed_when: false

- name: Validate Freenove background service stability
  when:
    - freenove_case_manage_background_service | bool
    - freenove_case_service_state != "stopped"
  block:
    - name: Wait before validating Freenove background service stability
      ansible.builtin.pause:
        seconds: 8

    - name: Validate Freenove background service is active
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ freenove_case_service_name }}"
      changed_when: false
