---
- name: Configure Freenove background service
  when: freenove_case_manage_background_service | bool
  block:
    - name: Install Freenove background task service
      ansible.builtin.template:
        src: freenove-background.service.j2
        dest: "/etc/systemd/system/{{ freenove_case_service_name }}"
        owner: root
        group: root
        mode: "0644"
      become: true
      notify:
        - Reload systemd
        - Restart Freenove background service

    - name: Flush service file update before service management
      ansible.builtin.meta: flush_handlers

    - name: Manage Freenove background task service
      ansible.builtin.systemd_service:
        name: "{{ freenove_case_service_name }}"
        enabled: "{{ freenove_case_service_enabled }}"
        state: "{{ freenove_case_service_state }}"
      become: true
