---
- name: Remove obsolete Freenove task manager atexit registration
  when: freenove_case_manage_sigterm_cleanup_fix | bool
  ansible.builtin.replace:
    path: "{{ freenove_case_task_manager_path }}"
    regexp: '^[ \t]*atexit\.register\(self\.(?:handle_signal|stop_monitoring)\)[ \t]*\r?\n'
    replace: ''
  become: true

- name: Remove obsolete Freenove task manager atexit import
  when: freenove_case_manage_sigterm_cleanup_fix | bool
  ansible.builtin.replace:
    path: "{{ freenove_case_task_manager_path }}"
    regexp: '^import atexit[ \t]*\r?\n'
    replace: ''
  become: true

- name: Patch Freenove task manager signal handler
  when: freenove_case_manage_sigterm_cleanup_fix | bool
  ansible.builtin.replace:
    path: "{{ freenove_case_task_manager_path }}"
    regexp: '^([ \t]*)self\.stop_all_tasks\(\)[ \t]*$'
    replace: '\1self.stop_monitoring()\n\1raise SystemExit(0)'
  become: true

- name: Guard final Freenove task manager cleanup
  when: freenove_case_manage_sigterm_cleanup_fix | bool
  ansible.builtin.replace:
    path: "{{ freenove_case_task_manager_path }}"
    regexp: '^([ \t]*)manager\.stop_monitoring\(\)[ \t]*$'
    replace: '\1if manager.monitoring:\n\1    manager.stop_monitoring()'
  become: true

- name: Validate Freenove task manager signal cleanup
  when: freenove_case_manage_sigterm_cleanup_fix | bool
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import ast
        import pathlib
        import sys

        source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
        task_manager = next(
            node
            for node in ast.parse(source).body
            if isinstance(node, ast.ClassDef) and node.name == "TaskManager"
        )
        methods = {
            node.name: node
            for node in task_manager.body
            if isinstance(node, ast.FunctionDef)
        }
        handler = methods["handle_signal"]
        calls_stop_monitoring = any(
            isinstance(node, ast.Call)
            and isinstance(node.func, ast.Attribute)
            and node.func.attr == "stop_monitoring"
            for node in ast.walk(handler)
        )
        raises_system_exit = any(
            isinstance(node, ast.Raise)
            and isinstance(node.exc, ast.Call)
            and isinstance(node.exc.func, ast.Name)
            and node.exc.func.id == "SystemExit"
            for node in ast.walk(handler)
        )
        obsolete_atexit = "atexit.register(" in source or "import atexit" in source
        final_cleanup_is_guarded = "if manager.monitoring:" in source
        raise SystemExit(
            0
            if calls_stop_monitoring
            and raises_system_exit
            and not obsolete_atexit
            and final_cleanup_is_guarded
            else 1
        )
      - "{{ freenove_case_task_manager_path }}"
  changed_when: false
  become: true
