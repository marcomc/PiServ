---
- name: Verify Freenove task-manager SIGTERM cleanup artifact
  hosts: localhost
  gather_facts: false
  vars:
    freenove_case_manage_sigterm_cleanup_fix: true
    freenove_case_manage_background_service: true
    freenove_case_install_user: "{{ freenove_case_test_user.stdout }}"
    freenove_case_install_dir: "{{ freenove_case_test_directory.path }}"
    freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/task_manager.py"
    freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/task_manager_ansible.py"
  handlers:
    - name: Restart Freenove background service
      ansible.builtin.debug:
        msg: Test handler intentionally does not manage systemd.
      changed_when: false
  tasks:
    - name: Read the current test user
      ansible.builtin.command:
        argv: [/usr/bin/id, -un]
      register: freenove_case_test_user
      changed_when: false
      check_mode: false

    - name: Create an isolated Freenove task-manager fixture
      ansible.builtin.tempfile:
        state: directory
        suffix: freenove-case
      register: freenove_case_test_directory

    - name: Exercise renderer states and source convergence
      block:
        - name: Write the upstream SIGTERM-defect fixture
          ansible.builtin.copy:
            dest: "{{ freenove_case_task_manager_path }}"
            mode: "0644"
            content: |
              import atexit
              import signal
              import time
              from pathlib import Path

              class TaskManager:
                  def __init__(self):
                      self.monitoring = True
                      atexit.register(self.handle_signal)
                      signal.signal(signal.SIGTERM, self.handle_signal)

                  def handle_signal(self, signum=None, frame=None):
                      self.stop_all_tasks()

                  def stop_monitoring(self):
                      self.monitoring = False
                      marker = Path("{{ freenove_case_test_directory.path }}/cleanup.log")
                      previous = marker.read_text(encoding="utf-8") if marker.exists() else ""
                      marker.write_text(previous + "cleanup\n", encoding="utf-8")

              manager = TaskManager()
              Path("{{ freenove_case_test_directory.path }}/ready").write_text("ready", encoding="utf-8")
              try:
                  while True:
                      time.sleep(1)
              finally:
                  manager.stop_monitoring()

        - name: Verify disabled mode leaves the source unchanged
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
          vars:
            freenove_case_manage_sigterm_cleanup_fix: false

        - name: Render the SIGTERM-safe runtime artifact
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml

        - name: Read the upstream source and managed runtime artifact
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop:
            - "{{ freenove_case_task_manager_path }}"
            - "{{ freenove_case_task_manager_runtime_path }}"
          register: freenove_case_rendered_files

        - name: Verify source isolation and the rendered fix
          ansible.builtin.assert:
            that:
              - "'self.stop_all_tasks()' in (freenove_case_rendered_files.results[0].content | b64decode)"
              - "'raise SystemExit(0)' in (freenove_case_rendered_files.results[1].content | b64decode)"
              - "'if manager.monitoring:' in (freenove_case_rendered_files.results[1].content | b64decode)"

        - name: Reapply the renderer
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml

        - name: Verify the second render is unchanged
          ansible.builtin.assert:
            that:
              - freenove_case_sigterm_render.stdout | trim == 'unchanged'

        - name: Drift the runtime artifact permissions
          ansible.builtin.file:
            path: "{{ freenove_case_task_manager_runtime_path }}"
            mode: "0666"

        - name: Reconcile the runtime artifact permissions
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml

        - name: Inspect reconciled runtime artifact permissions
          ansible.builtin.stat:
            path: "{{ freenove_case_task_manager_runtime_path }}"
          register: freenove_case_reconciled_runtime_mode

        - name: Verify permission drift triggers artifact reconciliation
          ansible.builtin.assert:
            that:
              - freenove_case_sigterm_render.stdout | trim == 'changed'
              - freenove_case_reconciled_runtime_mode.stat.mode == '0644'

        - name: Verify SIGTERM exits after exactly one cleanup
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - |
                import pathlib
                import signal
                import subprocess
                import sys
                import time

                source = pathlib.Path(sys.argv[1])
                ready = source.with_name("ready")
                marker = source.with_name("cleanup.log")
                process = subprocess.Popen([sys.executable, str(source)])
                deadline = time.monotonic() + 5
                while not ready.exists() and time.monotonic() < deadline:
                    time.sleep(0.05)
                if not ready.exists():
                    process.kill()
                    process.wait()
                    raise SystemExit(1)
                process.send_signal(signal.SIGTERM)
                try:
                    return_code = process.wait(timeout=5)
                except subprocess.TimeoutExpired:
                    process.kill()
                    process.wait()
                    raise SystemExit(1)
                lines = marker.read_text(encoding="utf-8").splitlines()
                raise SystemExit(0 if return_code == 0 and lines == ["cleanup"] else 1)
              - "{{ freenove_case_task_manager_runtime_path }}"
          changed_when: false

        - name: Disable the managed SIGTERM-safe runtime artifact
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
          vars:
            freenove_case_manage_sigterm_cleanup_fix: false

        - name: Remove the disabled runtime artifact after simulated service reconciliation
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup-removal.yml
          vars:
            freenove_case_manage_sigterm_cleanup_fix: false

        - name: Verify disabled mode removes the runtime artifact
          ansible.builtin.stat:
            path: "{{ freenove_case_task_manager_runtime_path }}"
            follow: false
          register: freenove_case_disabled_runtime

        - name: Require disabled mode to remove the runtime artifact
          ansible.builtin.assert:
            that:
              - not freenove_case_disabled_runtime.stat.exists

        - name: Re-enable the managed SIGTERM-safe runtime artifact
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml

        - name: Verify re-enabling renders the runtime artifact again
          ansible.builtin.assert:
            that:
              - freenove_case_sigterm_render.stdout | trim == 'changed'

        - name: Disable the fix while leaving the existing service unmanaged
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
          vars:
            freenove_case_manage_sigterm_cleanup_fix: false
            freenove_case_manage_background_service: false

        - name: Preserve the artifact while the service is unmanaged
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup-removal.yml
          vars:
            freenove_case_manage_sigterm_cleanup_fix: false
            freenove_case_manage_background_service: false

        - name: Inspect the preserved unmanaged runtime artifact
          ansible.builtin.stat:
            path: "{{ freenove_case_task_manager_runtime_path }}"
            follow: false
          register: freenove_case_unmanaged_runtime

        - name: Require the unmanaged runtime artifact to remain available
          ansible.builtin.assert:
            that:
              - freenove_case_unmanaged_runtime.stat.exists
              - freenove_case_unmanaged_runtime.stat.isreg

        - name: Write a destination-symlink sentinel
          ansible.builtin.copy:
            content: |
              sentinel
            dest: "{{ freenove_case_test_directory.path }}/sentinel.txt"
            mode: "0600"

        - name: Create a runtime-artifact symlink
          ansible.builtin.file:
            src: "{{ freenove_case_test_directory.path }}/sentinel.txt"
            dest: "{{ freenove_case_test_directory.path }}/linked-runtime.py"
            state: link

        - name: Initialize destination-symlink rejection state
          ansible.builtin.set_fact:
            freenove_case_destination_symlink_rejected: false

        - name: Reject a destination symlink without following it
          block:
            - name: Attempt to render through a destination symlink
              ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
              vars:
                freenove_case_task_manager_runtime_path: >-
                  {{ freenove_case_test_directory.path }}/linked-runtime.py
          rescue:
            - name: Record expected destination-symlink rejection
              ansible.builtin.set_fact:
                freenove_case_destination_symlink_rejected: true

        - name: Inspect the destination symlink
          ansible.builtin.stat:
            path: "{{ freenove_case_test_directory.path }}/linked-runtime.py"
            follow: false
          register: freenove_case_destination_symlink

        - name: Read the destination-symlink sentinel
          ansible.builtin.slurp:
            src: "{{ freenove_case_test_directory.path }}/sentinel.txt"
          register: freenove_case_destination_sentinel

        - name: Verify the destination symlink and sentinel remain intact
          ansible.builtin.assert:
            that:
              - freenove_case_destination_symlink_rejected
              - freenove_case_destination_symlink.stat.islnk
              - (freenove_case_destination_sentinel.content | b64decode | trim) == 'sentinel'

        - name: Create a parent-directory alias for the upstream source
          ansible.builtin.file:
            src: "{{ freenove_case_test_directory.path }}"
            dest: "{{ freenove_case_test_directory.path }}/source-parent-alias"
            state: link

        - name: Initialize parent-alias rejection state
          ansible.builtin.set_fact:
            freenove_case_parent_alias_rejected: false

        - name: Reject a destination that resolves to the upstream source
          block:
            - name: Attempt to render through a parent-directory alias
              ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
              vars:
                freenove_case_task_manager_runtime_path: >-
                  {{ freenove_case_test_directory.path }}/source-parent-alias/task_manager.py
          rescue:
            - name: Record expected parent-alias rejection
              ansible.builtin.set_fact:
                freenove_case_parent_alias_rejected: true

        - name: Read the upstream source after parent-alias rejection
          ansible.builtin.slurp:
            src: "{{ freenove_case_task_manager_path }}"
          register: freenove_case_parent_alias_source

        - name: Verify the source remains unmodified after parent-alias rejection
          ansible.builtin.assert:
            that:
              - freenove_case_parent_alias_rejected
              - "'self.stop_all_tasks()' in (freenove_case_parent_alias_source.content | b64decode)"

        - name: Write a source with an unrelated normal task cleanup
          ansible.builtin.copy:
            dest: "{{ freenove_case_test_directory.path }}/safe-extra.py"
            mode: "0644"
            content: |
              class TaskManager:
                  def handle_signal(self, signum=None, frame=None):
                      self.stop_monitoring()
                      raise SystemExit(0)

                  def stop_monitoring(self):
                      self.monitoring = False

              def normal_work(self):
                  self.stop_all_tasks()

              def unrelated_cleanup(self):
                  try:
                      pass
                  finally:
                      manager.stop_monitoring()

              manager = TaskManager()
              try:
                  pass
              finally:
                  if manager.monitoring:
                      manager.stop_monitoring()

        - name: Render a source with unrelated normal task cleanup
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
          vars:
            freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/safe-extra.py"
            freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/safe-extra-runtime.py"

        - name: Read the scoped-render runtime artifact
          ansible.builtin.slurp:
            src: "{{ freenove_case_test_directory.path }}/safe-extra-runtime.py"
          register: freenove_case_scoped_render

        - name: Verify normal task cleanup was not rewritten
          ansible.builtin.assert:
            that:
              - "'self.stop_all_tasks()' in (freenove_case_scoped_render.content | b64decode)"
              - "'def unrelated_cleanup' in (freenove_case_scoped_render.content | b64decode)"
              - "'finally:\\n        manager.stop_monitoring()' in (freenove_case_scoped_render.content | b64decode)"

        - name: Write a source with nested runtime cleanup
          ansible.builtin.copy:
            dest: "{{ freenove_case_test_directory.path }}/nested-runtime.py"
            mode: "0644"
            content: |
              class TaskManager:
                  def handle_signal(self, signum=None, frame=None):
                      self.stop_monitoring()
                      raise SystemExit(0)

                  def stop_monitoring(self):
                      self.monitoring = False

              manager = TaskManager()
              try:
                  try:
                      pass
                  finally:
                      manager.stop_monitoring()
              finally:
                  if manager.monitoring:
                      manager.stop_monitoring()

        - name: Render a source with nested runtime cleanup
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
          vars:
            freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/nested-runtime.py"
            freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/nested-runtime-ansible.py"

        - name: Read the nested-runtime artifact
          ansible.builtin.slurp:
            src: "{{ freenove_case_test_directory.path }}/nested-runtime-ansible.py"
          register: freenove_case_nested_runtime_render

        - name: Verify nested runtime cleanup was not rewritten
          ansible.builtin.assert:
            that:
              - >-
                'finally:\n        manager.stop_monitoring()'
                in (freenove_case_nested_runtime_render.content | b64decode)

        - name: Write a source with nested atexit registration
          ansible.builtin.copy:
            dest: "{{ freenove_case_test_directory.path }}/nested-atexit.py"
            mode: "0644"
            content: |
              import atexit

              class TaskManager:
                  def __init__(self):
                      atexit.register(self.handle_signal)
                      self.monitoring = True

                      class Helper:
                          def __init__(self):
                              atexit.register(self.handle_signal)

                  def handle_signal(self, signum=None, frame=None):
                      self.stop_monitoring()
                      raise SystemExit(0)

                  def stop_monitoring(self):
                      self.monitoring = False

              manager = TaskManager()
              try:
                  pass
              finally:
                  if manager.monitoring:
                      manager.stop_monitoring()

        - name: Initialize nested-atexit rejection state
          ansible.builtin.set_fact:
            freenove_case_nested_atexit_rejected: false

        - name: Reject nested atexit registration before writing an artifact
          block:
            - name: Attempt to render nested atexit registration
              ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
              vars:
                freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/nested-atexit.py"
                freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/nested-atexit-ansible.py"
          rescue:
            - name: Record expected nested-atexit rejection
              ansible.builtin.set_fact:
                freenove_case_nested_atexit_rejected: true

        - name: Verify nested atexit registration leaves no artifact
          ansible.builtin.assert:
            that:
              - freenove_case_nested_atexit_rejected
              - not ((freenove_case_test_directory.path + '/nested-atexit-ansible.py') is exists)

        - name: Write a source with conditional signal cleanup
          ansible.builtin.copy:
            dest: "{{ freenove_case_test_directory.path }}/conditional-handler.py"
            mode: "0644"
            content: |
              class TaskManager:
                  def handle_signal(self, signum=None, frame=None):
                      if self.monitoring:
                          self.stop_monitoring()
                      raise SystemExit(0)

                  def stop_monitoring(self):
                      self.monitoring = False

              manager = TaskManager()
              try:
                  pass
              finally:
                  if manager.monitoring:
                      manager.stop_monitoring()

        - name: Initialize conditional-handler rejection state
          ansible.builtin.set_fact:
            freenove_case_conditional_handler_rejected: false

        - name: Reject conditional signal cleanup before writing an artifact
          block:
            - name: Attempt to render conditional signal cleanup
              ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
              vars:
                freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/conditional-handler.py"
                freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/conditional-handler-runtime.py"
          rescue:
            - name: Record expected conditional-handler rejection
              ansible.builtin.set_fact:
                freenove_case_conditional_handler_rejected: true

        - name: Verify conditional signal cleanup leaves no artifact
          ansible.builtin.assert:
            that:
              - freenove_case_conditional_handler_rejected
              - not ((freenove_case_test_directory.path + '/conditional-handler-runtime.py') is exists)

        - name: Write a source with signal-cleanup arguments
          ansible.builtin.copy:
            dest: "{{ freenove_case_test_directory.path }}/handler-arguments.py"
            mode: "0644"
            content: |
              class TaskManager:
                  def handle_signal(self, signum=None, frame=None):
                      self.stop_monitoring(unexpected=True)
                      raise SystemExit(0)

                  def stop_monitoring(self):
                      self.monitoring = False

              manager = TaskManager()
              try:
                  pass
              finally:
                  if manager.monitoring:
                      manager.stop_monitoring()

        - name: Initialize signal-cleanup arguments rejection state
          ansible.builtin.set_fact:
            freenove_case_handler_arguments_rejected: false

        - name: Reject signal-cleanup arguments before writing an artifact
          block:
            - name: Attempt to render signal-cleanup arguments
              ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
              vars:
                freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/handler-arguments.py"
                freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/handler-arguments-runtime.py"
          rescue:
            - name: Record expected signal-cleanup arguments rejection
              ansible.builtin.set_fact:
                freenove_case_handler_arguments_rejected: true

        - name: Verify signal-cleanup arguments leave no artifact
          ansible.builtin.assert:
            that:
              - freenove_case_handler_arguments_rejected
              - not ((freenove_case_test_directory.path + '/handler-arguments-runtime.py') is exists)

        - name: Write an unsupported upstream fixture
          ansible.builtin.copy:
            dest: "{{ freenove_case_test_directory.path }}/unknown.py"
            mode: "0644"
            content: |
              class TaskManager:
                  def handle_signal(self, signum=None, frame=None):
                      self.stop_everything()

        - name: Initialize unsupported-source rejection state
          ansible.builtin.set_fact:
            freenove_case_unknown_rejected: false

        - name: Reject unsupported source before writing an artifact
          block:
            - name: Attempt to render unsupported source
              ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
              vars:
                freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/unknown.py"
                freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/unknown-runtime.py"
          rescue:
            - name: Record expected unsupported-source rejection
              ansible.builtin.set_fact:
                freenove_case_unknown_rejected: true

        - name: Inspect the rejected runtime artifact
          ansible.builtin.stat:
            path: "{{ freenove_case_test_directory.path }}/unknown-runtime.py"
          register: freenove_case_unknown_runtime

        - name: Verify unsupported source failed without an artifact
          ansible.builtin.assert:
            that:
              - freenove_case_unknown_rejected
              - not freenove_case_unknown_runtime.stat.exists

        - name: Create a controller-copy convergence fixture
          ansible.builtin.file:
            path: "{{ freenove_case_test_directory.path }}/installed/Code"
            state: directory
            mode: "0755"

        - name: Install the upstream file as controller-copy mode does
          ansible.builtin.copy:
            src: "{{ freenove_case_task_manager_path }}"
            dest: "{{ freenove_case_test_directory.path }}/installed/Code/task_manager.py"
            remote_src: true
            mode: "0644"

        - name: Render the controller-copy runtime artifact
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
          vars:
            freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/installed/Code/task_manager.py"
            freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/installed/Code/task_manager_ansible.py"

        - name: Reinstall the unchanged upstream file
          ansible.builtin.copy:
            src: "{{ freenove_case_task_manager_path }}"
            dest: "{{ freenove_case_test_directory.path }}/installed/Code/task_manager.py"
            remote_src: true
            mode: "0644"
          register: freenove_case_test_controller_copy

        - name: Rerender the controller-copy runtime artifact
          ansible.builtin.include_tasks: ../tasks/sigterm-cleanup.yml
          vars:
            freenove_case_task_manager_path: "{{ freenove_case_test_directory.path }}/installed/Code/task_manager.py"
            freenove_case_task_manager_runtime_path: "{{ freenove_case_test_directory.path }}/installed/Code/task_manager_ansible.py"

        - name: Verify controller-copy convergence
          ansible.builtin.assert:
            that:
              - not freenove_case_test_controller_copy.changed
              - freenove_case_sigterm_render.stdout | trim == 'unchanged'

        - name: Create a warm pre-reboot mode fixture
          ansible.builtin.copy:
            content: "warm\n"
            dest: "{{ freenove_case_test_directory.path }}/reboot-mode"
            mode: "0600"

        - name: Activate cold mode before a simulated automatic reboot
          ansible.builtin.include_tasks: ../tasks/pre-reboot-mode.yml
          vars:
            freenove_case_pre_reboot_mode: cold
            freenove_case_reboot_mode_path: "{{ freenove_case_test_directory.path }}/reboot-mode"

        - name: Read the simulated pre-reboot mode
          ansible.builtin.slurp:
            path: "{{ freenove_case_test_directory.path }}/reboot-mode"
          register: freenove_case_test_reboot_mode

        - name: Verify cold mode is active before reboot
          ansible.builtin.assert:
            that:
              - (freenove_case_test_reboot_mode.content | b64decode) == 'cold\n'

        - name: Set a string false cleanup flag
          ansible.builtin.set_fact:
            freenove_case_manage_sigterm_cleanup_fix: "false"

        - name: Render the service with a string false cleanup flag
          ansible.builtin.set_fact:
            freenove_case_string_false_service: >-
              {{
                lookup(
                  'ansible.builtin.template',
                  playbook_dir ~ '/../templates/freenove-background.service.j2'
                )
              }}

        - name: Verify the service honors the coerced cleanup flag
          ansible.builtin.assert:
            that:
              - >-
                'ExecStart=/usr/bin/python3 '
                ~ freenove_case_task_manager_path
                in freenove_case_string_false_service
      always:
        - name: Remove isolated Freenove task-manager fixtures
          ansible.builtin.file:
            path: "{{ freenove_case_test_directory.path }}"
            state: absent
          become: true
