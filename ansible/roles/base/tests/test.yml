---
- name: Test base role syntax
  hosts: localhost
  gather_facts: true
  pre_tasks:
    - name: Load base role defaults for package assertions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir | dirname }}/defaults/main.yml"
        name: base_test_defaults

    - name: Assert the base package defaults include jq
      ansible.builtin.assert:
        that:
          - "'jq' in base_test_defaults.base_packages"
  roles:
    - role: base
      vars:
        base_manage_ssh: false
        base_manage_vnc: false
        base_manage_glances: false
        base_manage_cockpit: false
        base_manage_disabled_services: false
        base_manage_unattended_upgrades: false
        base_manage_reboot_notification: false
        base_manage_smartmontools: false
        base_validate_root_storage: false
        base_packages: []
        base_manage_cloud_init: false
