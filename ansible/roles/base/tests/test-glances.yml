---
- name: Test Glances API systemd override rendering
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    base_glances_bind_address: 0.0.0.0
    base_glances_validation_address: 127.0.0.1
    base_glances_port: 61208
    base_glances_state_directory: glances
    base_glances_runtime_directory: glances
    base_test_role_path: "{{ playbook_dir | dirname }}"
  tasks:
    - name: Create temporary Glances test directory
      ansible.builtin.tempfile:
        state: directory
        suffix: glances-service
      register: base_glances_test_directory

    - name: Test Glances API systemd override rendering
      block:
        - name: Render Glances API systemd override
          ansible.builtin.template:
            src: "{{ base_test_role_path }}/templates/glances.service.d-piserv-api.conf.j2"
            dest: "{{ base_glances_test_directory.path }}/piserv-api.conf"
            mode: "0600"

        - name: Read rendered Glances API systemd override
          ansible.builtin.slurp:
            src: "{{ base_glances_test_directory.path }}/piserv-api.conf"
          register: base_glances_rendered_override

        - name: Assert rendered Glances API systemd override
          ansible.builtin.assert:
            that:
              - >-
                'ExecStart=/usr/bin/glances --webserver --disable-webui --bind
                0.0.0.0 --port 61208' in
                (base_glances_rendered_override.content | b64decode)
              - >-
                'Environment=HOME=/var/lib/glances' in
                (base_glances_rendered_override.content | b64decode)
              - >-
                'DynamicUser=yes' in
                (base_glances_rendered_override.content | b64decode)
              - >-
                'ProtectSystem=full' in
                (base_glances_rendered_override.content | b64decode)
      always:
        - name: Remove temporary Glances test directory
          ansible.builtin.file:
            path: "{{ base_glances_test_directory.path }}"
            state: absent
