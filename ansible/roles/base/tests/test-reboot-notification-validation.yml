---
- name: Test rendered reboot notification service timeout
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    base_reboot_notification_condition_path: /etc/msmtprc
    base_reboot_notification_script_path: /usr/local/sbin/piserv-reboot-notify
    base_reboot_notification_retry_attempts: 2
    base_reboot_notification_retry_delay_seconds: 3
    base_reboot_notification_delivery_timeout_seconds: 5
  tasks:
    - name: Create reboot notification service test directory
      ansible.builtin.tempfile:
        state: directory
        suffix: reboot-notification-service
      register: base_test_reboot_notification_service_directory

    - name: Render and verify reboot notification service timeout
      block:
        - name: Render reboot notification service
          ansible.builtin.template:
            src: "{{ playbook_dir | dirname }}/templates/piserv-reboot-notify.service.j2"
            dest: >-
              {{ base_test_reboot_notification_service_directory.path }}/
              piserv-reboot-notify.service
            mode: "0600"

        - name: Read rendered reboot notification service
          ansible.builtin.slurp:
            src: >-
              {{ base_test_reboot_notification_service_directory.path }}/
              piserv-reboot-notify.service
          register: base_test_reboot_notification_service

        - name: Assert rendered reboot notification timeout covers retry budget
          ansible.builtin.assert:
            that:
              - >-
                'TimeoutStartSec=23s' in
                (base_test_reboot_notification_service.content | b64decode)
      always:
        - name: Remove reboot notification service test directory
          ansible.builtin.file:
            path: "{{ base_test_reboot_notification_service_directory.path }}"
            state: absent

- name: Test valid reboot notification retry policy
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    base_reboot_notification_retry_attempts: 6
    base_reboot_notification_retry_delay_seconds: 15
    base_reboot_notification_delivery_timeout_seconds: 20
  tasks:
    - name: Validate accepted reboot notification retry policy
      ansible.builtin.import_tasks: ../tasks/validate-reboot-notification.yml

- name: Test rejected reboot notification retry policies
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Reject a zero reboot notification retry budget
      block:
        - name: Validate zero retry budget
          ansible.builtin.import_tasks: ../tasks/validate-reboot-notification.yml
          vars:
            base_reboot_notification_retry_attempts: 0
            base_reboot_notification_retry_delay_seconds: 15
            base_reboot_notification_delivery_timeout_seconds: 20

        - name: Mark zero retry budget as unexpectedly accepted
          ansible.builtin.set_fact:
            base_test_invalid_reboot_policy_accepted: true
      rescue:
        - name: Assert zero retry budget was rejected
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == "Validate bounded reboot notification retry policy"

    - name: Reject an excessive reboot notification retry duration
      block:
        - name: Validate excessive retry duration
          ansible.builtin.import_tasks: ../tasks/validate-reboot-notification.yml
          vars:
            base_reboot_notification_retry_attempts: 10
            base_reboot_notification_retry_delay_seconds: 60
            base_reboot_notification_delivery_timeout_seconds: 60

        - name: Mark excessive retry duration as unexpectedly accepted
          ansible.builtin.set_fact:
            base_test_invalid_reboot_policy_accepted: true
      rescue:
        - name: Assert excessive retry duration was rejected
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == "Validate bounded reboot notification retry policy"

    - name: Reject a non-integer reboot notification delay
      block:
        - name: Validate non-integer retry delay
          ansible.builtin.import_tasks: ../tasks/validate-reboot-notification.yml
          vars:
            base_reboot_notification_retry_attempts: 6
            base_reboot_notification_retry_delay_seconds: invalid
            base_reboot_notification_delivery_timeout_seconds: 20

        - name: Mark non-integer retry delay as unexpectedly accepted
          ansible.builtin.set_fact:
            base_test_invalid_reboot_policy_accepted: true
      rescue:
        - name: Assert non-integer retry delay was rejected
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == "Validate bounded reboot notification retry policy"
