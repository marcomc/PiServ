---
argument_specs:
  main:
    short_description: Configure base PiServ host policy.
    description:
      - Manages baseline SSH policy, disabled services, unattended upgrades, and cloud-init state.
      - Intended for this PiServ project rather than standalone Galaxy publication.
    options:
      base_manage_ssh:
        type: bool
        default: true
        description: Whether to manage SSH baseline policy.
      base_ssh_dropin_path:
        type: path
        default: /etc/ssh/sshd_config.d/99-piserv-hardening.conf
        description: SSH daemon drop-in path.
      base_ssh_permit_root_login:
        type: str
        default: "no"
        description: Effective PermitRootLogin value.
      base_ssh_password_authentication:
        type: str
        default: "no"
        description: Effective PasswordAuthentication value.
      base_ssh_kbd_interactive_authentication:
        type: str
        default: "no"
        description: Effective KbdInteractiveAuthentication value.
      base_ssh_pubkey_authentication:
        type: str
        default: "yes"
        description: Effective PubkeyAuthentication value.
      base_manage_vnc:
        type: bool
        default: true
        description: Whether to manage the VNC service output selection.
      base_vnc_service_name:
        type: str
        default: wayvnc.service
        description: VNC systemd service name.
      base_vnc_control_service_name:
        type: str
        default: wayvnc-control.service
        description: Raspberry Pi OS service that attaches WayVNC to the desktop.
      base_vnc_output:
        type: str
        default: DSI-1
        description: Wayland output captured by VNC.
      base_vnc_control_socket_path:
        type: path
        default: /tmp/wayvnc/wayvncctl.sock
        description: wayvnc control socket path.
      base_vnc_output_selector_path:
        type: path
        default: /usr/local/libexec/piserv-wayvnc-select-output
        description: Project-owned VNC command in a root-owned non-writable parent directory.
      base_vnc_output_selector_service_name:
        type: str
        default: piserv-wayvnc-output.service
        description: Systemd oneshot service that selects the configured VNC output.
      base_vnc_output_selector_service_path:
        type: path
        default: /etc/systemd/system/piserv-wayvnc-output.service
        description: Systemd unit path for the VNC output selector.
      base_vnc_output_selector_delay_seconds:
        type: int
        default: 2
        description: Delay before reading WayVNC outputs after service startup.
      base_vnc_output_selector_timeout_seconds:
        type: int
        default: 30
        description: Maximum time to wait for the configured WayVNC output.
      base_manage_glances:
        type: bool
        default: true
        description: Whether to install and manage the local Glances API service.
      base_glances_packages:
        type: list
        elements: str
        description: Debian packages required for Glances system observability.
      base_glances_service_name:
        type: str
        default: glances.service
        description: Systemd service name provided by the Glances Debian package.
      base_glances_dropin_path:
        type: path
        default: /etc/systemd/system/glances.service.d/piserv-api.conf
        description: PiServ-managed systemd override for Glances API mode.
      base_glances_bind_address:
        type: str
        default: 127.0.0.1
        description: IPv4 loopback or wildcard address on which the Glances API listens.
      base_glances_validation_address:
        type: str
        default: 127.0.0.1
        description: Loopback address used to validate the Glances API.
      base_glances_port:
        type: int
        default: 61208
        description: TCP port used by the local Glances API.
      base_glances_state_directory:
        type: str
        default: glances
        description: StateDirectory name used by the dynamic Glances service user.
      base_glances_runtime_directory:
        type: str
        default: glances
        description: RuntimeDirectory name used by the dynamic Glances service user.
      base_manage_cockpit:
        type: bool
        default: true
        description: Whether to install and manage the Cockpit web console.
      base_cockpit_packages:
        type: list
        elements: str
        description: Debian packages required for the Cockpit web console.
      base_cockpit_socket_name:
        type: str
        default: cockpit.socket
        description: Cockpit systemd socket unit name.
      base_cockpit_port:
        type: int
        default: 9090
        description: HTTPS port used by Cockpit.
      base_manage_disabled_services:
        type: bool
        default: true
        description: Whether to disable baseline unwanted services.
      base_disabled_systemd_units:
        type: list
        elements: str
        description: Systemd units that should be disabled and stopped when present.
      base_manage_unattended_upgrades:
        type: bool
        default: true
        description: Whether to manage unattended upgrades.
      base_unattended_automatic_reboot_time:
        type: str
        default: "06:30"
        description: Reboot time used only when unattended upgrades require reboot.
      base_unattended_origins_patterns:
        type: list
        elements: str
        description: Origins-Pattern entries for unattended-upgrades.
      base_unattended_validate_dry_run:
        type: bool
        default: true
        description: Whether to run unattended-upgrade dry-run validation.
      base_manage_unattended_upgrade_digest:
        type: bool
        default: true
        description: Whether to replace the native raw mail with the PiServ mobile digest plugin.
      base_unattended_mail_to:
        type: str
        default: root
        description: Recipient used by the digest and native error fallback.
      base_unattended_mail_report:
        type: str
        default: on-change
        description: unattended-upgrades MailReport value.
      base_manage_reboot_notification:
        type: bool
        default: true
        description: Whether to install the boot notification systemd service.
      base_reboot_notification_service_name:
        type: str
        default: piserv-reboot-notify.service
        description: Boot notification service name.
      base_reboot_notification_script_path:
        type: path
        default: /usr/local/sbin/piserv-reboot-notify
        description: Boot notification helper path.
      base_reboot_notification_recipient:
        type: str
        default: root
        description: Local recipient used by boot notification email.
      base_reboot_notification_subject_prefix:
        type: str
        default: "[PiServ]"
        description: Subject prefix used by boot notification email.
      base_reboot_notification_condition_path:
        type: path
        default: /etc/msmtprc
        description: Path that must exist before the boot notification service runs.
      base_manage_cloud_init:
        type: bool
        default: true
        description: Whether to manage cloud-init state.
      base_cloud_init_disable:
        type: bool
        default: true
        description: Whether to disable cloud-init with a marker file and disabled units.
      base_cloud_init_disabled_marker_path:
        type: path
        default: /etc/cloud/cloud-init.disabled
        description: cloud-init disabled marker file path.
      base_cloud_init_units:
        type: list
        elements: str
        description: cloud-init units disabled when cloud-init is disabled.
