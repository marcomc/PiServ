---
- name: Install unattended-upgrades packages
  ansible.builtin.apt:
    name: "{{ base_unattended_upgrade_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Configure apt periodic unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure unattended-upgrades policy
  ansible.builtin.template:
    src: 52base-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52piserv-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Ensure unattended-upgrades service is enabled
  ansible.builtin.systemd_service:
    name: unattended-upgrades.service
    enabled: true
    state: started
  become: true

- name: Validate unattended-upgrades dry run
  when: base_unattended_validate_dry_run | bool
  ansible.builtin.command:
    argv:
      - /usr/bin/unattended-upgrade
      - --dry-run
      - --debug
  changed_when: false
  become: true
