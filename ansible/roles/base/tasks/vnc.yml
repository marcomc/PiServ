---
- name: Read systemd service facts for VNC
  ansible.builtin.service_facts:

- name: Require the configured VNC service
  ansible.builtin.assert:
    that:
      - base_vnc_service_name in ansible_facts.services
      - base_vnc_control_service_name in ansible_facts.services
    fail_msg: >-
      The configured VNC services {{ base_vnc_service_name }} and
      {{ base_vnc_control_service_name }} must be installed before applying the
      PiServ VNC policy.

- name: Ensure PiServ VNC selector directory exists
  ansible.builtin.file:
    path: "{{ base_vnc_output_selector_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install PiServ VNC output selector
  ansible.builtin.template:
    src: piserv-wayvnc-select-output.sh.j2
    dest: "{{ base_vnc_output_selector_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Restart base VNC service

- name: Install PiServ VNC output selector service
  ansible.builtin.template:
    src: piserv-wayvnc-output.service.j2
    dest: "{{ base_vnc_output_selector_service_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart base VNC service

- name: Enable PiServ VNC output selector service
  ansible.builtin.systemd_service:
    name: "{{ base_vnc_output_selector_service_name }}"
    enabled: true
    daemon_reload: true
  become: true

- name: Flush VNC service changes before validation
  ansible.builtin.meta: flush_handlers

- name: Ensure PiServ VNC service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ base_vnc_service_name }}"
    enabled: true
    state: started
  become: true

- name: Wait for VNC control socket and configured output
  ansible.builtin.command:
    argv:
      - /usr/bin/wayvncctl
      - "--socket={{ base_vnc_control_socket_path }}"
      - output-list
  register: base_vnc_output_list
  changed_when: false
  until:
    - base_vnc_output_list.rc == 0
    - base_vnc_output in base_vnc_output_list.stdout
  retries: 30
  delay: 1
  check_mode: false
  become: true

- name: Select configured VNC output
  when: >-
    ('* ' ~ base_vnc_output ~ ':') not in base_vnc_output_list.stdout
  ansible.builtin.command:
    argv:
      - /usr/bin/wayvncctl
      - "--socket={{ base_vnc_control_socket_path }}"
      - output-set
      - "{{ base_vnc_output }}"
  changed_when: true
  become: true

- name: Read active VNC captured output
  ansible.builtin.command:
    argv:
      - /usr/bin/wayvncctl
      - "--socket={{ base_vnc_control_socket_path }}"
      - output-list
  register: base_vnc_active_output
  changed_when: false
  check_mode: false
  become: true

- name: Assert VNC actively captures the configured output
  ansible.builtin.assert:
    that:
      - base_vnc_active_output.rc == 0
      - "('* ' ~ base_vnc_output ~ ':') in base_vnc_active_output.stdout"
    fail_msg: >-
      wayvnc is not actively capturing the configured output
      {{ base_vnc_output }}.
