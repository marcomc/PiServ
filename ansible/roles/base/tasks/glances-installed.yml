---
- name: Read Glances configuration parent directory
  ansible.builtin.stat:
    path: "{{ base_glances_config_path | dirname }}"
  register: base_glances_config_parent_directory
  changed_when: false
  become: true

- name: Assert Glances configuration parent directory exists
  ansible.builtin.assert:
    that:
      - base_glances_config_parent_directory.stat.exists
      - base_glances_config_parent_directory.stat.isdir
    fail_msg: >-
      The parent directory of {{ base_glances_config_path }} must exist after
      the Glances package installation.

- name: Read Glances password directory
  ansible.builtin.stat:
    path: "{{ base_glances_password_directory }}"
  register: base_glances_password_directory_stat
  changed_when: false
  become: true

- name: Create missing Glances private password directory
  ansible.builtin.file:
    path: "{{ base_glances_password_directory }}"
    state: directory
    owner: root
    group: glances
    mode: "0750"
  when: not base_glances_password_directory_stat.stat.exists
  become: true

- name: Assert Glances password path is a directory
  ansible.builtin.assert:
    that:
      - >-
        base_glances_password_directory_stat.stat.isdir
        or not base_glances_password_directory_stat.stat.exists
    fail_msg: >-
      Glances password path {{ base_glances_password_directory }} must be a
      directory.

- name: Configure Glances password storage path
  community.general.ini_file:
    path: "{{ base_glances_config_path }}"
    section: passwords
    option: local_password_path
    value: "{{ base_glances_password_directory }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Glances service
  become: true

- name: Read Glances API password hash state
  ansible.builtin.stat:
    path: "{{ base_glances_password_file }}"
  register: base_glances_password_file_stat
  changed_when: false
  no_log: true
  become: true

- name: Read initial Glances API bootstrap password state
  ansible.builtin.stat:
    path: "{{ base_glances_bootstrap_password_file }}"
  register: base_glances_bootstrap_password_file_initial_stat
  changed_when: false
  no_log: true
  become: true

- name: Read Glances API credential recovery marker state
  ansible.builtin.stat:
    path: "{{ base_glances_bootstrap_password_file }}.pending"
  register: base_glances_credentials_recovery_marker_stat
  changed_when: false
  no_log: true
  become: true

- name: Decide whether Glances API credentials must be regenerated
  ansible.builtin.set_fact:
    base_glances_credentials_regeneration_required: >-
      {{
        not base_glances_password_file_stat.stat.exists
        or not base_glances_bootstrap_password_file_initial_stat.stat.exists
        or base_glances_credentials_recovery_marker_stat.stat.exists
      }}
  no_log: true

- name: Regenerate Glances API credentials
  when:
    - base_glances_credentials_regeneration_required | bool
    - not ansible_check_mode
  no_log: true
  block:
    - name: Generate Glances API bootstrap credentials
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import hashlib
            import json
            import secrets

            password = secrets.token_urlsafe(32)
            password_digest = hashlib.pbkdf2_hmac(
                'sha256', password.encode(), b'', 100000, dklen=128
            ).hex()
            salt = secrets.token_hex(16)
            password_hash = hashlib.pbkdf2_hmac(
                'sha256', password_digest.encode(), salt.encode(), 100000, dklen=128
            ).hex()
            print(json.dumps({'password': password, 'hash': f'{salt}${password_hash}'}))
      register: base_glances_bootstrap_credentials
      changed_when: false
      become: true

    - name: Mark Glances API credential reconciliation pending
      ansible.builtin.copy:
        content: "pending\n"
        dest: "{{ base_glances_bootstrap_password_file }}.pending"
        owner: root
        group: root
        mode: "0600"
      become: true

    - name: Store Glances API password hash
      ansible.builtin.copy:
        content: "{{ (base_glances_bootstrap_credentials.stdout | from_json).hash }}"
        dest: "{{ base_glances_password_file }}"
        owner: root
        group: glances
        mode: "0640"
      notify: Restart Glances service
      become: true

    - name: Store root-only Glances API bootstrap password
      ansible.builtin.copy:
        content: "{{ (base_glances_bootstrap_credentials.stdout | from_json).password }}"
        dest: "{{ base_glances_bootstrap_password_file }}"
        owner: root
        group: root
        mode: "0600"
      become: true

- name: Read Glances systemd drop-in parent directory
  ansible.builtin.stat:
    path: "{{ base_glances_dropin_path | dirname }}"
  register: base_glances_dropin_parent_stat
  changed_when: false
  become: true

- name: Assert existing Glances systemd drop-in parent is a directory
  ansible.builtin.assert:
    that:
      - base_glances_dropin_parent_stat.stat.isdir
    fail_msg: >-
      Glances systemd drop-in parent exists but is not a directory:
      {{ base_glances_dropin_path | dirname }}.
  when: base_glances_dropin_parent_stat.stat.exists

- name: Create missing Glances systemd drop-in parent directory
  ansible.builtin.file:
    path: "{{ base_glances_dropin_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not base_glances_dropin_parent_stat.stat.exists
  become: true

- name: Install PiServ Glances API systemd override
  ansible.builtin.template:
    src: glances.service.d-piserv-api.conf.j2
    dest: "{{ base_glances_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Glances service
  become: true

- name: Ensure Glances API service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ base_glances_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Apply pending Glances service changes
  ansible.builtin.meta: flush_handlers

- name: Validate Glances local API status
  ansible.builtin.uri:
    url: >-
      http://{{ base_glances_validation_address }}:{{ base_glances_port }}/api/4/status
    status_code: 401
  register: base_glances_unauthenticated_api_status
  changed_when: false
  failed_when: false
  until: base_glances_unauthenticated_api_status.status | int == 401
  retries: 10
  delay: 1
  check_mode: false

- name: Assert Glances local API requires authentication
  ansible.builtin.assert:
    that:
      - base_glances_unauthenticated_api_status.status | int == 401
    fail_msg: Glances local API accepted an unauthenticated request.

- name: Read Glances API bootstrap password state
  ansible.builtin.stat:
    path: "{{ base_glances_bootstrap_password_file }}"
  register: base_glances_bootstrap_password_file_stat
  changed_when: false
  no_log: true
  become: true

- name: Assert Glances API bootstrap password is available
  ansible.builtin.assert:
    that:
      - base_glances_bootstrap_password_file_stat.stat.exists
      - base_glances_bootstrap_password_file_stat.stat.isreg
    fail_msg: >-
      Glances API bootstrap password is unavailable after credential
      reconciliation.
  when: not ansible_check_mode

- name: Validate Glances API with bootstrap credentials
  when: base_glances_bootstrap_password_file_stat.stat.exists
  no_log: true
  block:
    - name: Read Glances API bootstrap password
      ansible.builtin.slurp:
        src: "{{ base_glances_bootstrap_password_file }}"
      register: base_glances_bootstrap_password
      become: true

    - name: Validate Glances local API with bootstrap credentials
      ansible.builtin.uri:
        url: >-
          http://{{ base_glances_validation_address }}:{{ base_glances_port }}/api/4/status
        url_username: "{{ base_glances_auth_username }}"
        url_password: "{{ base_glances_bootstrap_password.content | b64decode }}"
        force_basic_auth: true
        return_content: true
        status_code: 200
      register: base_glances_authenticated_api_status
      changed_when: false
      check_mode: false

    - name: Assert Glances local API returns its version with bootstrap credentials
      ansible.builtin.assert:
        that:
          - base_glances_authenticated_api_status.status | int == 200
          - base_glances_authenticated_api_status.json.version is defined
        fail_msg: Glances did not return a valid authenticated local API response.

- name: Clear Glances API credential recovery marker
  ansible.builtin.file:
    path: "{{ base_glances_bootstrap_password_file }}.pending"
    state: absent
  no_log: true
  when:
    - base_glances_credentials_regeneration_required | bool
    - not ansible_check_mode
  become: true

- name: Read TCP listening sockets for Glances validation
  ansible.builtin.command:
    argv:
      - /usr/bin/ss
      - -ltn
  register: base_glances_listening_sockets
  changed_when: false
  check_mode: false

- name: Assert Glances listens on the configured IPv4 address
  ansible.builtin.assert:
    that:
      - >-
        (base_glances_bind_address ~ ':' ~ (base_glances_port | string)) in
        base_glances_listening_sockets.stdout
      - >-
        ('[::]:' ~ (base_glances_port | string)) not in
        base_glances_listening_sockets.stdout
    fail_msg: >-
      Glances must listen on {{ base_glances_bind_address }}:{{ base_glances_port }}
      without an IPv6 wildcard listener.
