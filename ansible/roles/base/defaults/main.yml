---
base_manage_ssh: true
base_ssh_service_name: ssh.service
base_sshd_binary: /usr/sbin/sshd
base_ssh_dropin_dir: /etc/ssh/sshd_config.d
base_ssh_dropin_path: "{{ base_ssh_dropin_dir }}/99-piserv-hardening.conf"
base_ssh_dropin_comment: "Managed by Ansible base role."
base_ssh_permit_root_login: "no"
base_ssh_password_authentication: "no"
base_ssh_kbd_interactive_authentication: "no"
base_ssh_pubkey_authentication: "yes"

base_manage_vnc: true
base_vnc_service_name: wayvnc.service
base_vnc_control_service_name: wayvnc-control.service
base_vnc_output: DSI-1
base_vnc_control_socket_path: /tmp/wayvnc/wayvncctl.sock
base_vnc_output_selector_path: /usr/local/libexec/piserv-wayvnc-select-output
base_vnc_output_selector_service_name: piserv-wayvnc-output.service
base_vnc_output_selector_service_path: /etc/systemd/system/piserv-wayvnc-output.service
base_vnc_output_selector_delay_seconds: 2
base_vnc_output_selector_timeout_seconds: 30

base_manage_glances: true
base_glances_packages:
  - glances
  - lm-sensors
base_glances_service_name: glances.service
base_glances_dropin_dir: "/etc/systemd/system/{{ base_glances_service_name }}.d"
base_glances_dropin_path: "{{ base_glances_dropin_dir }}/piserv-api.conf"
base_glances_bind_address: 127.0.0.1
base_glances_port: 61208
base_glances_state_directory: glances
base_glances_runtime_directory: glances

base_manage_disabled_services: true
base_disabled_systemd_units:
  - cups.service
  - cups.socket
  - rpcbind.service
  - rpcbind.socket
  - nfs-blkmap.service

base_manage_unattended_upgrades: true
base_unattended_upgrade_packages:
  - unattended-upgrades
base_unattended_update_package_lists: "1"
base_unattended_upgrade_enabled: "1"
base_unattended_autoclean_interval: "7"
base_unattended_origins_patterns:
  - "origin=Debian,codename=${distro_codename},label=Debian"
  - "origin=Debian,codename=${distro_codename}-updates,label=Debian"
  - "origin=Debian,codename=${distro_codename},label=Debian-Security"
  - "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"
  - "origin=Raspberry Pi Foundation,label=Raspberry Pi Foundation"
base_unattended_automatic_reboot: true
base_unattended_automatic_reboot_time: "06:30"
base_unattended_remove_unused_dependencies: true
base_unattended_remove_new_unused_dependencies: true
base_unattended_validate_dry_run: true
base_manage_unattended_upgrade_digest: true
base_unattended_mail_to: root
base_unattended_mail_report: on-change

base_manage_reboot_notification: true
base_reboot_notification_service_name: piserv-reboot-notify.service
base_reboot_notification_script_path: /usr/local/sbin/piserv-reboot-notify
base_reboot_notification_recipient: root
base_reboot_notification_subject_prefix: "[PiServ]"
base_reboot_notification_condition_path: /etc/msmtprc

base_manage_cloud_init: true
base_cloud_init_disable: true
base_cloud_init_disabled_marker_path: /etc/cloud/cloud-init.disabled
base_cloud_init_disabled_marker_content: |
  Disabled by Ansible base role.
  Configuration is managed by Ansible after SSH is reachable.
base_cloud_init_units:
  - cloud-init-local.service
  - cloud-init-network.service
  - cloud-init-main.service
  - cloud-config.service
  - cloud-final.service
