---
- name: Migrate authenticated schema-v2 Home Assistant CLI provenance
  ansible.builtin.template:
    src: >-
      {{ homeassistant_cli_install_provenance_template |
         default('install-provenance.j2') }}
    dest: "{{ homeassistant_cli_provenance_path }}"
    owner: "{{ homeassistant_cli_provenance_owner | default('root') }}"
    group: "{{ homeassistant_cli_provenance_group | default('root') }}"
    mode: "0600"
    unsafe_writes: false
  become: true
  vars:
    homeassistant_cli_provenance_state: in_progress
  when:
    - homeassistant_cli_install_preexisting
    - homeassistant_cli_provenance_migration_required | default(false)
    - not ansible_check_mode
