---
- name: Prepare raiplaysound-cli runtime and effective configuration
  ansible.builtin.include_tasks: prepare.yml

- name: Resolve selected raiplaysound-cli release
  ansible.builtin.include_tasks: resolve-release.yml

- name: Install raiplaysound-cli prerequisites and prepare source paths
  ansible.builtin.include_tasks: install-prerequisites.yml

- name: Check out and install raiplaysound-cli source
  ansible.builtin.include_tasks: install-source.yml

- name: Manage raiplaysound-cli configuration
  ansible.builtin.include_tasks: manage-config.yml
  when: raiplaysound_cli_config_mode in ['managed', 'create']

- name: Validate unmanaged raiplaysound-cli timer configuration
  ansible.builtin.include_tasks: validate-unmanaged-config.yml
  when:
    - raiplaysound_cli_config_mode == 'unmanaged'
    - raiplaysound_cli_manage_user_timer | bool

- name: Validate installed raiplaysound-cli commands
  ansible.builtin.include_tasks: validate-installed-commands.yml
  when: not ansible_check_mode or raiplaysound_cli_command_stat.stat.exists

- name: Configure raiplaysound-cli user timer
  ansible.builtin.include_tasks: configure-timer.yml
  when: raiplaysound_cli_manage_user_timer | bool
