---
- name: Validate raiplaysound-cli release selector
  ansible.builtin.assert:
    that:
      - raiplaysound_cli_release is string
      - raiplaysound_cli_release | length > 0
    fail_msg: "raiplaysound_cli_release must be 'latest' or a GitHub release tag."

- name: Read latest raiplaysound-cli GitHub release
  when: raiplaysound_cli_release == 'latest'
  ansible.builtin.uri:
    url: "{{ raiplaysound_cli_latest_release_api }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
    return_content: true
    status_code: 200
  register: raiplaysound_cli_latest_release
  changed_when: false
  check_mode: false

- name: Select raiplaysound-cli release tag
  ansible.builtin.set_fact:
    raiplaysound_cli_checkout_version: >-
      {{ raiplaysound_cli_latest_release.json.tag_name
      if raiplaysound_cli_release == 'latest'
      else raiplaysound_cli_release }}

- name: Validate resolved raiplaysound-cli release tag
  ansible.builtin.assert:
    that:
      - raiplaysound_cli_checkout_version is string
      - raiplaysound_cli_checkout_version | length > 0
    fail_msg: "Resolved raiplaysound-cli release tag must be a nonempty string."
