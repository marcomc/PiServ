---
argument_specs:
  main:
    short_description: Install and configure a UFW firewall.
    description:
      - Installs UFW and manages default policies, serial rule application, logging, and runtime state.
      - Leaves host-specific service and network allowlists to role consumers.
    options:
      firewall_manage_package:
        type: bool
        default: true
        description: Whether to install the UFW package.
      firewall_package_name:
        type: str
        default: ufw
        description: UFW package name.
      firewall_apt_update_cache:
        type: bool
        default: true
        description: Whether to update the apt cache before package installation.
      firewall_apt_cache_valid_time:
        type: int
        default: 3600
        description: Apt cache validity in seconds.
      firewall_manage_defaults:
        type: bool
        default: true
        description: Whether to manage default UFW policies.
      firewall_default_incoming_policy:
        type: str
        default: deny
        choices:
          - allow
          - deny
          - reject
        description: Default incoming policy.
      firewall_default_outgoing_policy:
        type: str
        default: allow
        choices:
          - allow
          - deny
          - reject
        description: Default outgoing policy.
      firewall_default_routed_policy:
        type: str
        default: deny
        choices:
          - allow
          - deny
          - reject
        description: Default routed traffic policy.
      firewall_rules:
        type: list
        elements: dict
        default: []
        description: Ordered UFW rule definitions.
        options:
          rule:
            type: str
            default: allow
            choices:
              - allow
              - deny
              - limit
              - reject
            description: Rule action.
          direction:
            type: str
            choices:
              - in
              - incoming
              - out
              - outgoing
              - routed
            description: Rule direction.
          interface:
            type: str
            description: Interface used by the rule direction.
          interface_in:
            type: str
            description: Input interface for a routed rule.
          interface_out:
            type: str
            description: Output interface for a routed rule.
          from_ip:
            type: str
            description: Source address or CIDR.
          from_port:
            type: str
            description: Source port or port range.
          to_ip:
            type: str
            description: Destination address or CIDR.
          to_port:
            type: str
            description: Destination port or port range.
          proto:
            type: str
            choices:
              - any
              - tcp
              - udp
              - ipv6
              - esp
              - ah
              - gre
              - igmp
              - vrrp
            description: Network protocol.
          name:
            type: str
            description: UFW application profile name.
          comment:
            type: str
            description: Rule comment.
          log:
            type: bool
            default: false
            description: Whether to log new connections matched by the rule.
          route:
            type: bool
            default: false
            description: Whether the rule applies to routed traffic.
          delete:
            type: bool
            default: false
            description: Whether to delete the matching rule.
          insert:
            type: int
            description: Rule insertion position.
          insert_relative_to:
            type: str
            choices:
              - first-ipv4
              - first-ipv6
              - last-ipv4
              - last-ipv6
              - zero
            description: Address-family anchor for the insertion position.
      firewall_manage_logging:
        type: bool
        default: true
        description: Whether to manage UFW logging.
      firewall_logging:
        type: str
        default: low
        choices:
          - "on"
          - "off"
          - low
          - medium
          - high
          - full
        description: UFW logging level.
      firewall_manage_state:
        type: bool
        default: true
        description: Whether to manage UFW enabled or disabled state.
      firewall_state:
        type: str
        default: enabled
        choices:
          - enabled
          - disabled
        description: Requested UFW state.
      firewall_manage_service:
        type: bool
        default: true
        description: Whether to manage the UFW systemd service.
      firewall_service_name:
        type: str
        default: ufw.service
        description: UFW systemd service name.
      firewall_validate:
        type: bool
        default: true
        description: Whether to validate UFW and systemd runtime state.
      firewall_supported_os_families:
        type: list
        elements: str
        description: OS families accepted by role validation.
