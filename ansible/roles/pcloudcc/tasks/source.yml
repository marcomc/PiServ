---
- name: Ensure pcloudcc install root exists
  ansible.builtin.file:
    path: "{{ pcloudcc_install_root }}"
    state: directory
    owner: "{{ pcloudcc_runtime_user }}"
    group: "{{ pcloudcc_runtime_user }}"
    mode: "0755"
  become: true

- name: Check out official pcloudcc source
  ansible.builtin.git:
    repo: "{{ pcloudcc_repo_url }}"
    dest: "{{ pcloudcc_source_dir }}"
    version: "{{ pcloudcc_repo_version }}"
    update: "{{ pcloudcc_repo_update }}"
    force: "{{ pcloudcc_repo_force }}"
  register: pcloudcc_git_checkout

- name: Read pcloudcc source revision
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - rev-parse
      - HEAD
  args:
    chdir: "{{ pcloudcc_source_dir }}"
  register: pcloudcc_source_revision
  changed_when: false
  check_mode: false

- name: Assert pcloudcc source revision matches pinned commit
  when: pcloudcc_repo_version is match('^[0-9a-fA-F]{40}$')
  ansible.builtin.assert:
    that:
      - pcloudcc_source_revision.stdout | lower == pcloudcc_repo_version | lower
    fail_msg: >-
      pcloudcc source checkout is at {{ pcloudcc_source_revision.stdout }},
      expected pinned revision {{ pcloudcc_repo_version }}. Set
      pcloudcc_repo_update=true to fetch the pinned revision when needed.

- name: Copy pcloudcc source patches
  ansible.builtin.copy:
    src: "{{ pcloudcc_patch_file_item }}"
    dest: "{{ pcloudcc_install_root }}/{{ pcloudcc_patch_file_item }}"
    owner: "{{ pcloudcc_runtime_user }}"
    group: "{{ pcloudcc_runtime_user }}"
    mode: "0644"
  register: pcloudcc_patch_copy
  loop: "{{ pcloudcc_patch_files }}"
  loop_control:
    loop_var: pcloudcc_patch_file_item

- name: Check whether pcloudcc source patches are already applied
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - apply
      - --reverse
      - --check
      - "{{ pcloudcc_install_root }}/{{ pcloudcc_patch_file_item }}"
  args:
    chdir: "{{ pcloudcc_source_dir }}"
  register: pcloudcc_patch_reverse_check
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ pcloudcc_patch_files }}"
  loop_control:
    loop_var: pcloudcc_patch_file_item

- name: Record unapplied pcloudcc source patches
  ansible.builtin.set_fact:
    pcloudcc_unapplied_patches: >-
      {{ pcloudcc_patch_reverse_check.results
         | rejectattr('rc', 'equalto', 0)
         | list }}

- name: Validate and apply missing pcloudcc source patches
  when: pcloudcc_unapplied_patches | length > 0
  block:
    - name: Check pcloudcc source patches apply cleanly
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - apply
          - --check
          - "{{ pcloudcc_install_root }}/{{ pcloudcc_patch_reverse_check_item.pcloudcc_patch_file_item }}"
      args:
        chdir: "{{ pcloudcc_source_dir }}"
      changed_when: false
      check_mode: false
      loop: "{{ pcloudcc_unapplied_patches }}"
      loop_control:
        loop_var: pcloudcc_patch_reverse_check_item
        label: "{{ pcloudcc_patch_reverse_check_item.pcloudcc_patch_file_item }}"

    - name: Apply pcloudcc source patches
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - apply
          - "{{ pcloudcc_install_root }}/{{ pcloudcc_patch_reverse_check_item.pcloudcc_patch_file_item }}"
      args:
        chdir: "{{ pcloudcc_source_dir }}"
      register: pcloudcc_patch_apply
      changed_when: true
      loop: "{{ pcloudcc_unapplied_patches }}"
      loop_control:
        loop_var: pcloudcc_patch_reverse_check_item
        label: "{{ pcloudcc_patch_reverse_check_item.pcloudcc_patch_file_item }}"

- name: Check whether pCloud mount root is already mounted
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --mountpoint
      - "{{ pcloudcc_mount_root }}"
  register: pcloudcc_source_mount_root_mount
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure pCloud mount root exists
  when: pcloudcc_source_mount_root_mount.rc != 0
  ansible.builtin.file:
    path: "{{ pcloudcc_mount_root }}"
    state: directory
    owner: "{{ pcloudcc_runtime_user }}"
    group: "{{ pcloudcc_runtime_user }}"
    mode: "0755"
  become: true
