---
- name: Validate pcloudcc target
  ansible.builtin.import_tasks: validate-target.yml

- name: Load pcloudcc runtime user facts
  ansible.builtin.import_tasks: runtime-user.yml

- name: Install pcloudcc build packages
  ansible.builtin.import_tasks: packages.yml

- name: Prepare pcloudcc source
  ansible.builtin.import_tasks: source.yml

- name: Build pcloudcc
  ansible.builtin.import_tasks: build.yml

- name: Validate pcloudcc install
  ansible.builtin.import_tasks: validate-install.yml

- name: Harden pcloudcc credential storage
  ansible.builtin.import_tasks: credentials.yml

- name: Configure pcloudcc user service
  ansible.builtin.import_tasks: user-service.yml
