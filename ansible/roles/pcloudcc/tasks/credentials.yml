---
- name: Check pcloudcc state directory
  ansible.builtin.stat:
    path: "{{ pcloudcc_runtime_user_home }}/.pcloud"
  register: pcloudcc_state_dir_stat

- name: Harden pcloudcc state directory permissions
  when:
    - pcloudcc_harden_credentials | bool
    - pcloudcc_state_dir_stat.stat.exists
  ansible.builtin.file:
    path: "{{ pcloudcc_runtime_user_home }}/.pcloud"
    state: directory
    owner: "{{ pcloudcc_runtime_user }}"
    group: "{{ pcloudcc_runtime_user }}"
    mode: "u=rwX,go="
    recurse: true
  become: true
