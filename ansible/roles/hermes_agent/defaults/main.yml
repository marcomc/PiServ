---
hermes_agent_user: hermes-agent
hermes_agent_group: hermes-agent
hermes_agent_home: /var/lib/hermes-agent
hermes_agent_install_dir: /usr/local/lib/hermes-agent
hermes_agent_repo_url: https://github.com/NousResearch/hermes-agent.git
hermes_agent_repo_version: 240afd0b70a016ba17568d597e0f2c32f94f4cfd
hermes_agent_version: "0.19.0"
hermes_agent_installer_url: >-
  https://raw.githubusercontent.com/NousResearch/hermes-agent/{{
  hermes_agent_repo_version }}/scripts/install.sh
hermes_agent_installer_path: /usr/local/libexec/hermes-agent-installer
hermes_agent_installer_checksum: >-
  sha256:ab3e6ae1a1bda828941df8911ae44ed5de68412805124f338f157aa0360eb660
hermes_agent_packages:
  - build-essential
  - ca-certificates
  - curl
  - git
  - libffi-dev
  - python3-dev
  - ripgrep
hermes_agent_model: gpt-5.5
hermes_agent_provider: openai-codex
hermes_agent_enabled_toolsets:
  - memory
  - skills
hermes_agent_disabled_toolsets:
  - browser
  - clarify
  - code_execution
  - computer_use
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - feishu_doc
  - feishu_drive
  - file
  - homeassistant
  - image_gen
  - kanban
  - project
  - search
  - session_search
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
hermes_agent_dashboard_host: 127.0.0.1
hermes_agent_dashboard_port: 9119
hermes_agent_dashboard_service_name: hermes-agent-dashboard.service
hermes_agent_manage_dashboard: true
hermes_agent_codex_version: "0.145.0"
hermes_agent_codex_archive_url: >-
  https://github.com/openai/codex/releases/download/rust-v{{
  hermes_agent_codex_version }}/codex-aarch64-unknown-linux-musl.tar.gz
hermes_agent_codex_archive_checksum: >-
  sha256:d384f90bc842450b42bd675feef06a12a46a3b1ca97efcb22566b270e4a11227
hermes_agent_codex_install_dir: >-
  /usr/local/lib/codex/{{ hermes_agent_codex_version }}
hermes_agent_codex_home: "{{ hermes_agent_home }}/codex"
hermes_agent_manage_backup: false
hermes_agent_backup_group: ""
hermes_agent_backup_dir: /var/backups/hermes-agent
hermes_agent_backup_retention_days: 30
hermes_agent_backup_on_calendar: "*-*-* 03:20:00"
hermes_agent_backup_timezone: UTC
hermes_agent_backup_randomized_delay: 30m
