---
- name: Test Hermes dashboard bind-source authentication
  hosts: localhost
  become: true
  gather_facts: false
  vars:
    hermes_agent_bind_test_root: /root/hermes-agent-bind-source-test
    hermes_agent_bind_test_root_group: root
    hermes_agent_bind_test_nonroot_user: nobody
  tasks:
    - name: Reset Hermes bind-source fixtures
      ansible.builtin.file:
        path: "{{ hermes_agent_bind_test_root }}"
        state: absent
      when: not ansible_check_mode

    - name: Create Hermes bind-source fixture directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: "{{ hermes_agent_bind_test_root_group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ hermes_agent_bind_test_root }}"
          mode: "0700"
        - path: "{{ hermes_agent_bind_test_root }}/safe"
          mode: "0700"
        - path: "{{ hermes_agent_bind_test_root }}/writable-parent"
          mode: "0770"
        - path: "{{ hermes_agent_bind_test_root }}/directory-source"
          mode: "0700"

    - name: Create Hermes bind-source regular-file fixtures
      ansible.builtin.copy:
        content: "managed policy\n"
        dest: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ hermes_agent_bind_test_root }}/safe/policy"
          owner: root
          group: "{{ hermes_agent_bind_test_root_group }}"
          mode: "0600"
        - path: "{{ hermes_agent_bind_test_root }}/writable-source"
          owner: root
          group: "{{ hermes_agent_bind_test_root_group }}"
          mode: "0620"
        - path: "{{ hermes_agent_bind_test_root }}/nonroot-source"
          owner: "{{ hermes_agent_bind_test_nonroot_user }}"
          group: "{{ hermes_agent_bind_test_root_group }}"
          mode: "0600"
        - path: "{{ hermes_agent_bind_test_root }}/writable-parent/policy"
          owner: root
          group: "{{ hermes_agent_bind_test_root_group }}"
          mode: "0600"

    - name: Create Hermes bind-source symlink fixtures
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
      loop:
        - src: "{{ hermes_agent_bind_test_root }}/safe/policy"
          dest: "{{ hermes_agent_bind_test_root }}/source-link"
        - src: "{{ hermes_agent_bind_test_root }}/safe"
          dest: "{{ hermes_agent_bind_test_root }}/parent-link"

    - name: Create Hermes bind-source special-file fixture
      ansible.builtin.command:
        argv:
          - /usr/bin/mkfifo
          - "{{ hermes_agent_bind_test_root }}/fifo-source"
      args:
        creates: "{{ hermes_agent_bind_test_root }}/fifo-source"

    - name: Exercise Hermes bind-source authentication cases
      ansible.builtin.include_tasks: assert-bind-source-case.yml
      loop:
        - name: canonical root-controlled regular file
          path: "{{ hermes_agent_bind_test_root }}/safe/policy"
          rejected: false
        - name: missing source
          path: "{{ hermes_agent_bind_test_root }}/missing"
          rejected: true
        - name: symlink source
          path: "{{ hermes_agent_bind_test_root }}/source-link"
          rejected: true
        - name: directory source
          path: "{{ hermes_agent_bind_test_root }}/directory-source"
          rejected: true
        - name: special-file source
          path: "{{ hermes_agent_bind_test_root }}/fifo-source"
          rejected: true
        - name: non-root source
          path: "{{ hermes_agent_bind_test_root }}/nonroot-source"
          rejected: true
        - name: group-writable source
          path: "{{ hermes_agent_bind_test_root }}/writable-source"
          rejected: true
        - name: writable ancestor
          path: "{{ hermes_agent_bind_test_root }}/writable-parent/policy"
          rejected: true
        - name: symlink ancestor
          path: "{{ hermes_agent_bind_test_root }}/parent-link/policy"
          rejected: true
      loop_control:
        loop_var: hermes_agent_bind_source_case
        label: "{{ hermes_agent_bind_source_case.name }}"
