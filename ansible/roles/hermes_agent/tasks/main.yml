---
- name: Validate Hermes Agent target and policy
  ansible.builtin.import_tasks: validate-target.yml

- name: Validate Hermes Agent local-model storage
  ansible.builtin.import_tasks: validate-local-model-storage.yml
  when: hermes_agent_manage_local_models

- name: Validate local-model managed-state path
  ansible.builtin.import_tasks: validate-local-model-managed-state.yml

- name: Preflight Hermes Agent runtime identity and persistent paths
  ansible.builtin.include_tasks: runtime-user.yml
  vars:
    hermes_agent_runtime_user_phase: preflight

- name: Install Hermes Agent system packages
  ansible.builtin.apt:
    name: "{{ hermes_agent_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure Hermes Agent runtime identity
  ansible.builtin.include_tasks: runtime-user.yml
  vars:
    hermes_agent_runtime_user_phase: mutate

- name: Install pinned Hermes Agent runtime
  ansible.builtin.import_tasks: install-hermes.yml

- name: Install pinned Codex CLI
  ansible.builtin.import_tasks: install-codex.yml

- name: Reconcile managed local-model service units
  ansible.builtin.import_tasks: reconcile-local-model-units.yml
  vars:
    hermes_agent_local_model_desired_ids: >-
      {{
        hermes_agent_local_models | map(attribute='id') | list
        if hermes_agent_manage_local_models else []
      }}

- name: Install local-model benchmark runtime
  ansible.builtin.import_tasks: local-models.yml
  when: hermes_agent_manage_local_models

- name: Configure Hermes Agent state and services
  ansible.builtin.import_tasks: configure.yml

- name: Validate Hermes Agent installation
  ansible.builtin.import_tasks: validate-install.yml
