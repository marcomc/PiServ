---
- name: Inspect Hermes dashboard bootstrap password parent
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_basic_auth_bootstrap_password_file | dirname }}"
    follow: false
  register: hermes_agent_dashboard_bootstrap_password_parent
  changed_when: false
  check_mode: false

- name: Require a safe Hermes dashboard bootstrap password parent
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_dashboard_bootstrap_password_parent.stat.exists or
        (hermes_agent_dashboard_bootstrap_password_parent.stat.isdir and
        not hermes_agent_dashboard_bootstrap_password_parent.stat.islnk and
        hermes_agent_dashboard_bootstrap_password_parent.stat.uid == 0 and
        hermes_agent_dashboard_bootstrap_password_parent.stat.gid == 0 and
        hermes_agent_dashboard_bootstrap_password_parent.stat.mode is
        match('^0[0-7][0145][0145]$'))
    fail_msg: >-
      An existing Hermes dashboard bootstrap password parent must be a
      root-owned directory that is not writable by group or other users.

- name: Create missing private Hermes dashboard bootstrap password parent
  ansible.builtin.file:
    path: "{{ hermes_agent_dashboard_basic_auth_bootstrap_password_file | dirname }}"
    state: directory
    owner: 0
    group: 0
    mode: "0700"
  when: not hermes_agent_dashboard_bootstrap_password_parent.stat.exists
