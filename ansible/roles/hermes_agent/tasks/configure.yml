---
- name: Create private Hermes runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0700"
  loop:
    - "{{ hermes_agent_home }}"
    - "{{ hermes_agent_codex_home }}"
    - "{{ hermes_agent_home }}/workspace"
  when: hermes_agent_runtime_user_available

- name: Create managed inference provenance plugin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0700"
  loop:
    - "{{ hermes_agent_home }}/plugins"
    - "{{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}"
    - "{{ hermes_agent_home }}/audit"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Install managed inference provenance plugin manifest
  ansible.builtin.template:
    src: inference-provenance-plugin.yaml.j2
    dest: >-
      {{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}/plugin.yaml
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Install managed inference provenance plugin
  ansible.builtin.template:
    src: inference-provenance-plugin.py.j2
    dest: >-
      {{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}/__init__.py
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Create private Home Assistant MCP token file
  ansible.builtin.file:
    path: "{{ hermes_agent_home_assistant_mcp_token_env_file }}"
    state: touch
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_home_assistant_mcp

- name: Read Hermes dashboard authentication state
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_basic_auth_state_file }}"
  register: hermes_agent_dashboard_basic_auth_state
  changed_when: false
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Generate Hermes dashboard authentication material
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_install_dir }}/venv/bin/python"
      - -c
      - |
        import json
        import secrets
        from plugins.dashboard_auth.basic import hash_password

        password = secrets.token_urlsafe(32)
        print(json.dumps({
            "username": "{{ hermes_agent_dashboard_basic_auth_username }}",
            "password": password,
            "password_hash": hash_password(password),
            "secret": secrets.token_urlsafe(32),
        }))
    chdir: "{{ hermes_agent_install_dir }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_dashboard_basic_auth_generated
  changed_when: false
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode
    - >-
      not hermes_agent_dashboard_basic_auth_state.stat.exists or
      hermes_agent_dashboard_rotate_basic_auth | bool

- name: Store private Hermes dashboard authentication state
  ansible.builtin.copy:
    content: >-
      {{ {
        'username': (hermes_agent_dashboard_basic_auth_generated.stdout | from_json).username,
        'password_hash': (hermes_agent_dashboard_basic_auth_generated.stdout | from_json).password_hash,
        'secret': (hermes_agent_dashboard_basic_auth_generated.stdout | from_json).secret,
        'session_ttl_seconds': hermes_agent_dashboard_basic_auth_session_ttl_seconds
      } | to_nice_yaml(indent=2) }}
    dest: "{{ hermes_agent_dashboard_basic_auth_state_file }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode
    - >-
      not hermes_agent_dashboard_basic_auth_state.stat.exists or
      hermes_agent_dashboard_rotate_basic_auth | bool

- name: Store root-only proposed Hermes dashboard password
  ansible.builtin.copy:
    content: >-
      {{ (hermes_agent_dashboard_basic_auth_generated.stdout | from_json).password }}
    dest: "{{ hermes_agent_dashboard_basic_auth_bootstrap_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode
    - >-
      not hermes_agent_dashboard_basic_auth_state.stat.exists or
      hermes_agent_dashboard_rotate_basic_auth | bool

- name: Read private Hermes dashboard authentication state
  ansible.builtin.slurp:
    src: "{{ hermes_agent_dashboard_basic_auth_state_file }}"
  register: hermes_agent_dashboard_basic_auth_state_contents
  changed_when: false
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode or hermes_agent_dashboard_basic_auth_state.stat.exists

- name: Load private Hermes dashboard authentication state
  ansible.builtin.set_fact:
    hermes_agent_dashboard_basic_auth: >-
      {{ {
        'username': (hermes_agent_dashboard_basic_auth_state_contents.content |
        b64decode | from_yaml).username,
        'password_hash': (hermes_agent_dashboard_basic_auth_state_contents.content |
        b64decode | from_yaml).password_hash,
        'secret': (hermes_agent_dashboard_basic_auth_state_contents.content |
        b64decode | from_yaml).secret,
        'session_ttl_seconds': (hermes_agent_dashboard_basic_auth_state_contents.content |
        b64decode | from_yaml).session_ttl_seconds
      } }}
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - hermes_agent_dashboard_basic_auth_state_contents is defined

- name: Normalize private Hermes dashboard authentication state
  ansible.builtin.copy:
    content: "{{ hermes_agent_dashboard_basic_auth | to_nice_yaml(indent=2) }}"
    dest: "{{ hermes_agent_dashboard_basic_auth_state_file }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode

- name: Prepare check-mode Hermes dashboard authentication state
  ansible.builtin.set_fact:
    hermes_agent_dashboard_basic_auth:
      username: "{{ hermes_agent_dashboard_basic_auth_username }}"
      password_hash: ""
      secret: ""
      session_ttl_seconds: "{{ hermes_agent_dashboard_basic_auth_session_ttl_seconds }}"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - ansible_check_mode
    - not hermes_agent_dashboard_basic_auth_state.stat.exists

- name: Clear one-shot Hermes dashboard password rotation request
  ansible.builtin.set_fact:
    hermes_agent_dashboard_rotate_basic_auth: false
  no_log: true
  when: hermes_agent_dashboard_rotate_basic_auth | bool

- name: Install locked-down Hermes configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_agent_home }}/config.yaml"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  when: hermes_agent_runtime_user_available
  notify: Restart Hermes Agent dashboard

- name: Restrict Hermes environment file
  ansible.builtin.file:
    path: "{{ hermes_agent_home }}/.env"
    state: touch
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  when:
    - hermes_agent_runtime_user_available
    - not ansible_check_mode or hermes_agent_checkout.stat.exists

- name: Inspect built Hermes dashboard
  ansible.builtin.stat:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/web_dist/index.html"
  register: hermes_agent_dashboard_dist
  when: hermes_agent_manage_dashboard

- name: Build pinned Hermes dashboard assets
  ansible.builtin.command:
    argv:
      - npm
      - run
      - build
      - -w
      - web
    chdir: "{{ hermes_agent_install_dir }}"
  environment:
    HOME: /root
    HERMES_HOME: "{{ hermes_agent_home }}"
    PATH: "{{ hermes_agent_home }}/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  changed_when: true
  when:
    - hermes_agent_manage_dashboard
    - not ansible_check_mode
    - >-
      not hermes_agent_dashboard_dist.stat.exists or
      hermes_agent_install is changed

- name: Refresh built Hermes dashboard state
  ansible.builtin.stat:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/web_dist/index.html"
  register: hermes_agent_dashboard_dist
  when: hermes_agent_manage_dashboard

- name: Configure Hermes Agent dashboard service
  ansible.builtin.template:
    src: hermes-agent-dashboard.service.j2
    dest: "/etc/systemd/system/{{ hermes_agent_dashboard_service_name }}"
    owner: root
    group: root
    mode: "0644"
  when: hermes_agent_manage_dashboard
  notify: Restart Hermes Agent dashboard

- name: Enable Hermes Agent dashboard
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_dashboard_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - hermes_agent_manage_dashboard
    - not ansible_check_mode or hermes_agent_dashboard_dist.stat.exists

- name: Configure Hermes Agent backups
  when:
    - hermes_agent_manage_backup
    - hermes_agent_runtime_user_available
  block:
    - name: Create private Hermes Agent backup directory
      ansible.builtin.file:
        path: "{{ hermes_agent_backup_dir }}"
        state: directory
        owner: "{{ hermes_agent_user }}"
        group: "{{ hermes_agent_group }}"
        mode: "0700"

    - name: Install Hermes Agent backup service
      ansible.builtin.template:
        src: hermes-agent-backup.service.j2
        dest: "/etc/systemd/system/{{ hermes_agent_backup_service_name }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install Hermes Agent backup timer
      ansible.builtin.template:
        src: hermes-agent-backup.timer.j2
        dest: "/etc/systemd/system/{{ hermes_agent_backup_timer_name }}"
        owner: root
        group: root
        mode: "0644"

    - name: Enable Hermes Agent backup timer
      ansible.builtin.systemd_service:
        name: "{{ hermes_agent_backup_timer_name }}"
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
