---
- name: Inspect private Hermes runtime directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ hermes_agent_home }}"
    - "{{ hermes_agent_codex_home }}"
    - "{{ hermes_agent_home }}/workspace"
  register: hermes_agent_runtime_directories
  changed_when: false
  check_mode: false
  when: hermes_agent_runtime_user_available

- name: Require safe private Hermes runtime directories
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        (item.stat.isdir and not item.stat.islnk)
    fail_msg: >-
      {{ item.item }} must be a directory rather than a symbolic link before
      its ownership or permissions can be managed.
  loop: "{{ hermes_agent_runtime_directories.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: hermes_agent_runtime_user_available

- name: Create private Hermes runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0700"
  loop:
    - "{{ hermes_agent_home }}"
    - "{{ hermes_agent_codex_home }}"
    - "{{ hermes_agent_home }}/workspace"
  when: hermes_agent_runtime_user_available

- name: Inspect managed inference provenance plugin directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ hermes_agent_home }}/plugins"
    - "{{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}"
    - "{{ hermes_agent_home }}/audit"
  register: hermes_agent_inference_provenance_directories
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Require safe managed inference provenance plugin directories
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        (item.stat.isdir and not item.stat.islnk)
    fail_msg: >-
      {{ item.item }} must be a directory rather than a symbolic link before
      its ownership or permissions can be managed.
  loop: "{{ hermes_agent_inference_provenance_directories.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Create managed inference provenance plugin directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0700"
  loop:
    - "{{ hermes_agent_home }}/plugins"
    - "{{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}"
    - "{{ hermes_agent_home }}/audit"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Install managed inference provenance plugin manifest
  ansible.builtin.template:
    src: inference-provenance-plugin.yaml.j2
    dest: >-
      {{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}/plugin.yaml
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Install managed inference provenance plugin
  ansible.builtin.template:
    src: inference-provenance-plugin.py.j2
    dest: >-
      {{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}/__init__.py
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Inspect installed inference provenance plugin files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - >-
      {{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}/plugin.yaml
    - >-
      {{ hermes_agent_home }}/plugins/{{ hermes_agent_inference_provenance_plugin_name }}/__init__.py
  register: hermes_agent_installed_inference_provenance_plugin_files
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Record managed inference provenance plugin state
  ansible.builtin.copy:
    content: |
      plugin_name: {{ hermes_agent_inference_provenance_plugin_name }}
      manifest_sha256: {{ hermes_agent_installed_inference_provenance_plugin_files.results[0].stat.checksum }}
      implementation_sha256: {{ hermes_agent_installed_inference_provenance_plugin_files.results[1].stat.checksum }}
    dest: >-
      {{ hermes_agent_installer_path }}.inference-provenance.yml
    owner: root
    group: root
    mode: "0600"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_inference_provenance

- name: Inspect managed inference provenance state for removal
  ansible.builtin.stat:
    path: >-
      {{ hermes_agent_installer_path }}.inference-provenance.yml
    follow: false
  register: hermes_agent_inference_provenance_managed_state_file
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - not hermes_agent_manage_inference_provenance

- name: Read managed inference provenance state for removal
  ansible.builtin.slurp:
    src: >-
      {{ hermes_agent_installer_path }}.inference-provenance.yml
  register: hermes_agent_inference_provenance_managed_state_raw
  when:
    - hermes_agent_runtime_user_available
    - not hermes_agent_manage_inference_provenance
    - hermes_agent_inference_provenance_managed_state_file.stat.isreg | default(false)
    - not hermes_agent_inference_provenance_managed_state_file.stat.islnk | default(true)

- name: Load managed inference provenance state for removal
  ansible.builtin.set_fact:
    hermes_agent_inference_provenance_managed_state: >-
      {{
        (hermes_agent_inference_provenance_managed_state_raw.content |
        b64decode | from_yaml)
        if hermes_agent_inference_provenance_managed_state_raw is not skipped
        else {}
      }}
  when:
    - hermes_agent_runtime_user_available
    - not hermes_agent_manage_inference_provenance

- name: Select managed inference provenance plugin name for removal
  ansible.builtin.set_fact:
    hermes_agent_inference_provenance_removal_plugin_name: >-
      {{
        hermes_agent_inference_provenance_managed_state.get(
          'plugin_name', hermes_agent_inference_provenance_plugin_name
        )
      }}
  when:
    - hermes_agent_runtime_user_available
    - not hermes_agent_manage_inference_provenance

- name: Inspect managed inference provenance plugin files for removal
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop:
    - path: >-
        {{ hermes_agent_home ~ '/plugins/' ~
        hermes_agent_inference_provenance_removal_plugin_name ~
        '/plugin.yaml' }}
      checksum_key: manifest_sha256
    - path: >-
        {{ hermes_agent_home ~ '/plugins/' ~
        hermes_agent_inference_provenance_removal_plugin_name ~
        '/__init__.py' }}
      checksum_key: implementation_sha256
  register: hermes_agent_inference_provenance_plugin_files
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - not hermes_agent_manage_inference_provenance

- name: Remove managed inference provenance plugin files when disabled
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ hermes_agent_inference_provenance_plugin_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - hermes_agent_runtime_user_available
    - not hermes_agent_manage_inference_provenance
    - item.stat.exists
    - item.stat.isreg
    - not item.stat.islnk
    - >-
      item.stat.checksum ==
      hermes_agent_inference_provenance_managed_state.get(item.item.checksum_key)
    - >-
      hermes_agent_inference_provenance_managed_state.get('plugin_name', '')
      is match('^[a-z][a-z0-9-]*$')

- name: Remove recognized managed inference provenance state when disabled
  ansible.builtin.file:
    path: >-
      {{ hermes_agent_installer_path }}.inference-provenance.yml
    state: absent
  when:
    - hermes_agent_runtime_user_available
    - not hermes_agent_manage_inference_provenance
    - >-
      hermes_agent_inference_provenance_managed_state.get('plugin_name', '')
      is match('^[a-z][a-z0-9-]*$')
    - >-
      not hermes_agent_inference_provenance_plugin_files.results[0].stat.exists or
      (hermes_agent_inference_provenance_plugin_files.results[0].stat.isreg and
      not hermes_agent_inference_provenance_plugin_files.results[0].stat.islnk and
      hermes_agent_inference_provenance_plugin_files.results[0].stat.checksum ==
      hermes_agent_inference_provenance_managed_state.get('manifest_sha256'))
    - >-
      not hermes_agent_inference_provenance_plugin_files.results[1].stat.exists or
      (hermes_agent_inference_provenance_plugin_files.results[1].stat.isreg and
      not hermes_agent_inference_provenance_plugin_files.results[1].stat.islnk and
      hermes_agent_inference_provenance_plugin_files.results[1].stat.checksum ==
      hermes_agent_inference_provenance_managed_state.get('implementation_sha256'))

- name: Inspect Home Assistant MCP token parent
  ansible.builtin.stat:
    path: "{{ hermes_agent_home_assistant_mcp_token_env_file | dirname }}"
    follow: false
  register: hermes_agent_home_assistant_mcp_token_parent
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_home_assistant_mcp

- name: Require a safe Home Assistant MCP token parent
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_home_assistant_mcp_token_parent.stat.exists or
        (hermes_agent_home_assistant_mcp_token_parent.stat.isdir and
        not hermes_agent_home_assistant_mcp_token_parent.stat.islnk)
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_home_assistant_mcp

- name: Create missing private Home Assistant MCP token parent
  ansible.builtin.file:
    path: "{{ hermes_agent_home_assistant_mcp_token_env_file | dirname }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0700"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_home_assistant_mcp
    - not hermes_agent_home_assistant_mcp_token_parent.stat.exists

- name: Inspect Home Assistant MCP token file
  ansible.builtin.stat:
    path: "{{ hermes_agent_home_assistant_mcp_token_env_file }}"
    follow: false
  register: hermes_agent_home_assistant_mcp_token_file
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_home_assistant_mcp

- name: Require a regular Home Assistant MCP token file
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_home_assistant_mcp_token_file.stat.exists or
        (hermes_agent_home_assistant_mcp_token_file.stat.isreg and
        not hermes_agent_home_assistant_mcp_token_file.stat.islnk)
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_home_assistant_mcp

- name: Create private Home Assistant MCP token file
  ansible.builtin.file:
    path: "{{ hermes_agent_home_assistant_mcp_token_env_file }}"
    state: touch
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_manage_home_assistant_mcp

- name: Read Hermes dashboard authentication state
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_basic_auth_state_file }}"
    follow: false
  register: hermes_agent_dashboard_basic_auth_state
  changed_when: false
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Require a regular Hermes dashboard authentication state file
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_dashboard_basic_auth_state.stat.exists or
        (hermes_agent_dashboard_basic_auth_state.stat.isreg and
        not hermes_agent_dashboard_basic_auth_state.stat.islnk)
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Inspect Hermes dashboard authentication state parent
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_basic_auth_state_file | dirname }}"
    follow: false
  register: hermes_agent_dashboard_authentication_state_parent
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Require a safe Hermes dashboard authentication state parent
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_dashboard_authentication_state_parent.stat.exists or
        (hermes_agent_dashboard_authentication_state_parent.stat.isdir and
        not hermes_agent_dashboard_authentication_state_parent.stat.islnk)
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Create missing private Hermes dashboard authentication state parent
  ansible.builtin.file:
    path: "{{ hermes_agent_dashboard_basic_auth_state_file | dirname }}"
    state: directory
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0700"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not hermes_agent_dashboard_authentication_state_parent.stat.exists

- name: Inspect Hermes dashboard bootstrap password parent
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_basic_auth_bootstrap_password_file | dirname }}"
    follow: false
  register: hermes_agent_dashboard_bootstrap_password_parent
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Inspect Hermes dashboard bootstrap password file
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_basic_auth_bootstrap_password_file }}"
    follow: false
  register: hermes_agent_dashboard_bootstrap_password_file
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Require a regular Hermes dashboard bootstrap password file
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_dashboard_bootstrap_password_file.stat.exists or
        (hermes_agent_dashboard_bootstrap_password_file.stat.isreg and
        not hermes_agent_dashboard_bootstrap_password_file.stat.islnk)
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Require a safe Hermes dashboard bootstrap password parent
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_dashboard_bootstrap_password_parent.stat.exists or
        (hermes_agent_dashboard_bootstrap_password_parent.stat.isdir and
        not hermes_agent_dashboard_bootstrap_password_parent.stat.islnk)
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth

- name: Create missing private Hermes dashboard bootstrap password parent
  ansible.builtin.file:
    path: "{{ hermes_agent_dashboard_basic_auth_bootstrap_password_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not hermes_agent_dashboard_bootstrap_password_parent.stat.exists

- name: Generate Hermes dashboard authentication material
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_install_dir }}/venv/bin/python"
      - -c
      - |
        import json
        import secrets
        from plugins.dashboard_auth.basic import hash_password

        password = secrets.token_urlsafe(32)
        print(json.dumps({
            "username": "{{ hermes_agent_dashboard_basic_auth_username }}",
            "password": password,
            "password_hash": hash_password(password),
            "secret": secrets.token_urlsafe(32),
        }))
    chdir: "{{ hermes_agent_install_dir }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_dashboard_basic_auth_generated
  changed_when: false
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode
    - >-
      not hermes_agent_dashboard_basic_auth_state.stat.exists or
      hermes_agent_dashboard_rotate_basic_auth | bool

- name: Store private Hermes dashboard authentication state
  ansible.builtin.copy:
    content: >-
      {{ {
        'username': (hermes_agent_dashboard_basic_auth_generated.stdout | from_json).username,
        'password_hash': (hermes_agent_dashboard_basic_auth_generated.stdout | from_json).password_hash,
        'secret': (hermes_agent_dashboard_basic_auth_generated.stdout | from_json).secret,
        'session_ttl_seconds': hermes_agent_dashboard_basic_auth_session_ttl_seconds
      } | to_nice_yaml(indent=2) }}
    dest: "{{ hermes_agent_dashboard_basic_auth_state_file }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode
    - >-
      not hermes_agent_dashboard_basic_auth_state.stat.exists or
      hermes_agent_dashboard_rotate_basic_auth | bool

- name: Store root-only proposed Hermes dashboard password
  ansible.builtin.copy:
    content: >-
      {{ (hermes_agent_dashboard_basic_auth_generated.stdout | from_json).password }}
    dest: "{{ hermes_agent_dashboard_basic_auth_bootstrap_password_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode
    - >-
      not hermes_agent_dashboard_basic_auth_state.stat.exists or
      hermes_agent_dashboard_rotate_basic_auth | bool

- name: Read private Hermes dashboard authentication state
  ansible.builtin.slurp:
    src: "{{ hermes_agent_dashboard_basic_auth_state_file }}"
  register: hermes_agent_dashboard_basic_auth_state_contents
  changed_when: false
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode or hermes_agent_dashboard_basic_auth_state.stat.exists

- name: Load private Hermes dashboard authentication state
  ansible.builtin.set_fact:
    hermes_agent_dashboard_basic_auth: >-
      {{ {
        'username': (hermes_agent_dashboard_basic_auth_state_contents.content |
        b64decode | from_yaml).username,
        'password_hash': (hermes_agent_dashboard_basic_auth_state_contents.content |
        b64decode | from_yaml).password_hash,
        'secret': (hermes_agent_dashboard_basic_auth_state_contents.content |
        b64decode | from_yaml).secret,
        'session_ttl_seconds': hermes_agent_dashboard_basic_auth_session_ttl_seconds
      } }}
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - hermes_agent_dashboard_basic_auth_state_contents is defined

- name: Normalize private Hermes dashboard authentication state
  ansible.builtin.copy:
    content: "{{ hermes_agent_dashboard_basic_auth | to_nice_yaml(indent=2) }}"
    dest: "{{ hermes_agent_dashboard_basic_auth_state_file }}"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - not ansible_check_mode

- name: Prepare check-mode Hermes dashboard authentication state
  ansible.builtin.set_fact:
    hermes_agent_dashboard_basic_auth:
      username: "{{ hermes_agent_dashboard_basic_auth_username }}"
      password_hash: ""
      secret: ""
      session_ttl_seconds: "{{ hermes_agent_dashboard_basic_auth_session_ttl_seconds }}"
  no_log: true
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_dashboard_manage_basic_auth
    - ansible_check_mode
    - not hermes_agent_dashboard_basic_auth_state.stat.exists

- name: Clear one-shot Hermes dashboard password rotation request
  ansible.builtin.set_fact:
    hermes_agent_dashboard_rotate_basic_auth: false
  no_log: true
  when: hermes_agent_dashboard_rotate_basic_auth | bool

- name: Install locked-down Hermes configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_agent_home }}/config.yaml"
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
  when: hermes_agent_runtime_user_available
  notify: Restart Hermes Agent dashboard

- name: Inspect Hermes environment file
  ansible.builtin.stat:
    path: "{{ hermes_agent_home }}/.env"
    follow: false
  register: hermes_agent_environment_file
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - not ansible_check_mode or hermes_agent_checkout.stat.exists

- name: Require a regular Hermes environment file
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_environment_file.stat.exists or
        (hermes_agent_environment_file.stat.isreg and
        not hermes_agent_environment_file.stat.islnk)
  when:
    - hermes_agent_runtime_user_available
    - not ansible_check_mode or hermes_agent_checkout.stat.exists

- name: Restrict Hermes environment file metadata
  ansible.builtin.file:
    path: "{{ hermes_agent_home }}/.env"
    state: touch
    owner: "{{ hermes_agent_user }}"
    group: "{{ hermes_agent_group }}"
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  when:
    - hermes_agent_runtime_user_available
    - not ansible_check_mode or hermes_agent_checkout.stat.exists

- name: Resolve Hermes dashboard terminal UI source path
  ansible.builtin.command:
    argv:
      - /usr/bin/realpath
      - --canonicalize-existing
      - "{{ hermes_agent_install_dir }}/ui-tui"
  register: hermes_agent_dashboard_tui_source_path
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode or hermes_agent_checkout.stat.exists

- name: Resolve Hermes dashboard terminal UI runtime path
  ansible.builtin.command:
    argv:
      - /usr/bin/realpath
      - --canonicalize-missing
      - "{{ hermes_agent_dashboard_tui_runtime_dir }}"
  register: hermes_agent_dashboard_tui_runtime_path
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode or hermes_agent_checkout.stat.exists

- name: Inspect Hermes dashboard terminal UI runtime path
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_tui_runtime_dir }}"
    follow: false
  register: hermes_agent_dashboard_tui_runtime_path_stat
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode or hermes_agent_checkout.stat.exists

- name: Read existing Hermes dashboard terminal UI path identities
  ansible.builtin.command:
    argv:
      - /usr/bin/stat
      - --format=%d:%i
      - "{{ hermes_agent_install_dir }}/ui-tui"
      - "{{ hermes_agent_dashboard_tui_runtime_dir }}"
  register: hermes_agent_dashboard_tui_path_identities
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode or hermes_agent_checkout.stat.exists
    - hermes_agent_dashboard_tui_runtime_path_stat.stat.exists
    - hermes_agent_dashboard_tui_runtime_path_stat.stat.isdir
    - not hermes_agent_dashboard_tui_runtime_path_stat.stat.islnk

- name: Require separate Hermes dashboard terminal UI source and runtime paths
  ansible.builtin.assert:
    that:
      - >-
        hermes_agent_dashboard_tui_runtime_path.stdout | trim !=
        hermes_agent_dashboard_tui_source_path.stdout | trim
      - >-
        not (hermes_agent_dashboard_tui_runtime_path.stdout | trim).startswith(
        (hermes_agent_dashboard_tui_source_path.stdout | trim) ~ '/')
      - >-
        not (hermes_agent_dashboard_tui_source_path.stdout | trim).startswith(
        (hermes_agent_dashboard_tui_runtime_path.stdout | trim) ~ '/')
      - >-
        not hermes_agent_dashboard_tui_runtime_path_stat.stat.exists or
        (hermes_agent_dashboard_tui_runtime_path_stat.stat.isdir and
        not hermes_agent_dashboard_tui_runtime_path_stat.stat.islnk)
      - >-
        not hermes_agent_dashboard_tui_runtime_path_stat.stat.exists or
        hermes_agent_dashboard_tui_path_identities.stdout_lines | length == 2
      - >-
        not hermes_agent_dashboard_tui_runtime_path_stat.stat.exists or
        hermes_agent_dashboard_tui_path_identities.stdout_lines[0] !=
        hermes_agent_dashboard_tui_path_identities.stdout_lines[1]
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode or hermes_agent_checkout.stat.exists

- name: Inspect built Hermes dashboard
  ansible.builtin.stat:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/web_dist/index.html"
  register: hermes_agent_dashboard_dist
  when: hermes_agent_manage_dashboard

- name: Build pinned Hermes dashboard assets
  ansible.builtin.command:
    argv:
      - npm
      - run
      - build
      - -w
      - web
    chdir: "{{ hermes_agent_install_dir }}"
  environment:
    HOME: /root
    HERMES_HOME: "{{ hermes_agent_home }}"
    PATH: "{{ hermes_agent_home }}/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  changed_when: true
  when:
    - hermes_agent_manage_dashboard
    - not ansible_check_mode
    - >-
      not hermes_agent_dashboard_dist.stat.exists or
      hermes_agent_install is changed

- name: Refresh built Hermes dashboard state
  ansible.builtin.stat:
    path: "{{ hermes_agent_install_dir }}/hermes_cli/web_dist/index.html"
  register: hermes_agent_dashboard_dist
  when: hermes_agent_manage_dashboard

- name: Inspect built Hermes dashboard terminal UI bundle
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_tui_runtime_dir }}/dist/entry.js"
    checksum_algorithm: sha256
  register: hermes_agent_dashboard_tui_dist
  when: hermes_agent_manage_dashboard_chat

- name: Inspect Hermes dashboard terminal UI runtime revision
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_tui_runtime_revision_file }}"
  register: hermes_agent_dashboard_tui_runtime_revision
  when: hermes_agent_manage_dashboard_chat

- name: Read Hermes dashboard terminal UI runtime revision
  ansible.builtin.slurp:
    src: "{{ hermes_agent_dashboard_tui_runtime_revision_file }}"
  register: hermes_agent_dashboard_tui_runtime_revision_contents
  changed_when: false
  when:
    - hermes_agent_manage_dashboard_chat
    - hermes_agent_dashboard_tui_runtime_revision.stat.exists

- name: Inspect Hermes dashboard terminal UI managed state
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_tui_runtime_manifest_file }}"
  register: hermes_agent_dashboard_tui_manifest
  changed_when: false
  when: hermes_agent_manage_dashboard_chat

- name: Read Hermes dashboard terminal UI managed state
  ansible.builtin.slurp:
    src: "{{ hermes_agent_dashboard_tui_runtime_manifest_file }}"
  register: hermes_agent_dashboard_tui_manifest_contents
  changed_when: false
  when:
    - hermes_agent_manage_dashboard_chat
    - hermes_agent_dashboard_tui_manifest.stat.exists

- name: Calculate desired Hermes dashboard terminal UI source fingerprint
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - >-
        find . -type f ! -path './node_modules/*' ! -path './dist/*' ! -name
        '.hermes-revision' ! -name '.hermes-managed-state.yml' -print0 |
        LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1
  args:
    chdir: "{{ hermes_agent_install_dir }}/ui-tui"
  register: hermes_agent_dashboard_tui_source_fingerprint
  changed_when: false
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode
    - hermes_agent_checkout.stat.exists

- name: Calculate managed Hermes dashboard terminal UI source fingerprint
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - >-
        find . -type f ! -path './node_modules/*' ! -path './dist/*' ! -name
        '.hermes-revision' ! -name '.hermes-managed-state.yml' -print0 |
        LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1
  args:
    chdir: "{{ hermes_agent_dashboard_tui_runtime_dir }}"
  register: hermes_agent_dashboard_tui_runtime_source_fingerprint
  changed_when: false
  failed_when: false
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode

- name: Detect stale Hermes dashboard terminal UI runtime
  ansible.builtin.set_fact:
    hermes_agent_dashboard_tui_runtime_stale: >-
      {{
        not hermes_agent_dashboard_tui_runtime_revision.stat.exists or
        not hermes_agent_dashboard_tui_manifest.stat.exists or
        not hermes_agent_dashboard_tui_dist.stat.exists or
        hermes_agent_dashboard_tui_source_fingerprint.rc != 0 or
        hermes_agent_dashboard_tui_runtime_source_fingerprint.rc != 0 or
        hermes_agent_dashboard_tui_source_fingerprint.stdout | trim !=
        hermes_agent_dashboard_tui_runtime_source_fingerprint.stdout | trim or
        ('revision: ' ~ hermes_agent_repo_version) not in
        (hermes_agent_dashboard_tui_manifest_contents.content | b64decode) or
        ('entry_sha256: ' ~ hermes_agent_dashboard_tui_dist.stat.checksum) not in
        (hermes_agent_dashboard_tui_manifest_contents.content | b64decode) or
        ('source_sha256: ' ~
        (hermes_agent_dashboard_tui_source_fingerprint.stdout | trim)) not in
        (hermes_agent_dashboard_tui_manifest_contents.content | b64decode) or
        (hermes_agent_dashboard_tui_runtime_revision_contents.content | b64decode | trim) !=
        hermes_agent_repo_version
      }}
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode

- name: Create Hermes dashboard terminal UI runtime directory
  ansible.builtin.file:
    path: "{{ hermes_agent_dashboard_tui_runtime_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - hermes_agent_manage_dashboard_chat
    - >-
      not ansible_check_mode or
      not hermes_agent_dashboard_tui_dist.stat.exists

- name: Render Hermes dashboard terminal UI source into its managed runtime
  ansible.builtin.command:
    argv:
      - rsync
      - --archive
      - --delete
      - --exclude=node_modules
      - --exclude=dist
      - "{{ hermes_agent_install_dir }}/ui-tui/"
      - "{{ hermes_agent_dashboard_tui_runtime_dir }}/"
  changed_when: true
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode
    - >-
      hermes_agent_install is changed or
      not hermes_agent_dashboard_tui_dist.stat.exists or
      hermes_agent_dashboard_tui_runtime_stale

- name: Inspect Hermes dashboard terminal UI dependency source
  ansible.builtin.stat:
    path: "{{ hermes_agent_install_dir }}/node_modules"
  register: hermes_agent_dashboard_tui_dependencies
  changed_when: false
  check_mode: false
  when: hermes_agent_manage_dashboard_chat

- name: Link Hermes terminal UI dependencies into its managed runtime
  ansible.builtin.file:
    src: "{{ hermes_agent_install_dir }}/node_modules"
    dest: "{{ hermes_agent_dashboard_tui_runtime_dir }}/node_modules"
    state: link
    owner: root
    group: root
  when:
    - hermes_agent_manage_dashboard_chat
    - >-
      not ansible_check_mode or
      hermes_agent_dashboard_tui_dependencies.stat.exists

- name: Build Hermes dashboard terminal UI runtime bundle
  ansible.builtin.command:
    argv:
      - npm
      - run
      - build
    chdir: "{{ hermes_agent_dashboard_tui_runtime_dir }}"
  environment:
    HOME: /root
    HERMES_HOME: "{{ hermes_agent_home }}"
    PATH: "{{ hermes_agent_home }}/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  changed_when: true
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode
    - >-
      hermes_agent_install is changed or
      not hermes_agent_dashboard_tui_dist.stat.exists or
      hermes_agent_dashboard_tui_runtime_stale
  notify: Restart Hermes Agent dashboard

- name: Record Hermes dashboard terminal UI runtime revision
  ansible.builtin.copy:
    content: "{{ hermes_agent_repo_version }}\n"
    dest: "{{ hermes_agent_dashboard_tui_runtime_revision_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode

- name: Refresh Hermes dashboard terminal UI bundle state
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_tui_runtime_dir }}/dist/entry.js"
    checksum_algorithm: sha256
  register: hermes_agent_dashboard_tui_dist
  when: hermes_agent_manage_dashboard_chat

- name: Restrict Hermes dashboard terminal UI bundle permissions
  ansible.builtin.file:
    path: "{{ hermes_agent_dashboard_tui_runtime_dir }}/dist/entry.js"
    owner: root
    group: root
    mode: "0644"
  when:
    - hermes_agent_manage_dashboard_chat
    - hermes_agent_dashboard_tui_dist.stat.exists

- name: Record Hermes dashboard terminal UI managed state
  ansible.builtin.copy:
    content: >-
      {{ {
        'revision': hermes_agent_repo_version,
        'source_sha256': hermes_agent_dashboard_tui_source_fingerprint.stdout | trim,
        'entry_sha256': hermes_agent_dashboard_tui_dist.stat.checksum
      } | to_nice_yaml(indent=2) }}
    dest: "{{ hermes_agent_dashboard_tui_runtime_manifest_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode

- name: Refresh restricted Hermes dashboard terminal UI bundle state
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_tui_runtime_dir }}/dist/entry.js"
  register: hermes_agent_dashboard_tui_dist
  when: hermes_agent_manage_dashboard_chat

- name: Assert Hermes dashboard terminal UI bundle exists
  ansible.builtin.assert:
    that:
      - hermes_agent_dashboard_tui_dist.stat.exists
      - hermes_agent_dashboard_tui_dist.stat.isreg
      - hermes_agent_dashboard_tui_dist.stat.pw_name == 'root'
      - hermes_agent_dashboard_tui_dist.stat.gr_name == 'root'
      - hermes_agent_dashboard_tui_dist.stat.mode == '0644'
  when:
    - hermes_agent_manage_dashboard_chat
    - not ansible_check_mode

- name: Inspect disabled Hermes dashboard terminal UI runtime
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    checksum_algorithm: sha256
  loop:
    - "{{ hermes_agent_dashboard_tui_runtime_dir }}"
    - "{{ hermes_agent_dashboard_tui_runtime_revision_file }}"
    - "{{ hermes_agent_dashboard_tui_runtime_manifest_file }}"
    - "{{ hermes_agent_dashboard_tui_runtime_dir }}/dist/entry.js"
  register: hermes_agent_dashboard_tui_disabled_artifacts
  changed_when: false
  check_mode: false
  when: not hermes_agent_manage_dashboard_chat

- name: Read disabled Hermes dashboard terminal UI runtime revision
  ansible.builtin.slurp:
    src: "{{ hermes_agent_dashboard_tui_runtime_revision_file }}"
  register: hermes_agent_dashboard_tui_disabled_revision_contents
  changed_when: false
  when:
    - not hermes_agent_manage_dashboard_chat
    - hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.exists
    - hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.isreg
    - not hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.islnk

- name: Read disabled Hermes dashboard terminal UI managed state
  ansible.builtin.slurp:
    src: "{{ hermes_agent_dashboard_tui_runtime_manifest_file }}"
  register: hermes_agent_dashboard_tui_disabled_manifest_contents
  changed_when: false
  when:
    - not hermes_agent_manage_dashboard_chat
    - hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.exists
    - hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.isreg
    - not hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.islnk

- name: Calculate desired disabled Hermes dashboard terminal UI source fingerprint
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - >-
        find . -type f ! -path './node_modules/*' ! -path './dist/*' ! -name
        '.hermes-revision' ! -name '.hermes-managed-state.yml' -print0 |
        LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1
  args:
    chdir: "{{ hermes_agent_install_dir }}/ui-tui"
  register: hermes_agent_dashboard_tui_disabled_source_fingerprint
  changed_when: false
  failed_when: false
  when:
    - not hermes_agent_manage_dashboard_chat
    - hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.exists

- name: Calculate disabled Hermes dashboard terminal UI runtime source fingerprint
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - >-
        find . -type f ! -path './node_modules/*' ! -path './dist/*' ! -name
        '.hermes-revision' ! -name '.hermes-managed-state.yml' -print0 |
        LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1
  args:
    chdir: "{{ hermes_agent_dashboard_tui_runtime_dir }}"
  register: hermes_agent_dashboard_tui_disabled_runtime_source_fingerprint
  changed_when: false
  failed_when: false
  when:
    - not hermes_agent_manage_dashboard_chat
    - hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.exists
    - hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.isdir
    - not hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.islnk

- name: Require a recognized disabled Hermes dashboard terminal UI runtime
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.exists or
        (hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.isdir and
        not hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.islnk and
        hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.pw_name == 'root' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[0].stat.gr_name == 'root' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.exists and
        hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.isreg and
        not hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.islnk and
        hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.pw_name == 'root' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.gr_name == 'root' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[1].stat.mode == '0644' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.exists and
        hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.isreg and
        not hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.islnk and
        hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.pw_name == 'root' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.gr_name == 'root' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[2].stat.mode == '0644' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[3].stat.exists and
        hermes_agent_dashboard_tui_disabled_artifacts.results[3].stat.isreg and
        not hermes_agent_dashboard_tui_disabled_artifacts.results[3].stat.islnk and
        hermes_agent_dashboard_tui_disabled_artifacts.results[3].stat.pw_name == 'root' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[3].stat.gr_name == 'root' and
        hermes_agent_dashboard_tui_disabled_artifacts.results[3].stat.mode == '0644' and
        hermes_agent_dashboard_tui_disabled_source_fingerprint.rc == 0 and
        hermes_agent_dashboard_tui_disabled_runtime_source_fingerprint.rc == 0 and
        hermes_agent_dashboard_tui_disabled_source_fingerprint.stdout | trim ==
        hermes_agent_dashboard_tui_disabled_runtime_source_fingerprint.stdout | trim and
        ((hermes_agent_dashboard_tui_disabled_revision_contents | default({})).content |
        default('') | b64decode | trim) == hermes_agent_repo_version and
        ('revision: ' ~ hermes_agent_repo_version) in
        ((hermes_agent_dashboard_tui_disabled_manifest_contents | default({})).content |
        default('') | b64decode) and
        ('source_sha256: ' ~
        (hermes_agent_dashboard_tui_disabled_source_fingerprint.stdout | trim)) in
        ((hermes_agent_dashboard_tui_disabled_manifest_contents | default({})).content |
        default('') | b64decode) and
        ('entry_sha256: ' ~
        hermes_agent_dashboard_tui_disabled_artifacts.results[3].stat.checksum) in
        ((hermes_agent_dashboard_tui_disabled_manifest_contents | default({})).content |
        default('') | b64decode))
  when: not hermes_agent_manage_dashboard_chat

- name: Remove disabled Hermes dashboard terminal UI runtime
  ansible.builtin.file:
    path: "{{ hermes_agent_dashboard_tui_runtime_dir }}"
    state: absent
  when:
    - not hermes_agent_manage_dashboard_chat
    - not ansible_check_mode

- name: Configure Hermes Agent dashboard service
  ansible.builtin.template:
    src: hermes-agent-dashboard.service.j2
    dest: "/etc/systemd/system/{{ hermes_agent_dashboard_service_name }}"
    owner: root
    group: root
    mode: "0644"
  when: hermes_agent_manage_dashboard
  notify: Restart Hermes Agent dashboard

- name: Inspect disabled Hermes Agent dashboard unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ hermes_agent_dashboard_service_name }}"
  register: hermes_agent_dashboard_unit
  changed_when: false
  when: not hermes_agent_manage_dashboard

- name: Disable Hermes Agent dashboard
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_dashboard_service_name }}"
    enabled: false
    state: stopped
  when:
    - not hermes_agent_manage_dashboard
    - hermes_agent_dashboard_unit.stat.exists
    - not ansible_check_mode

- name: Remove disabled Hermes Agent dashboard unit
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ hermes_agent_dashboard_service_name }}"
    state: absent
  when: not hermes_agent_manage_dashboard
  notify: Reload systemd daemon

- name: Enable Hermes Agent dashboard
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_dashboard_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - hermes_agent_manage_dashboard
    - not ansible_check_mode or hermes_agent_dashboard_dist.stat.exists

- name: Inspect configured Hermes Agent backup directory
  ansible.builtin.stat:
    path: "{{ hermes_agent_backup_dir }}"
    follow: false
  register: hermes_agent_backup_directory_state
  changed_when: false
  check_mode: false
  when: hermes_agent_manage_backup

- name: Require a dedicated Hermes Agent backup directory
  ansible.builtin.assert:
    that:
      - hermes_agent_backup_dir is match('^/')
      - hermes_agent_backup_dir not in ['/', '/tmp', '/var', '/var/backups', '/usr', '/usr/local', '/etc', '/run', '/home', '/opt']
      - >-
        not hermes_agent_backup_directory_state.stat.exists or
        (hermes_agent_backup_directory_state.stat.isdir and
        not hermes_agent_backup_directory_state.stat.islnk and
        hermes_agent_backup_directory_state.stat.pw_name == hermes_agent_user and
        hermes_agent_backup_directory_state.stat.gr_name == hermes_agent_group and
        hermes_agent_backup_directory_state.stat.mode == '0700')
    fail_msg: >-
      hermes_agent_backup_dir must be a dedicated, non-symlinked directory owned
      by the Hermes runtime user; system paths and directories owned by another
      service are not safe backup targets.
  when: hermes_agent_manage_backup

- name: Configure Hermes Agent backups
  when:
    - hermes_agent_manage_backup
    - hermes_agent_runtime_user_available
  block:
    - name: Create private Hermes Agent backup directory
      ansible.builtin.file:
        path: "{{ hermes_agent_backup_dir }}"
        state: directory
        owner: "{{ hermes_agent_user }}"
        group: "{{ hermes_agent_group }}"
        mode: "0700"

    - name: Install Hermes Agent backup service
      ansible.builtin.template:
        src: hermes-agent-backup.service.j2
        dest: "/etc/systemd/system/{{ hermes_agent_backup_service_name }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install Hermes Agent backup timer
      ansible.builtin.template:
        src: hermes-agent-backup.timer.j2
        dest: "/etc/systemd/system/{{ hermes_agent_backup_timer_name }}"
        owner: root
        group: root
        mode: "0644"

    - name: Enable Hermes Agent backup timer
      ansible.builtin.systemd_service:
        name: "{{ hermes_agent_backup_timer_name }}"
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

- name: Inspect disabled Hermes Agent backup units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}"
  loop:
    - "{{ hermes_agent_backup_service_name }}"
    - "{{ hermes_agent_backup_timer_name }}"
  register: hermes_agent_backup_units
  changed_when: false
  when: not hermes_agent_manage_backup

- name: Disable Hermes Agent backup units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ hermes_agent_backup_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not hermes_agent_manage_backup
    - item.stat.exists
    - not ansible_check_mode

- name: Remove disabled Hermes Agent backup units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - "{{ hermes_agent_backup_service_name }}"
    - "{{ hermes_agent_backup_timer_name }}"
  when: not hermes_agent_manage_backup
  notify: Reload systemd daemon
