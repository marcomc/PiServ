---
- name: Assert local-model storage configuration
  ansible.builtin.assert:
    that:
      - hermes_agent_local_models_dir is match('^/')
      - hermes_agent_local_models_dir not in ['/', '/tmp', '/var', '/var/lib', '/usr', '/usr/local', '/etc', '/run', '/home', '/opt']
      - hermes_agent_local_models_results_dir is match('^/')
      - hermes_agent_local_models_results_dir.startswith(hermes_agent_local_models_dir ~ '/')
      - hermes_agent_local_models_context_size >= 64000
      - hermes_agent_local_models_threads >= 1
      - hermes_agent_local_models_threads <= 64
      - hermes_agent_local_models_benchmark_max_tokens >= 1
      - hermes_agent_local_models_benchmark_max_tokens <= 4096
      - hermes_agent_local_models_benchmark_request_timeout >= 1
      - hermes_agent_local_models_benchmark_request_timeout <= 600
      - hermes_agent_local_models_min_free_bytes >= 1073741824
      - hermes_agent_local_models_host == '127.0.0.1'
      - >-
        hermes_agent_local_models | map(attribute='id') | unique | length ==
        hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='port') | unique | length ==
        hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='filename') | unique | length ==
        hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='id') |
        select('match', '^[a-z0-9]+(?:-[a-z0-9]+)*$') | list | length ==
        hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='filename') |
        select('match', '^[A-Za-z0-9][A-Za-z0-9._-]*\.gguf$') | list | length ==
        hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='repository') |
        select('match', '^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$') | list | length ==
        hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='revision') |
        select('match', '^[0-9a-f]{40}$') | list | length ==
        hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='sha256') |
        select('match', '^[0-9a-f]{64}$') | list | length ==
        hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='size_bytes') |
        select('gt', 0) | list | length == hermes_agent_local_models | length
      - >-
        hermes_agent_local_models | map(attribute='port') |
        select('ge', 1) | select('le', 65535) | list | length ==
        hermes_agent_local_models | length
      - hermes_agent_local_models_address_space_limit is match('^[1-9][0-9]*[KMGTP]$')
      - hermes_agent_local_models_memory_high is match('^[1-9][0-9]*[KMGTP]$')
      - hermes_agent_local_models_memory_max is match('^[1-9][0-9]*[KMGTP]$')
      - hermes_agent_local_models_memory_swap_max is match('^[0-9][0-9]*[KMGTP]$')
      - hermes_agent_local_models_memory_high | human_to_bytes > 0
      - >-
        hermes_agent_local_models_memory_max | human_to_bytes >
        hermes_agent_local_models_memory_high | human_to_bytes
      - >-
        hermes_agent_local_models_address_space_limit | human_to_bytes >
        hermes_agent_local_models_memory_max | human_to_bytes
      - hermes_agent_local_models_memory_swap_max | human_to_bytes >= 0
    fail_msg: >-
      Local-model settings must use bounded values, keep MemoryHigh below
      MemoryMax, and keep LimitAS above MemoryMax.
  when: hermes_agent_manage_local_models

- name: Resolve configured local-model directory identities
  ansible.builtin.command:
    argv:
      - /usr/bin/realpath
      - --canonicalize-missing
      - "{{ item }}"
  loop:
    - "{{ hermes_agent_local_models_dir }}"
    - "{{ hermes_agent_local_models_results_dir }}"
  register: hermes_agent_local_model_directory_identities
  changed_when: false
  check_mode: false

- name: Require canonical dedicated local-model directory identities
  ansible.builtin.assert:
    that:
      - >-
        hermes_agent_local_model_directory_identities.results[0].stdout ==
        hermes_agent_local_models_dir
      - >-
        hermes_agent_local_model_directory_identities.results[1].stdout ==
        hermes_agent_local_models_results_dir
      - >-
        hermes_agent_local_model_directory_identities.results[1].stdout.startswith(
        hermes_agent_local_model_directory_identities.results[0].stdout ~ '/')
    fail_msg: >-
      Local-model and results directories must use canonical paths, without
      parent traversal or symlink-parent aliases, and results must remain below
      the canonical models directory.

- name: Resolve local-model benchmark helper path through existing parents
  ansible.builtin.command:
    argv:
      - /usr/bin/realpath
      - --canonicalize-missing
      - "{{ hermes_agent_local_model_benchmark_helper_path }}"
  register: hermes_agent_local_model_benchmark_helper_identity
  changed_when: false
  check_mode: false

- name: Require a dedicated local-model benchmark helper path
  ansible.builtin.assert:
    that:
      - hermes_agent_local_model_benchmark_helper_identity.stdout ==
        hermes_agent_local_model_benchmark_helper_path
      - >-
        hermes_agent_local_model_benchmark_helper_identity.stdout
        is not match('^/(tmp|var/tmp)(/|$)')
    fail_msg: >-
      The local-model benchmark helper must use a canonical path outside shared
      temporary directories.

- name: Inspect local-model benchmark helper parent
  ansible.builtin.stat:
    path: "{{ hermes_agent_local_model_benchmark_helper_path | dirname }}"
    follow: false
  register: hermes_agent_local_model_benchmark_helper_parent
  changed_when: false
  check_mode: false

- name: Require a safe local-model benchmark helper parent
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_local_model_benchmark_helper_parent.stat.exists or
        (hermes_agent_local_model_benchmark_helper_parent.stat.isdir and
        not hermes_agent_local_model_benchmark_helper_parent.stat.islnk and
        hermes_agent_local_model_benchmark_helper_parent.stat.pw_name == 'root' and
        hermes_agent_local_model_benchmark_helper_parent.stat.gr_name == 'root' and
        hermes_agent_local_model_benchmark_helper_parent.stat.mode
        is match('^0?[0-7][0-5][0-5]$'))
    fail_msg: >-
      An existing local-model benchmark helper parent must be a root-owned
      directory that is not writable by its group or other users.

- name: Inspect configured local-model directories
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ hermes_agent_local_models_dir }}"
    - "{{ hermes_agent_local_models_results_dir }}"
  register: hermes_agent_local_model_directory_state
  changed_when: false
  check_mode: false

- name: Require role-owned local-model directories when they already exist
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        (item.stat.isdir and not item.stat.islnk and
        item.stat.pw_name == 'root' and
        item.stat.gr_name == hermes_agent_group and
        item.stat.mode == '0750')
    fail_msg: >-
      {{ item.item }} already exists but is not the dedicated root-owned,
      {{ hermes_agent_group }}-readable local-model directory managed by this role.
  loop: "{{ hermes_agent_local_model_directory_state.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect existing local benchmark models
  ansible.builtin.stat:
    path: "{{ hermes_agent_local_models_dir }}/{{ item.filename }}"
    checksum_algorithm: sha256
  register: hermes_agent_local_model_files
  loop: "{{ hermes_agent_local_models }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false
  check_mode: false

- name: Inspect resumable local benchmark model parts before download
  ansible.builtin.stat:
    path: "{{ hermes_agent_local_models_dir }}/{{ item.filename }}.partial"
  register: hermes_agent_local_model_initial_parts
  loop: "{{ hermes_agent_local_models }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: false
  check_mode: false

- name: Require existing local benchmark models to match their pinned checksums
  ansible.builtin.assert:
    that:
      - >-
        not item.stat.exists or
        item.stat.checksum == model.sha256
    fail_msg: >-
      {{ hermes_agent_local_models_dir }}/{{ model.filename }} exists but does
      not match its configured SHA-256.
      Remove or replace it explicitly before this role can proceed.
  loop: "{{ hermes_agent_local_model_files.results }}"
  loop_control:
    label: "{{ item.item.id }}"
    loop_var: item
  vars:
    model: "{{ item.item }}"

- name: Initialize required local-model download capacity
  ansible.builtin.set_fact:
    hermes_agent_local_models_required_download_bytes: 0

- name: Calculate required local-model download capacity
  ansible.builtin.set_fact:
    hermes_agent_local_models_required_download_bytes: >-
      {{
        hermes_agent_local_models_required_download_bytes | int +
        (
          0 if hermes_agent_local_model_files.results[item].stat.exists else
          [
            (hermes_agent_local_models[item].size_bytes | int) -
            (hermes_agent_local_model_initial_parts.results[item].stat.size | default(0) | int),
            0
          ] | max
        )
      }}
  loop: "{{ range(0, hermes_agent_local_models | length) | list }}"
  loop_control:
    label: "{{ hermes_agent_local_models[item].id }}"

- name: Resolve local-model capacity probe to nearest existing ancestor
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -eu
      - -c
      - |
        probe=$HERMES_AGENT_LOCAL_MODELS_DIR
        while [ ! -e "$probe" ]; do
          parent=${probe%/*}
          if [ -z "$parent" ]; then
            parent=/
          fi
          if [ "$parent" = "$probe" ]; then
            break
          fi
          probe=$parent
        done
        /usr/bin/realpath --canonicalize-existing "$probe"
  environment:
    HERMES_AGENT_LOCAL_MODELS_DIR: "{{ hermes_agent_local_models_dir }}"
  register: hermes_agent_local_models_capacity_probe
  changed_when: false
  check_mode: false

- name: Record local-model capacity probe path
  ansible.builtin.set_fact:
    hermes_agent_local_models_capacity_probe_path: >-
      {{ hermes_agent_local_models_capacity_probe.stdout | trim }}

- name: Inspect local-model capacity probe path
  ansible.builtin.stat:
    path: "{{ hermes_agent_local_models_capacity_probe_path }}"
    follow: false
  register: hermes_agent_local_models_capacity_probe_state
  changed_when: false
  check_mode: false

- name: Read local-model capacity mount options
  ansible.builtin.command:
    argv:
      - /usr/bin/findmnt
      - --noheadings
      - --output
      - OPTIONS
      - --target
      - "{{ hermes_agent_local_models_capacity_probe_path }}"
  register: hermes_agent_local_models_capacity_mount
  changed_when: false
  check_mode: false

- name: Require writable local-model capacity storage
  ansible.builtin.assert:
    that:
      - hermes_agent_local_models_capacity_probe_state.stat.isdir
      - >-
        'ro' not in
        (hermes_agent_local_models_capacity_mount.stdout | trim).split(',')
    fail_msg: >-
      The local-model directory or its nearest existing ancestor must be a
      writable directory before this role can mutate host state.

- name: Read available local-model storage capacity
  ansible.builtin.command:
    argv:
      - /usr/bin/df
      - --block-size=1
      - --output=avail
      - "{{ hermes_agent_local_models_capacity_probe_path }}"
  register: hermes_agent_local_models_capacity
  changed_when: false
  check_mode: false
  when: hermes_agent_manage_local_models

- name: Record available local-model storage capacity
  ansible.builtin.set_fact:
    hermes_agent_local_models_available_bytes: >-
      {{ hermes_agent_local_models_capacity.stdout_lines[-1] | trim | int }}
  when: hermes_agent_manage_local_models

- name: Assert local-model storage capacity
  ansible.builtin.assert:
    that:
      - >-
        hermes_agent_local_models_available_bytes >=
        (hermes_agent_local_models_required_download_bytes | int +
        hermes_agent_local_models_min_free_bytes)
    fail_msg: >-
      Local-model storage needs the remaining model download bytes plus the
      configured free-space reserve before this deployment can proceed.
  when: hermes_agent_manage_local_models
