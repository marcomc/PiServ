---
- name: Assert supported Hermes Agent target platform
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "Debian"
      - ansible_facts["architecture"] in hermes_agent_supported_architectures
      - hermes_agent_dashboard_host in ["127.0.0.1", "0.0.0.0"]
      - hermes_agent_dashboard_tui_runtime_dir is match('^/')
      - >-
        hermes_agent_dashboard_host == "127.0.0.1" or
        hermes_agent_dashboard_manage_basic_auth | bool
      - >-
        not hermes_agent_dashboard_manage_basic_auth or
        hermes_agent_dashboard_basic_auth_username is match('^[A-Za-z0-9_-]+$')
      - >-
        not hermes_agent_dashboard_manage_basic_auth or
        hermes_agent_dashboard_basic_auth_state_file is match('^/')
      - >-
        not hermes_agent_dashboard_manage_basic_auth or
        hermes_agent_dashboard_basic_auth_bootstrap_password_file is match('^/')
      - >-
        not hermes_agent_dashboard_manage_basic_auth or
        hermes_agent_dashboard_basic_auth_state_file !=
        hermes_agent_dashboard_basic_auth_bootstrap_password_file
      - >-
        not hermes_agent_dashboard_manage_basic_auth or
        hermes_agent_dashboard_basic_auth_session_ttl_seconds >= 60
      - hermes_agent_provider == "openai-codex"
      - hermes_agent_enabled_toolsets | difference(["memory", "skills"]) | length == 0
      - "'terminal' in hermes_agent_disabled_toolsets"
      - "'file' in hermes_agent_disabled_toolsets"
      - "'browser' in hermes_agent_disabled_toolsets"
      - "'code_execution' in hermes_agent_disabled_toolsets"
      - "'homeassistant' in hermes_agent_disabled_toolsets"
      - not hermes_agent_manage_backup or hermes_agent_backup_group | length > 0
      - >-
        not hermes_agent_manage_home_assistant_mcp or
        hermes_agent_home_assistant_mcp_name is match('^[a-z][a-z0-9-]*$')
      - >-
        not hermes_agent_manage_home_assistant_mcp or
        hermes_agent_home_assistant_mcp_url is match('^https?://[^/@]+/api/mcp$')
      - >-
        not hermes_agent_manage_home_assistant_mcp or
        hermes_agent_home_assistant_mcp_token_env_file is match('^/')
      - >-
        not hermes_agent_manage_home_assistant_mcp or
        hermes_agent_home_assistant_mcp_token_env_var is match('^[A-Z][A-Z0-9_]*$')
      - >-
        not hermes_agent_manage_home_assistant_mcp or
        hermes_agent_home_assistant_mcp_timeout > 0
      - >-
        not hermes_agent_manage_home_assistant_mcp or
        hermes_agent_home_assistant_mcp_connect_timeout > 0
      - >-
        not hermes_agent_manage_home_assistant_mcp or
        hermes_agent_home_assistant_mcp_connect_timeout <=
        hermes_agent_home_assistant_mcp_timeout
    fail_msg: >-
      This role currently supports Debian architectures declared in
      hermes_agent_supported_architectures, a loopback dashboard or an
      authenticated wildcard dashboard,
      the openai-codex provider, memory/skills-only access, an explicit backup
      group when backups are enabled, and a valid Assist MCP endpoint with a
      private token file when Home Assistant access is enabled.
