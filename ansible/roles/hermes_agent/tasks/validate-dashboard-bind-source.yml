---
- name: Inspect Hermes dashboard bind source
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_bind.source }}"
    follow: false
  register: hermes_agent_dashboard_bind_source

- name: Resolve canonical Hermes dashboard bind source
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_dashboard_bind_realpath_command | default('/usr/bin/realpath') }}"
      - "{{ hermes_agent_dashboard_bind.source }}"
  check_mode: false
  changed_when: false
  register: hermes_agent_dashboard_bind_source_realpath
  failed_when: false

- name: Inspect Hermes dashboard bind-source ancestors
  ansible.builtin.stat:
    path: >-
      {{
        '/' if item == 0 else
        '/' ~
        ((hermes_agent_dashboard_bind.source | dirname).split('/')[1:item + 1] |
        join('/'))
      }}
    follow: false
  loop: >-
    {{
      range(
        0,
        (hermes_agent_dashboard_bind.source | dirname).split('/') | length
      ) | list
    }}
  register: hermes_agent_dashboard_bind_source_ancestor_stats

- name: Assert Hermes dashboard bind source is authenticated
  ansible.builtin.assert:
    that:
      - hermes_agent_dashboard_bind_source.stat.exists
      - hermes_agent_dashboard_bind_source.stat.isreg
      - not hermes_agent_dashboard_bind_source.stat.islnk
      - hermes_agent_dashboard_bind_source.stat.uid == 0
      - hermes_agent_dashboard_bind_source.stat.mode is match('^[0-7][0-7][0145][0145]$')
      - hermes_agent_dashboard_bind_source_realpath.rc == 0
      - >-
        hermes_agent_dashboard_bind_source_realpath.stdout ==
        hermes_agent_dashboard_bind.source
      - >-
        hermes_agent_dashboard_bind_source_ancestor_stats.results |
        selectattr('stat.exists', 'equalto', true) | list | length ==
        hermes_agent_dashboard_bind_source_ancestor_stats.results | length
      - >-
        hermes_agent_dashboard_bind_source_ancestor_stats.results |
        selectattr('stat.isdir', 'equalto', true) | list | length ==
        hermes_agent_dashboard_bind_source_ancestor_stats.results | length
      - >-
        hermes_agent_dashboard_bind_source_ancestor_stats.results |
        selectattr('stat.islnk', 'equalto', false) | list | length ==
        hermes_agent_dashboard_bind_source_ancestor_stats.results | length
      - >-
        hermes_agent_dashboard_bind_source_ancestor_stats.results |
        selectattr('stat.uid', 'equalto', 0) | list | length ==
        hermes_agent_dashboard_bind_source_ancestor_stats.results | length
      - >-
        hermes_agent_dashboard_bind_source_ancestor_stats.results |
        map(attribute='stat.mode') |
        select('match', '^[0-7][0-7][0145][0145]$') | list | length ==
        hermes_agent_dashboard_bind_source_ancestor_stats.results | length
    fail_msg: >-
      Hermes dashboard bind source {{ hermes_agent_dashboard_bind.source }} must
      be an existing canonical root-owned regular file, not group/world writable,
      beneath canonical root-owned directories that are not group/world writable.
  when: >-
    not (
      ansible_check_mode and
      hermes_agent_dashboard_bind.source_managed_in_run | default(false) and
      not hermes_agent_dashboard_bind_source.stat.exists
    )
