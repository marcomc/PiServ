---
- name: Read prepared Hermes dashboard credential rotation intent
  ansible.builtin.slurp:
    src: "{{ hermes_agent_dashboard_basic_auth_rotation_intent_file }}"
  register: hermes_agent_dashboard_rotation_intent_contents
  changed_when: false
  no_log: true

- name: Mark Hermes dashboard credential rotation active
  ansible.builtin.copy:
    content: >-
      {{ ((hermes_agent_dashboard_rotation_intent_contents.content | b64decode | from_yaml) |
      combine({'phase': 'activated'}, recursive=False)) | to_nice_yaml(indent=2) }}
    dest: "{{ hermes_agent_dashboard_basic_auth_rotation_intent_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
