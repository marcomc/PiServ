---
- name: Create Codex download cache
  ansible.builtin.file:
    path: "{{ hermes_agent_download_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record Hermes Agent download cache ownership
  ansible.builtin.copy:
    content: "managed_by: marcomc.hermes_agent\n"
    dest: "{{ hermes_agent_download_cache_dir }}/.hermes-agent-managed.yml"
    owner: root
    group: root
    mode: "0600"
  when:
    - >-
      not ansible_check_mode or
      hermes_agent_download_cache_state.stat.exists

- name: Download checksum-pinned Codex CLI archive
  ansible.builtin.get_url:
    url: "{{ hermes_agent_codex_archive_url }}"
    dest: >-
      {{ hermes_agent_download_cache_dir }}/codex-{{
      hermes_agent_codex_version }}-aarch64-linux.tar.gz
    checksum: "{{ hermes_agent_codex_archive_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Record Codex installation parent publication intent
  ansible.builtin.copy:
    content: >-
      {{
        {
          'managed_by': 'marcomc.hermes_agent',
          'path': hermes_agent_codex_install_dir | dirname,
          'staging_path': hermes_agent_codex_install_parent_staging_path,
          'version': 1
        } | to_nice_yaml(indent=2)
      }}
    dest: "{{ hermes_agent_codex_install_parent_intent_path }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_install_parent.stat.exists
    - not hermes_agent_codex_install_parent_publication_state.results[1].stat.exists

- name: Remove interrupted Codex installation parent staging directory
  ansible.builtin.file:
    path: "{{ hermes_agent_codex_install_parent_staging_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - hermes_agent_codex_install_parent_publication_state.results[0].stat.exists

- name: Create private Codex installation parent staging directory
  ansible.builtin.file:
    path: "{{ hermes_agent_codex_install_parent_staging_path }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_install_parent.stat.exists

- name: Record Codex installation parent ownership
  ansible.builtin.copy:
    content: >-
      {{
        {
          'managed_by': 'marcomc.hermes_agent',
          'path': hermes_agent_codex_install_dir | dirname,
          'version': 1
        } | to_nice_yaml(indent=2)
      }}
    dest: >-
      {{ hermes_agent_codex_install_parent_staging_path
      }}/.hermes-agent-managed.yml
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_install_parent.stat.exists

- name: Set published Codex installation parent metadata in staging
  ansible.builtin.file:
    path: "{{ hermes_agent_codex_install_parent_staging_path }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_install_parent.stat.exists

- name: Publish Codex installation parent atomically
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - -T
      - "{{ hermes_agent_codex_install_parent_staging_path }}"
      - "{{ hermes_agent_codex_install_dir | dirname }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_install_parent.stat.exists

- name: Remove completed Codex installation parent publication intent
  ansible.builtin.file:
    path: "{{ hermes_agent_codex_install_parent_intent_path }}"
    state: absent
  when:
    - not ansible_check_mode
    - >-
      not hermes_agent_codex_install_parent.stat.exists or
      hermes_agent_codex_install_parent_publication_state.results[1].stat.exists

- name: Create temporary Codex installation directory
  ansible.builtin.tempfile:
    path: "{{ hermes_agent_codex_install_dir | dirname }}"
    prefix: ".hermes-codex-"
    state: directory
  register: hermes_agent_codex_staging_directory
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Set temporary Codex installation directory ownership
  ansible.builtin.file:
    path: "{{ hermes_agent_codex_staging_directory.path }}"
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Extract Codex CLI archive into temporary directory
  ansible.builtin.unarchive:
    src: >-
      {{ hermes_agent_download_cache_dir }}/codex-{{
      hermes_agent_codex_version }}-aarch64-linux.tar.gz
    dest: "{{ hermes_agent_codex_staging_directory.path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Install normalized Codex binary name in temporary directory
  ansible.builtin.copy:
    src: >-
      {{ hermes_agent_codex_staging_directory.path
      }}/{{ hermes_agent_codex_archive_binary_name }}
    dest: "{{ hermes_agent_codex_staging_directory.path }}/codex"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Inspect staged normalized Codex binary
  ansible.builtin.stat:
    path: "{{ hermes_agent_codex_staging_directory.path }}/codex"
    follow: false
    checksum_algorithm: sha256
  register: hermes_agent_codex_staged_binary
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Record staged Codex installation provenance
  ansible.builtin.copy:
    content: >-
      {{
        {
          'archive_sha256': hermes_agent_codex_archive_checksum |
          regex_replace('^sha256:', '') | lower,
          'binary_sha256': hermes_agent_codex_staged_binary.stat.checksum,
          'managed_by': 'marcomc.hermes_agent',
          'version': hermes_agent_codex_version
        } | to_nice_yaml(indent=2)
      }}
    dest: >-
      {{ hermes_agent_codex_staging_directory.path
      }}/.hermes-agent-managed.yml
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Remove extracted Codex source filename from temporary directory
  ansible.builtin.file:
    path: >-
      {{ hermes_agent_codex_staging_directory.path
      }}/{{ hermes_agent_codex_archive_binary_name }}
    state: absent
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Publish Codex installation directory atomically
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - -T
      - "{{ hermes_agent_codex_staging_directory.path }}"
      - "{{ hermes_agent_codex_install_dir }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Inspect versioned Codex binary
  ansible.builtin.stat:
    path: "{{ hermes_agent_codex_install_dir }}/codex"
  register: hermes_agent_codex_binary

- name: Ensure Codex CLI is executable by the Hermes runtime account
  ansible.builtin.file:
    path: "{{ hermes_agent_codex_install_dir }}/codex"
    owner: root
    group: root
    mode: "0755"
  when: hermes_agent_codex_binary.stat.exists

- name: Link active Codex CLI
  ansible.builtin.file:
    src: "{{ hermes_agent_codex_install_dir }}/codex"
    dest: "{{ hermes_agent_codex_binary_path }}"
    state: link
    owner: root
    group: root
    force: true
  when:
    - not ansible_check_mode or hermes_agent_codex_binary.stat.exists

- name: Record active Codex CLI link ownership
  ansible.builtin.copy:
    content: >-
      {{
        {
          'link_path': hermes_agent_codex_binary_path,
          'managed_by': 'marcomc.hermes_agent',
          'target': hermes_agent_codex_install_dir ~ '/codex',
          'version': 1
        } | to_nice_yaml(indent=2)
      }}
    dest: "{{ hermes_agent_codex_link_managed_state_file }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode or hermes_agent_codex_binary.stat.exists

- name: Refresh versioned Codex binary state
  ansible.builtin.stat:
    path: "{{ hermes_agent_codex_install_dir }}/codex"
  register: hermes_agent_codex_binary
