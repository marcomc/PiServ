---
- name: Create Codex download cache
  ansible.builtin.file:
    path: "{{ hermes_agent_download_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record Hermes Agent download cache ownership
  ansible.builtin.copy:
    content: "managed_by: marcomc.hermes_agent\n"
    dest: "{{ hermes_agent_download_cache_dir }}/.hermes-agent-managed.yml"
    owner: root
    group: root
    mode: "0600"
  when:
    - >-
      not ansible_check_mode or
      hermes_agent_download_cache_state.stat.exists

- name: Download checksum-pinned Codex CLI archive
  ansible.builtin.get_url:
    url: "{{ hermes_agent_codex_archive_url }}"
    dest: >-
      {{ hermes_agent_download_cache_dir }}/codex-{{
      hermes_agent_codex_version }}-aarch64-linux.tar.gz
    checksum: "{{ hermes_agent_codex_archive_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Create versioned Codex installation directory
  ansible.builtin.stat:
    path: "{{ hermes_agent_codex_install_dir }}"
    follow: false
  register: hermes_agent_codex_install_directory
  changed_when: false
  check_mode: false

- name: Refuse a pre-existing unrecognized Codex installation directory
  ansible.builtin.stat:
    path: "{{ hermes_agent_codex_install_dir }}/codex"
    follow: false
  register: hermes_agent_codex_binary
  changed_when: false
  check_mode: false

- name: Require a safe pre-existing Codex installation directory
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_codex_install_directory.stat.exists or
        (hermes_agent_codex_install_directory.stat.isdir and
         not hermes_agent_codex_install_directory.stat.islnk and
         hermes_agent_codex_install_directory.stat.pw_name == 'root' and
         hermes_agent_codex_install_directory.stat.gr_name == 'root' and
         hermes_agent_codex_install_directory.stat.mode == '0755' and
         hermes_agent_codex_binary.stat.exists and
         hermes_agent_codex_binary.stat.isreg and
         not hermes_agent_codex_binary.stat.islnk and
         hermes_agent_codex_binary.stat.pw_name == 'root' and
         hermes_agent_codex_binary.stat.gr_name == 'root' and
         hermes_agent_codex_binary.stat.mode is match('^0?[0-7][0-7][1357]$'))
    fail_msg: >-
      Refusing to extract into an existing Codex installation directory that is
      not a safe, complete role-managed runtime.

- name: Create versioned Codex installation directory
  ansible.builtin.file:
    path: "{{ hermes_agent_codex_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inspect versioned Codex binary
  ansible.builtin.stat:
    path: "{{ hermes_agent_codex_install_dir }}/codex"
  register: hermes_agent_codex_binary

- name: Extract Codex CLI archive
  ansible.builtin.unarchive:
    src: >-
      {{ hermes_agent_download_cache_dir }}/codex-{{
      hermes_agent_codex_version }}-aarch64-linux.tar.gz
    dest: "{{ hermes_agent_codex_install_dir }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Install normalized Codex binary name
  ansible.builtin.copy:
    src: >-
      {{ hermes_agent_codex_install_dir
      }}/{{ hermes_agent_codex_archive_binary_name }}
    dest: "{{ hermes_agent_codex_install_dir }}/codex"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not hermes_agent_codex_binary.stat.exists

- name: Remove extracted Codex source filename
  ansible.builtin.file:
    path: >-
      {{ hermes_agent_codex_install_dir
      }}/{{ hermes_agent_codex_archive_binary_name }}
    state: absent

- name: Ensure Codex CLI is executable by the Hermes runtime account
  ansible.builtin.file:
    path: "{{ hermes_agent_codex_install_dir }}/codex"
    owner: root
    group: root
    mode: "0755"
  when: hermes_agent_codex_binary.stat.exists

- name: Link active Codex CLI
  ansible.builtin.file:
    src: "{{ hermes_agent_codex_install_dir }}/codex"
    dest: "{{ hermes_agent_codex_binary_path }}"
    state: link
    owner: root
    group: root
    force: true
  when:
    - not ansible_check_mode or hermes_agent_codex_binary.stat.exists

- name: Record active Codex CLI link ownership
  ansible.builtin.copy:
    content: >-
      {{
        {
          'link_path': hermes_agent_codex_binary_path,
          'managed_by': 'marcomc.hermes_agent',
          'target': hermes_agent_codex_install_dir ~ '/codex',
          'version': 1
        } | to_nice_yaml(indent=2)
      }}
    dest: "{{ hermes_agent_codex_link_managed_state_file }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - not ansible_check_mode or hermes_agent_codex_binary.stat.exists

- name: Refresh versioned Codex binary state
  ansible.builtin.stat:
    path: "{{ hermes_agent_codex_install_dir }}/codex"
  register: hermes_agent_codex_binary
