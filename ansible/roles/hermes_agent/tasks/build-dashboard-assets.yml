---
- name: Build dashboard assets with failure-safe ownership restoration
  block:
    - name: Hand dashboard build workspace to the runtime identity
      ansible.builtin.file:
        path: "{{ hermes_agent_install_dir }}/hermes_cli"
        owner: "{{ hermes_agent_user }}"
        group: "{{ hermes_agent_group }}"
        recurse: true
        follow: false

    - name: Build pinned Hermes dashboard assets
      ansible.builtin.command:
        argv: [npm, run, build, -w, web]
        chdir: "{{ hermes_agent_install_dir }}"
      environment:
        HOME: "{{ hermes_agent_home }}"
        HERMES_HOME: "{{ hermes_agent_home }}"
        PATH: "{{ hermes_agent_home }}/node/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      become: true
      become_user: "{{ hermes_agent_user }}"
      changed_when: true
  always:
    - name: Return dashboard build workspace to root ownership
      ansible.builtin.file:
        path: "{{ hermes_agent_install_dir }}/hermes_cli"
        owner: root
        group: root
        recurse: true
        follow: false
