---
- name: Inspect complete Hermes dashboard credential ancestor chain
  ansible.builtin.stat:
    path: >-
      {{
        '/' if item == 0 else
        '/' ~ ((hermes_agent_dashboard_credential_path | dirname).split('/')[1:item + 1] |
        join('/'))
      }}
    follow: false
  loop: >-
    {{
      range(
        0,
        (hermes_agent_dashboard_credential_path | dirname).split('/') | length
      ) | list
    }}
  register: hermes_agent_dashboard_credential_ancestor_preflight
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Authenticate every existing Hermes dashboard credential ancestor
  ansible.builtin.assert:
    that:
      - not item.failed
      - not item.stat.exists | default(false) or item.stat.isdir | default(false)
      - not item.stat.exists | default(false) or not item.stat.islnk | default(true)
      - not item.stat.exists | default(false) or item.stat.uid | default(-1) == 0
      - not item.stat.exists | default(false) or item.stat.gid | default(-1) == 0
      - >-
        not item.stat.exists | default(false) or
        item.stat.mode | default('') is match('^[0-7][0-7][0145][0145]$')
    fail_msg: >-
      Every existing ancestor of a Hermes dashboard credential must be a
      root-owned directory that is not a symlink or writable by group or other
      users.
  loop: "{{ hermes_agent_dashboard_credential_ancestor_preflight.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Create missing private Hermes dashboard credential parent
  ansible.builtin.file:
    path: "{{ hermes_agent_dashboard_credential_path | dirname }}"
    state: directory
    owner: 0
    group: 0
    mode: "0700"
  when:
    - >-
      not hermes_agent_dashboard_credential_ancestor_preflight.results[-1].stat.exists
    - not ansible_check_mode
  no_log: true

- name: Reinspect complete Hermes dashboard credential ancestor chain
  ansible.builtin.stat:
    path: >-
      {{
        '/' if item == 0 else
        '/' ~ ((hermes_agent_dashboard_credential_path | dirname).split('/')[1:item + 1] |
        join('/'))
      }}
    follow: false
  loop: >-
    {{
      range(
        0,
        (hermes_agent_dashboard_credential_path | dirname).split('/') | length
      ) | list
    }}
  register: hermes_agent_dashboard_credential_ancestor_recheck
  changed_when: false
  check_mode: false
  no_log: true

- name: Reauthenticate Hermes dashboard credential ancestors before consumption
  ansible.builtin.assert:
    that:
      - >-
        (ansible_check_mode and
        not hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.exists) or
        (hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.exists and
        hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.isdir and
        not hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.islnk and
        hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.uid == 0 and
        hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.gid == 0 and
        hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.mode is
        match('^[0-7][0-7][0145][0145]$'))
      - >-
        not hermes_agent_dashboard_credential_ancestor_preflight.results[item].stat.exists or
        (hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.exists and
        hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.dev ==
        hermes_agent_dashboard_credential_ancestor_preflight.results[item].stat.dev and
        hermes_agent_dashboard_credential_ancestor_recheck.results[item].stat.inode ==
        hermes_agent_dashboard_credential_ancestor_preflight.results[item].stat.inode)
    fail_msg: >-
      A Hermes dashboard credential ancestor changed after authentication or
      is not a safe root-controlled directory.
  loop: >-
    {{ range(0, hermes_agent_dashboard_credential_ancestor_preflight.results | length) | list }}
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Reinspect Hermes dashboard credential before consumption
  ansible.builtin.stat:
    path: "{{ hermes_agent_dashboard_credential_path }}"
    follow: false
  register: hermes_agent_dashboard_credential_recheck
  changed_when: false
  check_mode: false
  no_log: true
  when: hermes_agent_dashboard_credential_expected_stat is defined

- name: Require unchanged Hermes dashboard credential before consumption
  ansible.builtin.assert:
    that:
      - hermes_agent_dashboard_credential_recheck.stat.exists
      - not hermes_agent_dashboard_credential_recheck.stat.islnk
      - hermes_agent_dashboard_credential_recheck.stat.isreg
      - >-
        hermes_agent_dashboard_credential_recheck.stat.dev ==
        hermes_agent_dashboard_credential_expected_stat.dev
      - >-
        hermes_agent_dashboard_credential_recheck.stat.inode ==
        hermes_agent_dashboard_credential_expected_stat.inode
      - >-
        hermes_agent_dashboard_credential_recheck.stat.uid ==
        hermes_agent_dashboard_credential_expected_stat.uid
      - >-
        hermes_agent_dashboard_credential_recheck.stat.gid ==
        hermes_agent_dashboard_credential_expected_stat.gid
      - >-
        hermes_agent_dashboard_credential_recheck.stat.mode ==
        hermes_agent_dashboard_credential_expected_stat.mode
    fail_msg: >-
      The Hermes dashboard credential changed after authentication and will not
      be consumed.
  no_log: true
  when: hermes_agent_dashboard_credential_expected_stat is defined
