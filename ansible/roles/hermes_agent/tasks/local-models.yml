---
- name: Install local-model benchmark packages
  ansible.builtin.apt:
    name: "{{ hermes_agent_local_model_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create llama.cpp download cache
  ansible.builtin.file:
    path: "{{ hermes_agent_download_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download checksum-pinned llama.cpp ARM64 archive
  ansible.builtin.get_url:
    url: "{{ hermes_agent_local_model_runtime_archive_url }}"
    dest: >-
      {{ hermes_agent_download_cache_dir }}/llama-{{
      hermes_agent_local_model_runtime_version }}-ubuntu-arm64.tar.gz
    checksum: "{{ hermes_agent_local_model_runtime_archive_checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: not ansible_check_mode

- name: Create versioned llama.cpp installation directory
  ansible.builtin.file:
    path: "{{ hermes_agent_local_model_runtime_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inspect versioned llama-server binary
  ansible.builtin.stat:
    path: "{{ hermes_agent_local_model_runtime_dir }}/llama-server"
  register: hermes_agent_llama_server_binary

- name: Extract llama.cpp ARM64 archive
  ansible.builtin.unarchive:
    src: >-
      {{ hermes_agent_download_cache_dir }}/llama-{{
      hermes_agent_local_model_runtime_version }}-ubuntu-arm64.tar.gz
    dest: "{{ hermes_agent_local_model_runtime_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: root
    group: root
    mode: "0755"
  when:
    - not ansible_check_mode
    - not hermes_agent_llama_server_binary.stat.exists

- name: Link active llama.cpp binaries
  ansible.builtin.file:
    src: "{{ hermes_agent_local_model_runtime_dir }}/{{ item }}"
    dest: >-
      {{ hermes_agent_local_model_llama_cli_path
      if item == 'llama-cli' else hermes_agent_local_model_llama_server_path }}
    state: link
    owner: root
    group: root
    force: true
  loop:
    - llama-cli
    - llama-server
  when: not ansible_check_mode or hermes_agent_llama_server_binary.stat.exists

- name: Create local model directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ hermes_agent_group }}"
    mode: "0750"
  loop:
    - "{{ hermes_agent_local_models_dir }}"
    - "{{ hermes_agent_local_models_results_dir }}"

- name: Download resumable local benchmark model parts
  ansible.builtin.command:
    argv:
      - /usr/bin/aria2c
      - --continue=true
      - --file-allocation=none
      - --max-connection-per-server=8
      - --min-split-size=16M
      - --split=8
      - --dir={{ hermes_agent_local_models_dir }}
      - --out={{ item.filename }}.partial
      - >-
        https://huggingface.co/{{ item.repository }}/resolve/{{ item.revision }}/{{
        item.filename }}
  loop: "{{ hermes_agent_local_models }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      not (
        hermes_agent_local_model_files.results
        | selectattr('item.id', 'equalto', item.id)
        | map(attribute='stat.exists')
        | first
      )

- name: Inspect resumable local benchmark model parts
  ansible.builtin.stat:
    path: "{{ hermes_agent_local_models_dir }}/{{ item.filename }}.partial"
    checksum_algorithm: sha256
  register: hermes_agent_local_model_parts
  loop: "{{ hermes_agent_local_models }}"
  loop_control:
    label: "{{ item.id }}"
  check_mode: false

- name: Assert resumable local benchmark model checksums
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.checksum == model.sha256
    fail_msg: >-
      {{ hermes_agent_local_models_dir }}/{{ model.filename }}.partial does not
      match its configured SHA-256 after
      download. Keep the partial file only if it can be resumed safely.
  loop: "{{ hermes_agent_local_model_parts.results }}"
  loop_control:
    label: "{{ item.item.id }}"
    loop_var: item
  vars:
    model: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - >-
      not (
        hermes_agent_local_model_files.results
        | selectattr('item.id', 'equalto', item.item.id)
        | map(attribute='stat.exists')
        | first
      )

- name: Activate checksum-verified local benchmark models
  ansible.builtin.command:
    argv:
      - /usr/bin/mv
      - --
      - "{{ item.filename }}.partial"
      - "{{ item.filename }}"
    chdir: "{{ hermes_agent_local_models_dir }}"
  loop: "{{ hermes_agent_local_models }}"
  loop_control:
    label: "{{ item.id }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      not (
        hermes_agent_local_model_files.results
        | selectattr('item.id', 'equalto', item.id)
        | map(attribute='stat.exists')
        | first
      )

- name: Restrict activated local benchmark model files
  ansible.builtin.file:
    path: "{{ hermes_agent_local_models_dir }}/{{ item.filename }}"
    owner: root
    group: "{{ hermes_agent_group }}"
    mode: "0640"
  loop: "{{ hermes_agent_local_models }}"
  loop_control:
    label: "{{ item.id }}"
  when: not ansible_check_mode

- name: Install loopback local-model service units
  ansible.builtin.template:
    src: hermes-local-model.service.j2
    dest: "/etc/systemd/system/hermes-local-model-{{ item.id }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ hermes_agent_local_models }}"
  loop_control:
    label: "{{ item.id }}"
  notify: Reload systemd daemon

- name: Create local-model benchmark helper directory
  ansible.builtin.file:
    path: "{{ hermes_agent_local_model_benchmark_helper_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not hermes_agent_local_model_benchmark_helper_parent.stat.exists

- name: Install local-model benchmark helper
  ansible.builtin.template:
    src: benchmark-hermes-local-model.sh.j2
    dest: "{{ hermes_agent_local_model_benchmark_helper_path }}"
    owner: root
    group: root
    mode: "0750"
  notify: Reload systemd daemon

- name: Reload local-model units before reading their limits
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode

- name: Read effective local-model systemd limits
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - show
      - "hermes-local-model-{{ item.id }}.service"
      - --property=LimitAS
      - --property=MemoryHigh
      - --property=MemoryMax
      - --property=MemorySwapMax
  register: hermes_agent_local_model_effective_limits
  changed_when: false
  check_mode: false
  loop: "{{ hermes_agent_local_models }}"
  loop_control:
    label: "{{ item.id }}"
  when: not ansible_check_mode

- name: Assert effective local-model systemd limits
  ansible.builtin.assert:
    that:
      - >-
        'LimitAS=' ~ (hermes_agent_local_models_address_space_limit | human_to_bytes | string)
        in item.stdout_lines
      - >-
        'MemoryHigh=' ~ (hermes_agent_local_models_memory_high | human_to_bytes | string)
        in item.stdout_lines
      - >-
        'MemoryMax=' ~ (hermes_agent_local_models_memory_max | human_to_bytes | string)
        in item.stdout_lines
      - >-
        'MemorySwapMax=' ~ (hermes_agent_local_models_memory_swap_max | human_to_bytes | string)
        in item.stdout_lines
    fail_msg: >-
      The effective systemd memory policy for {{ item.item.id }} does not match
      the bounded local-model configuration.
  loop: "{{ hermes_agent_local_model_effective_limits.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: not ansible_check_mode

- name: Read installed llama-server version
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_local_model_llama_server_path }}"
      - --version
  register: hermes_agent_llama_server_version
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Assert installed llama-server runs
  ansible.builtin.assert:
    that:
      - hermes_agent_llama_server_version.rc == 0
    fail_msg: >-
      llama-server failed to execute from
      {{ hermes_agent_local_model_llama_server_path }}.
  when: not ansible_check_mode
