---
- name: Inspect inference provenance plugin ownership state
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    checksum_algorithm: sha256
  loop:
    - >-
      {{ hermes_agent_home }}/plugins/{{
      hermes_agent_inference_provenance_plugin_name }}
    - >-
      {{ hermes_agent_home }}/plugins/{{
      hermes_agent_inference_provenance_plugin_name }}/plugin.yaml
    - >-
      {{ hermes_agent_home }}/plugins/{{
      hermes_agent_inference_provenance_plugin_name }}/__init__.py
    - "{{ hermes_agent_installer_path }}.inference-provenance.yml"
  register: hermes_agent_inference_provenance_target_states
  changed_when: false
  check_mode: false
  when: hermes_agent_manage_inference_provenance

- name: Read inference provenance plugin ownership state
  ansible.builtin.slurp:
    src: "{{ hermes_agent_installer_path }}.inference-provenance.yml"
  register: hermes_agent_inference_provenance_target_state_raw
  when:
    - hermes_agent_manage_inference_provenance
    - hermes_agent_inference_provenance_target_states.results[3].stat.isreg | default(false)
    - not hermes_agent_inference_provenance_target_states.results[3].stat.islnk | default(true)

- name: Load inference provenance plugin ownership state
  ansible.builtin.set_fact:
    hermes_agent_inference_provenance_target_state: >-
      {{
        (hermes_agent_inference_provenance_target_state_raw.content |
        b64decode | from_yaml)
        if hermes_agent_inference_provenance_target_state_raw is not skipped
        else {}
      }}
  when: hermes_agent_manage_inference_provenance

- name: Refuse foreign inference provenance plugin destinations
  ansible.builtin.assert:
    that:
      - >-
        not hermes_agent_inference_provenance_target_states.results[0].stat.exists or
        hermes_agent_inference_provenance_target_states.results[3].stat.exists
      - >-
        not hermes_agent_inference_provenance_target_states.results[3].stat.exists or
        (hermes_agent_inference_provenance_target_states.results[3].stat.isreg | default(false) and
        not hermes_agent_inference_provenance_target_states.results[3].stat.islnk | default(true) and
        hermes_agent_inference_provenance_target_states.results[3].stat.pw_name | default('') == 'root' and
        hermes_agent_inference_provenance_target_states.results[3].stat.gr_name | default('') == 'root' and
        hermes_agent_inference_provenance_target_states.results[3].stat.mode | default('') == '0600')
      - >-
        not hermes_agent_inference_provenance_target_states.results[3].stat.exists or
        hermes_agent_inference_provenance_target_state.keys() | list | sort ==
        ['implementation_sha256', 'manifest_sha256', 'plugin_name']
      - >-
        not hermes_agent_inference_provenance_target_states.results[3].stat.exists or
        hermes_agent_inference_provenance_target_state.plugin_name ==
        hermes_agent_inference_provenance_plugin_name
      - >-
        not hermes_agent_inference_provenance_target_states.results[1].stat.exists or
        (hermes_agent_inference_provenance_target_states.results[3].stat.exists and
        hermes_agent_inference_provenance_target_states.results[1].stat.isreg | default(false) and
        not hermes_agent_inference_provenance_target_states.results[1].stat.islnk | default(true) and
        hermes_agent_inference_provenance_target_states.results[1].stat.checksum | default('') ==
        hermes_agent_inference_provenance_target_state.get('manifest_sha256', ''))
      - >-
        not hermes_agent_inference_provenance_target_states.results[2].stat.exists or
        (hermes_agent_inference_provenance_target_states.results[3].stat.exists and
        hermes_agent_inference_provenance_target_states.results[2].stat.isreg | default(false) and
        not hermes_agent_inference_provenance_target_states.results[2].stat.islnk | default(true) and
        hermes_agent_inference_provenance_target_states.results[2].stat.checksum | default('') ==
        hermes_agent_inference_provenance_target_state.get('implementation_sha256', ''))
    fail_msg: >-
      An existing inference provenance plugin destination must have a private
      root-owned state record whose checksums recognize every existing file.
  when: hermes_agent_manage_inference_provenance
