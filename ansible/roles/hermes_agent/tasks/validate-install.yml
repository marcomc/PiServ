---
- name: Read Hermes Agent version
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_binary_path }}"
      - --version
  environment:
    HOME: "{{ hermes_agent_home }}"
    HERMES_HOME: "{{ hermes_agent_home }}"
    CODEX_HOME: "{{ hermes_agent_codex_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_version_output
  changed_when: false
  check_mode: false
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_checkout.stat.exists

- name: Assert Hermes Agent version
  ansible.builtin.assert:
    that:
      - >-
        'Hermes Agent v' + hermes_agent_version in
        hermes_agent_version_output.stdout
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_checkout.stat.exists

- name: Inspect authoritative Hermes configuration before live probes
  ansible.builtin.stat:
    path: "{{ hermes_agent_managed_config_path }}"
    follow: false
  register: hermes_agent_managed_config_state
  changed_when: false
  check_mode: false

- name: Assert authoritative Hermes configuration metadata
  ansible.builtin.assert:
    that:
      - hermes_agent_managed_config_state.stat.exists
      - hermes_agent_managed_config_state.stat.isreg
      - not hermes_agent_managed_config_state.stat.islnk
      - hermes_agent_managed_config_state.stat.pw_name == 'root'
      - hermes_agent_managed_config_state.stat.gr_name == hermes_agent_group
      - hermes_agent_managed_config_state.stat.mode == '0640'
    fail_msg: >-
      The authoritative Hermes configuration must be a regular non-symlink
      owned by root:{{ hermes_agent_group }} with mode 0640.
  when:
    - hermes_agent_runtime_user_available
    - hermes_agent_checkout.stat.exists
    - >-
      not ansible_check_mode or
      (hermes_agent_managed_config_state.stat.exists | default(false))

- name: Read Codex CLI version
  ansible.builtin.command:
    argv:
      - "{{ hermes_agent_codex_binary_path }}"
      - --version
  environment:
    HOME: "{{ hermes_agent_home }}"
    CODEX_HOME: "{{ hermes_agent_codex_home }}"
  become: true
  become_user: "{{ hermes_agent_user }}"
  register: hermes_agent_codex_version_output
  changed_when: false
  check_mode: false
  when: hermes_agent_codex_binary.stat.exists

- name: Assert Codex CLI version
  ansible.builtin.assert:
    that:
      - >-
        'codex-cli ' + hermes_agent_codex_version in
        hermes_agent_codex_version_output.stdout
  when: hermes_agent_codex_binary.stat.exists

- name: Validate Hermes Agent dashboard
  ansible.builtin.uri:
    url: >-
      http://{{ hermes_agent_dashboard_host }}:{{
      hermes_agent_dashboard_port }}/
    status_code: >-
      {{ 302 if hermes_agent_dashboard_manage_basic_auth else 200 }}
    return_content: false
    follow_redirects: none
  check_mode: false
  when:
    - hermes_agent_manage_dashboard
    - hermes_agent_dashboard_dist.stat.exists
