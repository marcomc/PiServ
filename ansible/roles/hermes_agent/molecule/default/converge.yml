---
- name: Converge
  hosts: all
  become: true
  pre_tasks:
    - name: Read fixture revision
      ansible.builtin.slurp:
        path: /usr/local/src/hermes-agent-fixture/revision
      register: hermes_agent_fixture_revision

    - name: Read fixture installer checksum
      ansible.builtin.stat:
        path: /usr/local/src/hermes-agent-fixture/hermes-agent-installer
        checksum_algorithm: sha256
      register: hermes_agent_fixture_installer

    - name: Read fixture Codex checksum
      ansible.builtin.stat:
        path: /usr/local/src/hermes-agent-fixture/codex.tar.gz
        checksum_algorithm: sha256
      register: hermes_agent_fixture_codex
  tasks:
    - name: Include tested role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hermes_agent_repo_version: >-
          {{ hermes_agent_fixture_revision.content | b64decode | trim }}
        hermes_agent_installer_url: >-
          file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
        hermes_agent_installer_checksum: >-
          sha256:{{ hermes_agent_fixture_installer.stat.checksum }}
        hermes_agent_codex_archive_url: >-
          file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
        hermes_agent_codex_archive_checksum: >-
          sha256:{{ hermes_agent_fixture_codex.stat.checksum }}
        hermes_agent_manage_backup: true
        hermes_agent_manage_dashboard_chat: true
        hermes_agent_backup_group: root
        hermes_agent_backup_dir: /var/backups/hermes-agent
