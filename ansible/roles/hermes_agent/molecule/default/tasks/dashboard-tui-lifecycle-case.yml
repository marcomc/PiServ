---
- name: Read installed revision for isolated terminal UI lifecycle
  ansible.builtin.command:
    argv:
      - /usr/bin/git
      - -C
      - /usr/local/lib/hermes-agent
      - rev-parse
      - HEAD
  register: hermes_agent_molecule_tui_lifecycle_revision
  changed_when: false

- name: Select installed revision for isolated terminal UI lifecycle
  ansible.builtin.set_fact:
    hermes_agent_repo_version: >-
      {{ hermes_agent_molecule_tui_lifecycle_revision.stdout | trim }}

- name: Remove prior isolated terminal UI lifecycle fixtures
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture
    - /usr/local/lib/hermes-agent-runtime/tui-check-mode-absent-fixture

- name: Check absent terminal UI runtime without an installed checkout
  ansible.builtin.include_tasks:
    file: >-
      {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
      }}/tasks/configure-dashboard-tui.yml
    apply:
      check_mode: true
  vars:
    hermes_agent_manage_dashboard: false
    hermes_agent_manage_dashboard_chat: true
    hermes_agent_dashboard_tui_runtime_dir: >-
      /usr/local/lib/hermes-agent-runtime/tui-check-mode-absent-fixture
    hermes_agent_dashboard_tui_runtime_revision_file: >-
      /usr/local/lib/hermes-agent-runtime/tui-check-mode-absent-fixture/.hermes-revision
    hermes_agent_dashboard_tui_runtime_manifest_file: >-
      /usr/local/lib/hermes-agent-runtime/tui-check-mode-absent-fixture/.hermes-managed-state.yml
    hermes_agent_checkout:
      stat:
        exists: false
    hermes_agent_install:
      changed: false

- name: Assert absent-checkout check mode made no terminal UI mutation
  ansible.builtin.stat:
    path: /usr/local/lib/hermes-agent-runtime/tui-check-mode-absent-fixture
  register: hermes_agent_molecule_absent_checkout_tui_runtime

- name: Verify absent-checkout check mode avoids terminal UI access failures
  ansible.builtin.assert:
    that:
      - not hermes_agent_molecule_absent_checkout_tui_runtime.stat.exists

- name: Create plausible foreign terminal UI runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture
      mode: "0755"
    - path: /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/dist
      mode: "0750"

- name: Create plausible foreign terminal UI runtime files
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/package.json
      content: '{"name":"foreign-tui-canary"}'
      mode: "0600"
    - path: /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/canary
      content: foreign terminal UI canary
      mode: "0640"
    - path: /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/dist/entry.js
      content: foreign terminal UI bundle
      mode: "0644"
    - path: /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/.hermes-revision
      content: plausible-foreign-revision
      mode: "0644"
    - path: /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/.hermes-managed-state.yml
      content: |
        entry_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        revision: plausible-foreign-revision
        source_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      mode: "0644"

- name: Reject plausible foreign terminal UI runtime
  block:
    - name: Run terminal UI lifecycle against foreign runtime
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/configure-dashboard-tui.yml
      vars:
        hermes_agent_manage_dashboard: false
        hermes_agent_manage_dashboard_chat: true
        hermes_agent_dashboard_tui_runtime_dir: >-
          /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture
        hermes_agent_dashboard_tui_runtime_revision_file: >-
          /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/.hermes-revision
        hermes_agent_dashboard_tui_runtime_manifest_file: >-
          /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/.hermes-managed-state.yml
        hermes_agent_checkout:
          stat:
            exists: true
        hermes_agent_install:
          changed: false

    - name: Fail if plausible foreign terminal UI runtime was accepted
      ansible.builtin.fail:
        msg: Plausible foreign terminal UI runtimes must be rejected.
  rescue:
    - name: Assert foreign terminal UI runtime failed provenance validation
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_task.name ==
                'Require absent or recognized Hermes dashboard terminal UI runtime'

- name: Reject plausible foreign terminal UI runtime in check mode
  block:
    - name: Check terminal UI lifecycle against foreign runtime
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/configure-dashboard-tui.yml
        apply:
          check_mode: true
      vars:
        hermes_agent_manage_dashboard: false
        hermes_agent_manage_dashboard_chat: true
        hermes_agent_dashboard_tui_runtime_dir: >-
          /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture
        hermes_agent_dashboard_tui_runtime_revision_file: >-
          /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/.hermes-revision
        hermes_agent_dashboard_tui_runtime_manifest_file: >-
          /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/.hermes-managed-state.yml
        hermes_agent_checkout:
          stat:
            exists: true
        hermes_agent_install:
          changed: false

    - name: Fail if check mode accepted foreign terminal UI runtime
      ansible.builtin.fail:
        msg: Check mode must reject plausible foreign terminal UI runtimes.
  rescue:
    - name: Assert check mode failed terminal UI provenance validation
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_task.name ==
            'Require absent or recognized Hermes dashboard terminal UI runtime'

- name: Inspect plausible foreign terminal UI runtime after rejection
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture
    - /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/dist
    - /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/package.json
    - /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/canary
  register: hermes_agent_molecule_foreign_tui_state

- name: Read plausible foreign terminal UI content after rejection
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/package.json
    - /usr/local/lib/hermes-agent-runtime/tui-foreign-fixture/canary
  register: hermes_agent_molecule_foreign_tui_content

- name: Assert foreign terminal UI runtime was preserved exactly
  ansible.builtin.assert:
    that:
      - hermes_agent_molecule_foreign_tui_state.results[0].stat.mode == '0755'
      - hermes_agent_molecule_foreign_tui_state.results[1].stat.mode == '0750'
      - hermes_agent_molecule_foreign_tui_state.results[2].stat.mode == '0600'
      - hermes_agent_molecule_foreign_tui_state.results[3].stat.mode == '0640'
      - >-
        hermes_agent_molecule_foreign_tui_content.results[0].content |
        b64decode == '{"name":"foreign-tui-canary"}'
      - >-
        hermes_agent_molecule_foreign_tui_content.results[1].content |
        b64decode == 'foreign terminal UI canary'

- name: Create stale managed terminal UI runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/dist

- name: Create stale managed terminal UI source and bundle
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.path }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - path: /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/package.json
      content: '{"name":"old-managed-tui"}'
    - path: /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/extra.txt
      content: stale managed extra
    - path: /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/dist/entry.js
      content: old managed terminal UI bundle

- name: Calculate stale managed terminal UI source fingerprint
  ansible.builtin.command:
    argv:
      - /bin/bash
      - -o
      - pipefail
      - -c
      - >-
        find . -type f ! -path './node_modules/*' ! -path './dist/*' ! -name
        '.hermes-revision' ! -name '.hermes-managed-state.yml' -print0 |
        LC_ALL=C sort -z | xargs -0 -r sha256sum | sha256sum | cut -d' ' -f1
  args:
    chdir: /usr/local/lib/hermes-agent-runtime/tui-stale-fixture
  register: hermes_agent_molecule_stale_tui_source_fingerprint
  changed_when: false

- name: Inspect stale managed terminal UI bundle checksum
  ansible.builtin.stat:
    path: /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/dist/entry.js
    checksum_algorithm: sha256
  register: hermes_agent_molecule_stale_tui_bundle

- name: Record exact stale managed terminal UI provenance
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.path }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - path: /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-revision
      content: "1111111111111111111111111111111111111111\n"
    - path: /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-managed-state.yml
      content: >-
        {{ {
          'revision': '1111111111111111111111111111111111111111',
          'source_sha256': hermes_agent_molecule_stale_tui_source_fingerprint.stdout | trim,
          'entry_sha256': hermes_agent_molecule_stale_tui_bundle.stat.checksum
        } | to_nice_yaml(indent=2) }}

- name: Converge valid stale managed terminal UI runtime
  ansible.builtin.include_tasks:
    file: >-
      {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
      }}/tasks/configure-dashboard-tui.yml
  vars:
    hermes_agent_manage_dashboard: false
    hermes_agent_manage_dashboard_chat: true
    hermes_agent_dashboard_tui_runtime_dir: >-
      /usr/local/lib/hermes-agent-runtime/tui-stale-fixture
    hermes_agent_dashboard_tui_runtime_revision_file: >-
      /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-revision
    hermes_agent_dashboard_tui_runtime_manifest_file: >-
      /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-managed-state.yml
    hermes_agent_checkout:
      stat:
        exists: true
    hermes_agent_install:
      changed: false

- name: Inspect converged stale terminal UI runtime
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/extra.txt
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/package.json
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/dist/entry.js
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-revision
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-managed-state.yml
  register: hermes_agent_molecule_converged_stale_tui_state

- name: Read converged stale terminal UI runtime
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/package.json
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-revision
    - /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-managed-state.yml
  register: hermes_agent_molecule_converged_stale_tui_content

- name: Assert stale managed terminal UI converged to desired state
  ansible.builtin.assert:
    that:
      - not hermes_agent_molecule_converged_stale_tui_state.results[0].stat.exists
      - >-
        hermes_agent_molecule_converged_stale_tui_content.results[0].content |
        b64decode | trim == '{"name":"hermes-tui-fixture"}'
      - >-
        hermes_agent_molecule_converged_stale_tui_content.results[1].content |
        b64decode | trim == hermes_agent_repo_version
      - >-
        (hermes_agent_molecule_converged_stale_tui_content.results[2].content |
        b64decode | from_yaml).revision == hermes_agent_repo_version
      - >-
        (hermes_agent_molecule_converged_stale_tui_content.results[2].content |
        b64decode | from_yaml).source_sha256 ==
        hermes_agent_dashboard_tui_source_fingerprint.stdout | trim
      - hermes_agent_molecule_converged_stale_tui_state.results[2].stat.mode == '0644'
      - hermes_agent_molecule_converged_stale_tui_state.results[3].stat.mode == '0644'
      - hermes_agent_molecule_converged_stale_tui_state.results[4].stat.mode == '0644'

- name: Re-run identical terminal UI lifecycle
  ansible.builtin.include_tasks:
    file: >-
      {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
      }}/tasks/configure-dashboard-tui.yml
  vars:
    hermes_agent_manage_dashboard: false
    hermes_agent_manage_dashboard_chat: true
    hermes_agent_dashboard_tui_runtime_dir: >-
      /usr/local/lib/hermes-agent-runtime/tui-stale-fixture
    hermes_agent_dashboard_tui_runtime_revision_file: >-
      /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-revision
    hermes_agent_dashboard_tui_runtime_manifest_file: >-
      /usr/local/lib/hermes-agent-runtime/tui-stale-fixture/.hermes-managed-state.yml
    hermes_agent_checkout:
      stat:
        exists: true
    hermes_agent_install:
      changed: false
  register: hermes_agent_molecule_second_tui_lifecycle

- name: Assert identical terminal UI lifecycle is idempotent
  ansible.builtin.assert:
    that:
      - not hermes_agent_molecule_second_tui_lifecycle.changed
