---
- name: Verify  # noqa complexity[play] - one ordered lifecycle regression scenario
  hosts: all
  become: true
  tasks:
    - name: Pin expected fixture origin across dynamic role inclusions
      ansible.builtin.set_fact:
        hermes_agent_expected_repo_origin: /usr/local/src/hermes-agent-fixture/upstream

    - name: Read Hermes Agent service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - hermes-agent-dashboard.service
      changed_when: false
      register: hermes_agent_molecule_dashboard_state

    - name: Read Hermes Agent backup timer state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - hermes-agent-backup.timer
      changed_when: false
      register: hermes_agent_molecule_backup_timer_state

    - name: Verify loopback dashboard response
      ansible.builtin.uri:
        url: http://127.0.0.1:9119/
        status_code: 200
        return_content: false

    - name: Run scheduled backup service
      ansible.builtin.command:
        argv:
          - systemctl
          - start
          - hermes-agent-backup.service
      changed_when: true

    - name: Find Hermes Agent backup archive
      ansible.builtin.find:
        paths: /var/backups/hermes-agent
        patterns: hermes-backup-*.zip
        file_type: file
      register: hermes_agent_molecule_backup_archives

    - name: Read Hermes Agent version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/hermes
          - --version
      changed_when: false
      register: hermes_agent_molecule_installed_hermes_version

    - name: Read Codex CLI version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/codex
          - --version
      changed_when: false
      register: hermes_agent_molecule_installed_codex_version

    - name: Read fixture Hermes revision
      ansible.builtin.slurp:
        src: /usr/local/src/hermes-agent-fixture/revision
      changed_when: false
      register: hermes_agent_molecule_fixture_revision

    - name: Read fixture artifact checksums
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /usr/local/src/hermes-agent-fixture/hermes-agent-installer
        - /usr/local/src/hermes-agent-fixture/codex.tar.gz
      register: hermes_agent_molecule_fixture_artifacts

    - name: Read Hermes dashboard terminal UI runtime revision
      ansible.builtin.command:
        argv:
          - cat
          - /usr/local/lib/hermes-agent-runtime/tui/.hermes-revision
      changed_when: false
      register: hermes_agent_molecule_dashboard_tui_revision

    - name: Inspect Hermes dashboard terminal UI runtime bundle
      ansible.builtin.stat:
        path: /usr/local/lib/hermes-agent-runtime/tui/dist/entry.js
      register: hermes_agent_molecule_dashboard_tui_bundle

    - name: Inspect installer-created Hermes node runtime file
      ansible.builtin.stat:
        path: /var/lib/hermes-agent/node/bin/npm
      register: hermes_agent_molecule_node_runtime_file

    - name: Verify local-model capability is inert by default
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/hermes-local-model-gemma-4-e2b.service
        - /etc/systemd/system/hermes-local-model-granite-3-3-2b.service
        - /usr/local/libexec/hermes-agent/benchmark-local-model
        - /usr/local/lib/llama.cpp
        - /var/lib/hermes-models
      register: hermes_agent_molecule_local_model_artifacts

    - name: Assert installed role behavior
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_dashboard_state.stdout | trim == 'active'
          - hermes_agent_molecule_backup_timer_state.stdout | trim == 'enabled'
          - hermes_agent_molecule_backup_archives.matched | int == 1
          - hermes_agent_molecule_installed_hermes_version.stdout | trim == 'Hermes Agent v0.20.0'
          - hermes_agent_molecule_installed_codex_version.stdout | trim == 'codex-cli 0.145.0'
          - hermes_agent_molecule_dashboard_tui_revision.stdout | trim == (hermes_agent_molecule_fixture_revision.content | b64decode | trim)
          - hermes_agent_molecule_dashboard_tui_bundle.stat.exists
          - hermes_agent_molecule_dashboard_tui_bundle.stat.isreg
          - hermes_agent_molecule_dashboard_tui_bundle.stat.pw_name == 'root'
          - hermes_agent_molecule_dashboard_tui_bundle.stat.gr_name == 'root'
          - hermes_agent_molecule_dashboard_tui_bundle.stat.mode == '0644'
          - hermes_agent_molecule_node_runtime_file.stat.isreg
          - hermes_agent_molecule_node_runtime_file.stat.pw_name == 'hermes-agent'
          - hermes_agent_molecule_node_runtime_file.stat.gr_name == 'hermes-agent'
          - hermes_agent_molecule_node_runtime_file.stat.mode == '0755'
          - >-
            hermes_agent_molecule_local_model_artifacts.results |
            selectattr('stat.exists') | list | length == 0

    - name: Load role defaults for local-model capacity fixture
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"

    - name: Reject an excessive Home Assistant MCP request timeout
      block:
        - name: Validate an excessive Home Assistant MCP request timeout
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_manage_home_assistant_mcp: true
            hermes_agent_home_assistant_mcp_url: http://home-assistant.example.test/api/mcp
            hermes_agent_home_assistant_mcp_timeout: 301
            hermes_agent_home_assistant_mcp_connect_timeout: 15

        - name: Fail if the excessive Home Assistant MCP request timeout was accepted
          ansible.builtin.fail:
            msg: The Home Assistant MCP request timeout must not exceed 300 seconds.
      rescue:
        - name: Assert excessive request timeout failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of excessive Home Assistant MCP request timeout
          ansible.builtin.set_fact:
            hermes_agent_molecule_request_timeout_rejected: true

    - name: Reject an excessive Home Assistant MCP connection timeout
      block:
        - name: Validate an excessive Home Assistant MCP connection timeout
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_manage_home_assistant_mcp: true
            hermes_agent_home_assistant_mcp_url: http://home-assistant.example.test/api/mcp
            hermes_agent_home_assistant_mcp_timeout: 60
            hermes_agent_home_assistant_mcp_connect_timeout: 61

        - name: Fail if the excessive Home Assistant MCP connection timeout was accepted
          ansible.builtin.fail:
            msg: The Home Assistant MCP connection timeout must not exceed 60 seconds.
      rescue:
        - name: Assert excessive connection timeout failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of excessive Home Assistant MCP connection timeout
          ansible.builtin.set_fact:
            hermes_agent_molecule_connection_timeout_rejected: true

    - name: Assert Home Assistant MCP timeout limits are enforced
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_request_timeout_rejected | default(false)
          - hermes_agent_molecule_connection_timeout_rejected | default(false)

    - name: Reject an excessive backup randomized delay
      block:
        - name: Validate an excessive backup randomized delay
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_manage_backup: true
            hermes_agent_backup_group: root
            hermes_agent_backup_randomized_delay: 999999w

        - name: Fail if excessive backup randomized delay was accepted
          ansible.builtin.fail:
            msg: Backup randomized delay must not exceed one day.
      rescue:
        - name: Assert excessive backup randomized delay failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of excessive backup randomized delay
          ansible.builtin.set_fact:
            hermes_agent_molecule_backup_randomized_delay_rejected: true

    - name: Reject an excessive dashboard authentication session lifetime
      block:
        - name: Validate excessive dashboard authentication session lifetime
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_dashboard_manage_basic_auth: true
            hermes_agent_dashboard_basic_auth_session_ttl_seconds: 86401

        - name: Fail if excessive dashboard authentication session lifetime was accepted
          ansible.builtin.fail:
            msg: Dashboard authentication session lifetime must not exceed one day.
      rescue:
        - name: Assert excessive dashboard authentication lifetime failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of excessive dashboard authentication session lifetime
          ansible.builtin.set_fact:
            hermes_agent_molecule_dashboard_ttl_rejected: true

    - name: Reject an unsafe inference provenance plugin name
      block:
        - name: Validate unsafe inference provenance plugin name
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_manage_inference_provenance: false
            hermes_agent_inference_provenance_plugin_name: ../etc

        - name: Fail if unsafe inference provenance plugin name was accepted
          ansible.builtin.fail:
            msg: Inference provenance plugin names must not contain path separators.
      rescue:
        - name: Assert unsafe inference provenance plugin name failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of unsafe inference provenance plugin name
          ansible.builtin.set_fact:
            hermes_agent_molecule_plugin_name_rejected: true

    - name: Assert dashboard and plugin validation limits are enforced
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_backup_randomized_delay_rejected | default(false)
          - hermes_agent_molecule_dashboard_ttl_rejected | default(false)
          - hermes_agent_molecule_plugin_name_rejected | default(false)

    - name: Reject an unsafe Codex archive binary name
      block:
        - name: Validate unsafe Codex archive binary name
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_codex_archive_binary_name: ../codex

        - name: Fail if unsafe Codex archive binary name was accepted
          ansible.builtin.fail:
            msg: Codex archive binary names must be safe relative basenames.
      rescue:
        - name: Assert unsafe Codex archive binary name failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

    - name: Reject the normalized Codex archive binary name
      block:
        - name: Validate normalized Codex archive binary name
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_codex_archive_binary_name: codex

        - name: Fail if normalized Codex archive binary name was accepted
          ansible.builtin.fail:
            msg: The archive source must not alias the normalized Codex binary.
      rescue:
        - name: Assert normalized Codex archive binary name failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

    - name: Reject duplicate local-model filenames
      block:
        - name: Validate duplicate local-model filenames
          ansible.builtin.include_tasks:
            file: >-
              {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-local-model-storage.yml
          vars:
            hermes_agent_manage_local_models: true
            hermes_agent_local_models:
              - id: duplicate-one
                display_name: Duplicate one
                repository: example/model-one
                revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                filename: duplicate.gguf
                sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                size_bytes: 1024
                port: 18081
              - id: duplicate-two
                display_name: Duplicate two
                repository: example/model-two
                revision: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                filename: duplicate.gguf
                sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                size_bytes: 1024
                port: 18082

        - name: Fail if duplicate local-model filenames were accepted
          ansible.builtin.fail:
            msg: Duplicate local-model filenames must be rejected.
      rescue:
        - name: Assert duplicate local-model filenames failed validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert local-model storage configuration'

    - name: Reject terminal UI metadata path overlapping runtime source
      block:
        - name: Validate overlapping terminal UI metadata path
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_dashboard_tui_runtime_revision_file: >-
              /usr/local/lib/hermes-agent-runtime/tui/package.json

        - name: Fail if overlapping terminal UI metadata path was accepted
          ansible.builtin.fail:
            msg: Terminal UI metadata paths must not overlap runtime source.
      rescue:
        - name: Assert overlapping terminal UI metadata path failed validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

    - name: Create terminal UI metadata inode-alias fixture directory
      ansible.builtin.file:
        path: /usr/local/lib/hermes-tui-inode-fixture
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create terminal UI revision inode fixture
      ansible.builtin.copy:
        content: terminal UI metadata canary
        dest: /usr/local/lib/hermes-tui-inode-fixture/.hermes-revision
        owner: root
        group: root
        mode: "0644"

    - name: Create terminal UI manifest hard-link alias fixture
      ansible.builtin.command:
        argv:
          - /usr/bin/ln
          - /usr/local/lib/hermes-tui-inode-fixture/.hermes-revision
          - /usr/local/lib/hermes-tui-inode-fixture/.hermes-managed-state.yml
      changed_when: true

    - name: Reject terminal UI metadata inode aliases
      block:
        - name: Validate terminal UI metadata inode aliases
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_dashboard_tui_runtime_dir: >-
              /usr/local/lib/hermes-tui-inode-fixture
            hermes_agent_dashboard_tui_runtime_revision_file: >-
              /usr/local/lib/hermes-tui-inode-fixture/.hermes-revision
            hermes_agent_dashboard_tui_runtime_manifest_file: >-
              /usr/local/lib/hermes-tui-inode-fixture/.hermes-managed-state.yml

        - name: Fail if terminal UI metadata inode aliases were accepted
          ansible.builtin.fail:
            msg: Terminal UI metadata inode aliases must be rejected.
      rescue:
        - name: Assert terminal UI metadata inode aliases failed validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Reject Hermes dashboard terminal UI metadata inode aliases'

    - name: Read terminal UI metadata aliases after rejection
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /usr/local/lib/hermes-tui-inode-fixture/.hermes-revision
        - /usr/local/lib/hermes-tui-inode-fixture/.hermes-managed-state.yml
      register: hermes_agent_molecule_tui_metadata_aliases
      changed_when: false

    - name: Assert terminal UI metadata aliases are untouched
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_tui_metadata_aliases.results[0].content |
            b64decode == 'terminal UI metadata canary'
          - >-
            hermes_agent_molecule_tui_metadata_aliases.results[1].content |
            b64decode == 'terminal UI metadata canary'

    - name: Remove terminal UI metadata inode-alias fixture
      ansible.builtin.file:
        path: /usr/local/lib/hermes-tui-inode-fixture
        state: absent

    - name: Reject lexical aliases for dashboard authentication outputs
      block:
        - name: Validate aliased dashboard authentication output paths
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_dashboard_manage_basic_auth: true
            hermes_agent_dashboard_basic_auth_username: fixture-admin
            hermes_agent_dashboard_basic_auth_state_file: /root/hermes-auth-alias
            hermes_agent_dashboard_basic_auth_bootstrap_password_file: >-
              /root/./hermes-auth-alias

        - name: Fail if aliased dashboard authentication outputs were accepted
          ansible.builtin.fail:
            msg: Lexically aliased dashboard authentication outputs must be rejected.
      rescue:
        - name: Assert aliased dashboard authentication outputs failed validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require distinct canonical Hermes dashboard authentication output paths'

    - name: Reject auth state overlapping the derived bootstrap marker
      block:
        - name: Validate auth state overlapping the bootstrap marker path
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_dashboard_manage_basic_auth: true
            hermes_agent_dashboard_basic_auth_username: fixture-admin
            hermes_agent_dashboard_basic_auth_state_file: >-
              /root/hermes-marker-alias.managed.yml
            hermes_agent_dashboard_basic_auth_bootstrap_password_file: >-
              /root/hermes-marker-alias

        - name: Fail if auth state overlapping the bootstrap marker was accepted
          ansible.builtin.fail:
            msg: Auth state must not overlap the derived bootstrap marker.
      rescue:
        - name: Assert bootstrap marker path overlap failed validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require distinct canonical Hermes dashboard authentication output paths'

    - name: Create dashboard authentication inode-alias fixture
      ansible.builtin.copy:
        content: inode alias canary
        dest: /root/hermes-auth-inode-one
        owner: root
        group: root
        mode: "0600"

    - name: Create distinct dashboard bootstrap password inode fixture
      ansible.builtin.copy:
        content: distinct bootstrap canary
        dest: /root/hermes-auth-inode-two
        owner: root
        group: root
        mode: "0600"

    - name: Create dashboard authentication marker hard-link alias fixture
      ansible.builtin.command:
        argv:
          - /usr/bin/ln
          - /root/hermes-auth-inode-one
          - /root/hermes-auth-inode-two.managed.yml
      changed_when: true

    - name: Reject inode aliases for dashboard authentication outputs
      block:
        - name: Validate dashboard authentication output inode aliases
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_dashboard_manage_basic_auth: true
            hermes_agent_dashboard_basic_auth_username: fixture-admin
            hermes_agent_dashboard_basic_auth_state_file: /root/hermes-auth-inode-one
            hermes_agent_dashboard_basic_auth_bootstrap_password_file: >-
              /root/hermes-auth-inode-two

        - name: Fail if dashboard authentication inode aliases were accepted
          ansible.builtin.fail:
            msg: Dashboard authentication output inode aliases must be rejected.
      rescue:
        - name: Assert dashboard authentication inode aliases failed validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Reject Hermes dashboard authentication output inode aliases'

    - name: Remove dashboard authentication inode-alias fixtures
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/hermes-auth-inode-one
        - /root/hermes-auth-inode-two
        - /root/hermes-auth-inode-two.managed.yml

    - name: Create foreign dashboard bootstrap password target fixture
      ansible.builtin.copy:
        content: foreign bootstrap canary
        dest: /root/hermes-foreign-bootstrap-target
        owner: root
        group: root
        mode: "0600"

    - name: Reject foreign dashboard bootstrap password target
      block:
        - name: Apply role with foreign dashboard bootstrap password target
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_repo_version: >-
              {{ hermes_agent_molecule_fixture_revision.content | b64decode | trim }}
            hermes_agent_installer_url: >-
              file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
            hermes_agent_installer_checksum: >-
              sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
            hermes_agent_codex_archive_url: >-
              file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
            hermes_agent_codex_archive_checksum: >-
              sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
            hermes_agent_manage_backup: false
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_dashboard_chat: true
            hermes_agent_dashboard_manage_basic_auth: true
            hermes_agent_dashboard_basic_auth_username: fixture-admin
            hermes_agent_dashboard_basic_auth_bootstrap_password_file: >-
              /root/hermes-foreign-bootstrap-target

        - name: Fail if foreign dashboard bootstrap target was accepted
          ansible.builtin.fail:
            msg: Foreign dashboard bootstrap targets must be rejected.
      rescue:
        - name: Assert foreign dashboard bootstrap target failed before overwrite
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require a recognized Hermes dashboard bootstrap password file'

    - name: Read foreign dashboard bootstrap target after rejection
      ansible.builtin.slurp:
        src: /root/hermes-foreign-bootstrap-target
      register: hermes_agent_molecule_foreign_bootstrap_target
      changed_when: false

    - name: Inspect foreign dashboard bootstrap managed-state canary
      ansible.builtin.stat:
        path: /root/hermes-foreign-bootstrap-target.managed.yml
      register: hermes_agent_molecule_foreign_bootstrap_marker

    - name: Assert foreign dashboard bootstrap target is untouched
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_foreign_bootstrap_target.content |
            b64decode == 'foreign bootstrap canary'
          - not hermes_agent_molecule_foreign_bootstrap_marker.stat.exists

    - name: Remove foreign dashboard bootstrap target fixture
      ansible.builtin.file:
        path: /root/hermes-foreign-bootstrap-target
        state: absent

    - name: Create marker-only dashboard bootstrap partial state
      ansible.builtin.copy:
        content: |
          path: /root/hermes-foreign-bootstrap-target
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        dest: /root/hermes-foreign-bootstrap-target.managed.yml
        owner: root
        group: root
        mode: "0600"

    - name: Reject marker-only dashboard bootstrap partial state
      block:
        - name: Apply role with marker-only dashboard bootstrap state
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars: &dashboard_auth_fixture_vars
            hermes_agent_repo_version: >-
              {{ hermes_agent_molecule_fixture_revision.content | b64decode | trim }}
            hermes_agent_installer_url: >-
              file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
            hermes_agent_installer_checksum: >-
              sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
            hermes_agent_codex_archive_url: >-
              file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
            hermes_agent_codex_archive_checksum: >-
              sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
            hermes_agent_manage_backup: false
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_dashboard_chat: true
            hermes_agent_dashboard_manage_basic_auth: true
            hermes_agent_dashboard_basic_auth_username: fixture-admin
            hermes_agent_dashboard_basic_auth_bootstrap_password_file: >-
              /root/hermes-foreign-bootstrap-target

        - name: Fail if marker-only dashboard bootstrap state was accepted
          ansible.builtin.fail:
            msg: Marker-only dashboard bootstrap state must be rejected.
      rescue:
        - name: Assert marker-only dashboard bootstrap state failed safely
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require a recognized Hermes dashboard bootstrap password file'

    - name: Read marker-only dashboard bootstrap state after rejection
      ansible.builtin.slurp:
        src: /root/hermes-foreign-bootstrap-target.managed.yml
      register: hermes_agent_molecule_marker_only_bootstrap_state
      changed_when: false

