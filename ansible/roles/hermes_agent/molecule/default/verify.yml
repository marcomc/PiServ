            import pathlib

            path = pathlib.Path(
                "/var/lib/hermes-agent/plugins/inference-provenance/__init__.py"
            )
            spec = importlib.util.spec_from_file_location("provenance_fixture", path)
            module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(module)

            def fail_audit(_record):
                raise OSError("fixture audit write failure")

            module._append_audit = fail_audit
            result = module.add_provenance("fixture response", "session", "model", "platform")
            assert result.endswith("[Inference: Fixture Codex provenance, model]")
