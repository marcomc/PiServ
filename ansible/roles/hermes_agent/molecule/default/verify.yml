        dest: /var/lib/hermes-foreign-codex-home/canary
        owner: root
        group: root
        mode: "0644"

    - name: Reject unsafe Codex home paths during preflight
      ansible.builtin.include_tasks:
        file: tasks/codex-home-preflight-case.yml
      loop:
        - /etc
        - /var/lib/../etc
        - /var/lib/hermes-foreign-codex-home
      loop_control:
        loop_var: hermes_agent_molecule_codex_home_case

    - name: Inspect foreign Codex home fixture after rejection
      ansible.builtin.stat:
        path: /var/lib/hermes-foreign-codex-home
      register: hermes_agent_molecule_foreign_codex_home

    - name: Read foreign Codex home content after rejection
      ansible.builtin.slurp:
        src: /var/lib/hermes-foreign-codex-home/canary
      register: hermes_agent_molecule_foreign_codex_home_content

    - name: Assert foreign Codex home fixture is preserved
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_foreign_codex_home.stat.isdir
          - hermes_agent_molecule_foreign_codex_home.stat.pw_name == 'root'
          - hermes_agent_molecule_foreign_codex_home.stat.gr_name == 'root'
          - hermes_agent_molecule_foreign_codex_home.stat.mode == '0755'
          - >-
            hermes_agent_molecule_foreign_codex_home_content.content |
            b64decode == 'foreign Codex state'

    - name: Read dashboard authentication state before username change
      ansible.builtin.slurp:
        src: /var/lib/hermes-agent/dashboard-basic-auth.yaml
      register: hermes_agent_molecule_auth_before_username_change

    - name: Converge changed dashboard authentication username
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hermes_agent_repo_version: >-
          {{ hermes_agent_molecule_fixture_revision.content | b64decode | trim }}
        hermes_agent_installer_url: >-
          file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
        hermes_agent_installer_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
        hermes_agent_codex_archive_url: >-
          file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
        hermes_agent_codex_archive_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
        hermes_agent_manage_dashboard: false
        hermes_agent_manage_dashboard_chat: false
        hermes_agent_manage_backup: false
        hermes_agent_dashboard_tui_runtime_dir: >-
          /usr/local/lib/hermes-agent-runtime/username-fixture-absent
        hermes_agent_dashboard_tui_runtime_revision_file: >-
          /usr/local/lib/hermes-agent-runtime/username-fixture-absent/.hermes-revision
        hermes_agent_dashboard_tui_runtime_manifest_file: >-
          /usr/local/lib/hermes-agent-runtime/username-fixture-absent/.hermes-managed-state.yml
        hermes_agent_dashboard_manage_basic_auth: true
        hermes_agent_dashboard_basic_auth_username: fixture-renamed

    - name: Read dashboard authentication state after username change
      ansible.builtin.slurp:
        src: /var/lib/hermes-agent/dashboard-basic-auth.yaml
      register: hermes_agent_molecule_auth_after_username_change

    - name: Assert username converges without rotating dashboard secrets
      ansible.builtin.assert:
        that:
          - >-
            (hermes_agent_molecule_auth_after_username_change.content |
            b64decode | from_yaml).username == 'fixture-renamed'
          - >-
            (hermes_agent_molecule_auth_after_username_change.content |
            b64decode | from_yaml).password_hash ==
            (hermes_agent_molecule_auth_before_username_change.content |
            b64decode | from_yaml).password_hash
          - >-
            (hermes_agent_molecule_auth_after_username_change.content |
            b64decode | from_yaml).secret ==
            (hermes_agent_molecule_auth_before_username_change.content |
            b64decode | from_yaml).secret

    - name: Create local-model unit reconciliation fixtures
      ansible.builtin.copy:
        content: |
          [Unit]
          Description={{ item.description }}
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/hermes-local-model-{{ item.id }}.service"
        owner: root
        group: root
        mode: "0644"
      loop:
        - id: obsolete-fixture
          description: Obsolete managed fixture
        - id: foreign-fixture
          description: Foreign preserved fixture
        - id: current-fixture
          description: Current managed fixture

    - name: Inspect local-model reconciliation fixture checksums
      ansible.builtin.stat:
        path: "/etc/systemd/system/hermes-local-model-{{ item }}.service"
        checksum_algorithm: sha256
      loop:
        - obsolete-fixture
        - current-fixture
      register: hermes_agent_molecule_local_model_fixture_units

    - name: Create foreign desired local-model unit fixture
      ansible.builtin.copy:
        content: foreign desired unit
        dest: /etc/systemd/system/hermes-local-model-foreign-desired-fixture.service
        owner: root
        group: root
        mode: "0644"

    - name: Record empty local-model manifest fixture
      ansible.builtin.copy:
        content: |
          managed_by: marcomc.hermes_agent
          version: 1
          units: {}
        dest: /etc/systemd/system/hermes-local-models.managed.yml
        owner: root
        group: root
        mode: "0600"

    - name: Validate empty local-model manifest fixture
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/validate-local-model-managed-state.yml

    - name: Reject foreign desired local-model unit fixture
      block:
        - name: Validate foreign desired local-model unit fixture
          ansible.builtin.include_tasks:
            file: >-
              {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
              }}/tasks/validate-desired-local-model-units.yml
          vars:
            hermes_agent_local_models:
              - id: foreign-desired-fixture

        - name: Fail if foreign desired local-model unit was accepted
          ansible.builtin.fail:
            msg: Foreign desired local-model units must fail preflight.
      rescue:
        - name: Assert foreign desired unit failed identity validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require recognized desired local-model service units'

    - name: Read foreign desired local-model unit after rejection
      ansible.builtin.slurp:
        src: /etc/systemd/system/hermes-local-model-foreign-desired-fixture.service
      register: hermes_agent_molecule_foreign_desired_unit

    - name: Assert foreign desired local-model unit is preserved exactly
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_foreign_desired_unit.content | b64decode ==
            'foreign desired unit'

    - name: Create prior managed desired local-model unit fixture
      ansible.builtin.copy:
        content: prior managed desired unit
        dest: /etc/systemd/system/hermes-local-model-managed-desired-fixture.service
        owner: root
        group: root
        mode: "0644"

    - name: Inspect prior managed desired local-model unit checksum
      ansible.builtin.stat:
        path: /etc/systemd/system/hermes-local-model-managed-desired-fixture.service
        checksum_algorithm: sha256
      register: hermes_agent_molecule_managed_desired_unit

    - name: Record prior managed desired local-model unit fixture
      ansible.builtin.copy:
        content: |
          managed_by: marcomc.hermes_agent
          version: 1
          units:
            managed-desired-fixture: {{ hermes_agent_molecule_managed_desired_unit.stat.checksum }}
        dest: /etc/systemd/system/hermes-local-models.managed.yml
        owner: root
        group: root
        mode: "0600"

    - name: Validate prior managed desired local-model manifest
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/validate-local-model-managed-state.yml

    - name: Accept unchanged prior managed desired local-model unit
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/validate-desired-local-model-units.yml
      vars:
        hermes_agent_local_models:
          - id: managed-desired-fixture

    - name: Apply intentional desired local-model unit update fixture
      ansible.builtin.copy:
        content: intentionally updated desired unit
        dest: /etc/systemd/system/hermes-local-model-managed-desired-fixture.service
        owner: root
        group: root
        mode: "0644"

    - name: Record intentional desired local-model unit update
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/record-local-model-unit-state.yml
      vars:
        hermes_agent_local_models:
          - id: managed-desired-fixture

    - name: Validate updated desired local-model manifest
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/validate-local-model-managed-state.yml

    - name: Accept converged intentional desired local-model unit update
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/validate-desired-local-model-units.yml
      vars:
        hermes_agent_local_models:
          - id: managed-desired-fixture

    - name: Modify previously managed desired local-model unit externally
      ansible.builtin.copy:
        content: externally modified desired unit
        dest: /etc/systemd/system/hermes-local-model-managed-desired-fixture.service
        owner: root
        group: root
        mode: "0644"

    - name: Reject modified previously managed desired local-model unit
      block:
        - name: Validate modified managed desired local-model unit fixture
          ansible.builtin.include_tasks:
            file: >-
              {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
              }}/tasks/validate-desired-local-model-units.yml
          vars:
            hermes_agent_local_models:
              - id: managed-desired-fixture

        - name: Fail if modified managed desired unit was accepted
          ansible.builtin.fail:
            msg: Modified previously managed desired units must fail preflight.
      rescue:
        - name: Assert modified desired unit failed identity validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require recognized desired local-model service units'

    - name: Read modified desired local-model unit after rejection
      ansible.builtin.slurp:
        src: /etc/systemd/system/hermes-local-model-managed-desired-fixture.service
      register: hermes_agent_molecule_modified_desired_unit

    - name: Assert modified desired local-model unit is preserved exactly
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_modified_desired_unit.content | b64decode ==
            'externally modified desired unit'

    - name: Create foreign valid-looking local-model manifest fixture
      ansible.builtin.copy:
        content: |
          managed_by: attacker.override
          version: 1
          units:
            obsolete-fixture: {{ hermes_agent_molecule_local_model_fixture_units.results[0].stat.checksum }}
        dest: /etc/systemd/system/hermes-local-models.managed.yml
        owner: root
        group: root
        mode: "0600"

    - name: Reject foreign valid-looking local-model manifest fixture
      block:
        - name: Validate foreign local-model manifest fixture
          ansible.builtin.include_tasks:
            file: >-
              {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
              }}/tasks/validate-local-model-managed-state.yml
          vars:
            hermes_agent_local_models_managed_by: attacker.override

        - name: Fail if foreign local-model manifest was accepted
          ansible.builtin.fail:
            msg: Foreign local-model manifests must fail preflight.
      rescue:
        - name: Assert foreign local-model manifest failed exact schema
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require exact local-model managed-state schema'

    - name: Read foreign local-model manifest after rejection
      ansible.builtin.slurp:
        src: /etc/systemd/system/hermes-local-models.managed.yml
      register: hermes_agent_molecule_foreign_local_model_manifest

    - name: Assert foreign local-model manifest is preserved exactly
      ansible.builtin.assert:
        that:
          - >-
            (hermes_agent_molecule_foreign_local_model_manifest.content |
            b64decode) ==
            ('managed_by: attacker.override\nversion: 1\nunits:\n  obsolete-fixture: ' ~
            hermes_agent_molecule_local_model_fixture_units.results[0].stat.checksum ~
            '\n')

    - name: Record prior managed local-model unit fixture
      ansible.builtin.copy:
        content: |
          managed_by: marcomc.hermes_agent
          version: 1
          units:
            obsolete-fixture: {{ hermes_agent_molecule_local_model_fixture_units.results[0].stat.checksum }}
        dest: /etc/systemd/system/hermes-local-models.managed.yml
        owner: root
        group: root
        mode: "0600"

    - name: Validate prior managed local-model unit fixture
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/validate-local-model-managed-state.yml

    - name: Replace previously managed local-model unit with foreign content
      ansible.builtin.copy:
        content: foreign replacement
        dest: /etc/systemd/system/hermes-local-model-obsolete-fixture.service
        owner: root
        group: root
        mode: "0644"

    - name: Reject replaced foreign local-model unit during reconciliation
      block:
        - name: Reconcile replaced foreign local-model unit fixture
          ansible.builtin.include_tasks:
            file: >-
              {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
              }}/tasks/reconcile-local-model-units.yml
          vars:
            hermes_agent_local_models_managed_state_file: >-
              /etc/systemd/system/hermes-local-models.managed.yml
            hermes_agent_local_model_desired_ids:
              - current-fixture

        - name: Fail if replaced foreign local-model unit was removed
          ansible.builtin.fail:
            msg: Changed local-model units must not be removed as managed.
      rescue:
        - name: Assert replaced local-model unit failed identity validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require recognized obsolete managed local-model units'

    - name: Read replaced foreign local-model unit after rejection
      ansible.builtin.slurp:
        src: /etc/systemd/system/hermes-local-model-obsolete-fixture.service
      register: hermes_agent_molecule_replaced_local_model_unit

    - name: Assert replaced foreign local-model unit is preserved
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_replaced_local_model_unit.content |
            b64decode == 'foreign replacement'

    - name: Restore managed obsolete local-model unit fixture
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Obsolete managed fixture
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/hermes-local-model-obsolete-fixture.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable obsolete managed local-model unit fixture
      ansible.builtin.systemd_service:
        name: hermes-local-model-obsolete-fixture.service
        enabled: true
        daemon_reload: true

    - name: Exercise managed local-model unit reconciliation
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/reconcile-local-model-units.yml
      vars:
        hermes_agent_local_models_managed_state_file: >-
          /etc/systemd/system/hermes-local-models.managed.yml
        hermes_agent_local_models:
          - id: current-fixture
        hermes_agent_local_model_desired_ids:
          - current-fixture

    - name: Rewrite current managed local-model unit state fixture
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/record-local-model-unit-state.yml
      vars:
        hermes_agent_local_models_managed_state_file: >-
          /etc/systemd/system/hermes-local-models.managed.yml
        hermes_agent_local_models:
          - id: current-fixture

    - name: Flush local-model unit reconciliation handlers
      ansible.builtin.meta: flush_handlers

    - name: Inspect reconciled and foreign local-model unit fixtures
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/hermes-local-model-obsolete-fixture.service
        - /etc/systemd/system/hermes-local-model-foreign-fixture.service
      register: hermes_agent_molecule_reconciled_local_model_units

    - name: Read reconciled local-model managed state
      ansible.builtin.slurp:
        src: /etc/systemd/system/hermes-local-models.managed.yml
      register: hermes_agent_molecule_reconciled_local_model_state

    - name: Read obsolete local-model unit enablement after reconciliation
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - hermes-local-model-obsolete-fixture.service
      register: hermes_agent_molecule_obsolete_local_model_enablement
      changed_when: false
      failed_when: false

    - name: Assert managed local-model reconciliation preserves foreign units
      ansible.builtin.assert:
        that:
          - not hermes_agent_molecule_reconciled_local_model_units.results[0].stat.exists
          - hermes_agent_molecule_reconciled_local_model_units.results[1].stat.exists
          - hermes_agent_molecule_obsolete_local_model_enablement.rc != 0
          - >-
            (hermes_agent_molecule_reconciled_local_model_state.content |
            b64decode | from_yaml).units.keys() | list == ['current-fixture']

    - name: Validate enabled local-model manifest before disablement
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/validate-local-model-managed-state.yml

    - name: Predict enabled-to-disabled local-model reconciliation in check mode
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/reconcile-local-model-units.yml
        apply:
          check_mode: true
      vars:
        hermes_agent_local_model_desired_ids: []

    - name: Inspect local-model artifacts after check-mode disable prediction
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/hermes-local-model-current-fixture.service
        - /etc/systemd/system/hermes-local-model-foreign-fixture.service
        - /etc/systemd/system/hermes-local-models.managed.yml
      register: hermes_agent_molecule_check_disabled_local_model_artifacts

    - name: Assert check mode predicts cleanup without mutation
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_local_model_unit_removals.results |
            selectattr('changed') | list | length == 1
          - hermes_agent_local_model_manifest_retirement.changed
          - >-
            hermes_agent_molecule_check_disabled_local_model_artifacts.results |
            selectattr('stat.exists') | list | length == 3

    - name: Reconcile enabled local-model units during feature disablement
      ansible.builtin.include_tasks:
        file: >-
          {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY')
          }}/tasks/reconcile-local-model-units.yml
      vars:
        hermes_agent_local_model_desired_ids: []

    - name: Flush disabled local-model reconciliation handlers
      ansible.builtin.meta: flush_handlers

    - name: Inspect local-model artifacts after feature disablement
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/hermes-local-model-current-fixture.service
        - /etc/systemd/system/hermes-local-model-foreign-fixture.service
        - /etc/systemd/system/hermes-local-models.managed.yml
      register: hermes_agent_molecule_disabled_local_model_artifacts

    - name: Read current local-model unit enablement after disablement
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - hermes-local-model-current-fixture.service
      register: hermes_agent_molecule_disabled_local_model_enablement
      changed_when: false
      failed_when: false

    - name: Assert disabled local-model lifecycle cleanup
      ansible.builtin.assert:
        that:
          - not hermes_agent_molecule_disabled_local_model_artifacts.results[0].stat.exists
          - hermes_agent_molecule_disabled_local_model_artifacts.results[1].stat.exists
          - not hermes_agent_molecule_disabled_local_model_artifacts.results[2].stat.exists
          - hermes_agent_molecule_disabled_local_model_enablement.rc != 0

    - name: Create root-owned node symlink target canary
      ansible.builtin.copy:
        content: node ownership canary
        dest: /var/tmp/hermes-node-ownership-canary
        owner: root
        group: root
        mode: "0644"

    - name: Create nested Hermes node runtime symlink fixture
      ansible.builtin.file:
        src: /var/tmp/hermes-node-ownership-canary
        dest: /var/lib/hermes-agent/node/bin/ownership-canary-link
        state: link
        owner: hermes-agent
        group: hermes-agent
        follow: false

    - name: Add second fixture revision source file
      ansible.builtin.copy:
        content: second fixture revision
        dest: /usr/local/src/hermes-agent-fixture/upstream/second-revision
        owner: root
        group: root
        mode: "0644"

    - name: Commit second fixture revision
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - /usr/local/src/hermes-agent-fixture/upstream
          - add
          - second-revision
      changed_when: true

    - name: Record second fixture revision commit
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - /usr/local/src/hermes-agent-fixture/upstream
          - commit
          - -m
          - Second fixture revision
      changed_when: true

    - name: Read second fixture revision
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - /usr/local/src/hermes-agent-fixture/upstream
          - rev-parse
          - HEAD
      register: hermes_agent_molecule_second_fixture_revision
      changed_when: false

    - name: Reinstall Hermes at second fixture revision
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hermes_agent_repo_version: "{{ hermes_agent_molecule_second_fixture_revision.stdout }}"
        hermes_agent_installer_url: >-
          file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
        hermes_agent_installer_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
        hermes_agent_codex_archive_url: >-
          file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
        hermes_agent_codex_archive_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
        hermes_agent_manage_dashboard: false
        hermes_agent_manage_backup: false

    - name: Inspect node symlink target after bounded ownership handoff
      ansible.builtin.stat:
        path: /var/tmp/hermes-node-ownership-canary
      register: hermes_agent_molecule_node_ownership_canary

    - name: Assert bounded ownership handoff did not follow nested symlink
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_node_ownership_canary.stat.pw_name == 'root'
          - hermes_agent_molecule_node_ownership_canary.stat.gr_name == 'root'
          - hermes_agent_molecule_node_ownership_canary.stat.mode == '0644'

    - name: Exercise isolated terminal UI lifecycle regressions
      ansible.builtin.include_tasks:
        file: tasks/dashboard-tui-lifecycle-case.yml
        apply:
          tags:
            - tui-lifecycle
      tags:
        - tui-lifecycle
      vars:
        hermes_agent_user: hermes-agent
        hermes_agent_group: hermes-agent
        hermes_agent_home: /var/lib/hermes-agent
        hermes_agent_install_dir: /usr/local/lib/hermes-agent

    - name: Remove active Codex artifacts for interrupted-install fixture
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/codex
        - /usr/local/bin/codex.hermes-agent-managed.yml
        - /usr/local/lib/codex/0.145.0

    - name: Create partial interrupted Codex staging fixture
      ansible.builtin.file:
        path: /usr/local/lib/codex/.hermes-codex-interrupted-fixture
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create partial interrupted Codex extraction fixture
      ansible.builtin.copy:
        content: partial extraction
        dest: /usr/local/lib/codex/.hermes-codex-interrupted-fixture/codex-aarch64-unknown-linux-musl
        owner: root
        group: root
        mode: "0755"

    - name: Retry Codex installation with an interrupted staging sibling
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hermes_agent_supported_architectures:
          - "{{ ansible_facts['architecture'] }}"
        hermes_agent_codex_archive_url: >-
          file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
        hermes_agent_codex_archive_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
        hermes_agent_manage_dashboard: false
        hermes_agent_manage_backup: false

    - name: Inspect Codex installation after interrupted retry
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - /usr/local/lib/codex/0.145.0
        - /usr/local/lib/codex/0.145.0/codex
        - /usr/local/lib/codex/.hermes-codex-interrupted-fixture
      register: hermes_agent_molecule_codex_retry_artifacts

    - name: Assert interrupted Codex staging does not poison retry
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_codex_retry_artifacts.results[0].stat.isdir
          - hermes_agent_molecule_codex_retry_artifacts.results[1].stat.isreg
          - hermes_agent_molecule_codex_retry_artifacts.results[1].stat.mode == '0755'
          - hermes_agent_molecule_codex_retry_artifacts.results[2].stat.isdir

  handlers:
    - name: Restart Hermes Agent dashboard
      ansible.builtin.systemd_service:
        name: "{{ hermes_agent_dashboard_service_name }}"
        state: restarted
        daemon_reload: true
      when:
        - hermes_agent_manage_dashboard | default(false)
        - not ansible_check_mode
