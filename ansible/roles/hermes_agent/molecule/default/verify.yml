---
- name: Verify  # noqa complexity[play] - one ordered lifecycle regression scenario
  hosts: all
  become: true
  tasks:
    - name: Pin expected fixture origin across dynamic role inclusions
      ansible.builtin.set_fact:
        hermes_agent_expected_repo_origin: /usr/local/src/hermes-agent-fixture/upstream

    - name: Read Hermes Agent service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - hermes-agent-dashboard.service
      changed_when: false
      register: hermes_agent_molecule_dashboard_state

    - name: Read Hermes Agent backup timer state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - hermes-agent-backup.timer
      changed_when: false
      register: hermes_agent_molecule_backup_timer_state

    - name: Verify loopback dashboard response
      ansible.builtin.uri:
        url: http://127.0.0.1:9119/
        status_code: 200
        return_content: false

    - name: Run scheduled backup service
      ansible.builtin.command:
        argv:
          - systemctl
          - start
          - hermes-agent-backup.service
      changed_when: true

    - name: Find Hermes Agent backup archive
      ansible.builtin.find:
        paths: /var/backups/hermes-agent
        patterns: hermes-backup-*.zip
        file_type: file
      register: hermes_agent_molecule_backup_archives

    - name: Read Hermes Agent version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/hermes
          - --version
      changed_when: false
      register: hermes_agent_molecule_installed_hermes_version

    - name: Read Codex CLI version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/codex
          - --version
      changed_when: false
      register: hermes_agent_molecule_installed_codex_version

    - name: Read fixture Hermes revision
      ansible.builtin.slurp:
        src: /usr/local/src/hermes-agent-fixture/revision
      changed_when: false
      register: hermes_agent_molecule_fixture_revision

    - name: Read fixture artifact checksums
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /usr/local/src/hermes-agent-fixture/hermes-agent-installer
        - /usr/local/src/hermes-agent-fixture/codex.tar.gz
      register: hermes_agent_molecule_fixture_artifacts

    - name: Read Hermes dashboard terminal UI runtime revision
      ansible.builtin.command:
        argv:
          - cat
          - /usr/local/lib/hermes-agent-runtime/tui/.hermes-revision
      changed_when: false
      register: hermes_agent_molecule_dashboard_tui_revision

    - name: Inspect Hermes dashboard terminal UI runtime bundle
      ansible.builtin.stat:
        path: /usr/local/lib/hermes-agent-runtime/tui/dist/entry.js
      register: hermes_agent_molecule_dashboard_tui_bundle

    - name: Inspect installer-created Hermes node runtime file
      ansible.builtin.stat:
        path: /var/lib/hermes-agent/node/bin/npm
      register: hermes_agent_molecule_node_runtime_file

    - name: Verify local-model capability is inert by default
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/hermes-local-model-gemma-4-e2b.service
        - /etc/systemd/system/hermes-local-model-granite-3-3-2b.service
        - /usr/local/libexec/hermes-agent/benchmark-local-model
        - /usr/local/lib/llama.cpp
        - /var/lib/hermes-models
      register: hermes_agent_molecule_local_model_artifacts

    - name: Assert installed role behavior
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_dashboard_state.stdout | trim == 'active'
          - hermes_agent_molecule_backup_timer_state.stdout | trim == 'enabled'
          - hermes_agent_molecule_backup_archives.matched | int == 1
          - hermes_agent_molecule_installed_hermes_version.stdout | trim == 'Hermes Agent v0.20.0'
          - hermes_agent_molecule_installed_codex_version.stdout | trim == 'codex-cli 0.145.0'
          - hermes_agent_molecule_dashboard_tui_revision.stdout | trim == (hermes_agent_molecule_fixture_revision.content | b64decode | trim)
          - hermes_agent_molecule_dashboard_tui_bundle.stat.exists
          - hermes_agent_molecule_dashboard_tui_bundle.stat.isreg
          - hermes_agent_molecule_dashboard_tui_bundle.stat.pw_name == 'root'
          - hermes_agent_molecule_dashboard_tui_bundle.stat.gr_name == 'root'
          - hermes_agent_molecule_dashboard_tui_bundle.stat.mode == '0644'
          - hermes_agent_molecule_node_runtime_file.stat.isreg
          - hermes_agent_molecule_node_runtime_file.stat.pw_name == 'hermes-agent'
          - hermes_agent_molecule_node_runtime_file.stat.gr_name == 'hermes-agent'
          - hermes_agent_molecule_node_runtime_file.stat.mode == '0755'
          - >-
            hermes_agent_molecule_local_model_artifacts.results |
            selectattr('stat.exists') | list | length == 0

    - name: Load role defaults for local-model capacity fixture
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"

    - name: Reject an excessive Home Assistant MCP request timeout
      block:
        - name: Validate an excessive Home Assistant MCP request timeout
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_manage_home_assistant_mcp: true
            hermes_agent_home_assistant_mcp_url: http://home-assistant.example.test/api/mcp
            hermes_agent_home_assistant_mcp_timeout: 301
            hermes_agent_home_assistant_mcp_connect_timeout: 15

        - name: Fail if the excessive Home Assistant MCP request timeout was accepted
          ansible.builtin.fail:
            msg: The Home Assistant MCP request timeout must not exceed 300 seconds.
      rescue:
        - name: Assert excessive request timeout failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of excessive Home Assistant MCP request timeout
          ansible.builtin.set_fact:
            hermes_agent_molecule_request_timeout_rejected: true

    - name: Reject an excessive Home Assistant MCP connection timeout
      block:
        - name: Validate an excessive Home Assistant MCP connection timeout
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_manage_home_assistant_mcp: true
            hermes_agent_home_assistant_mcp_url: http://home-assistant.example.test/api/mcp
            hermes_agent_home_assistant_mcp_timeout: 60
            hermes_agent_home_assistant_mcp_connect_timeout: 61

        - name: Fail if the excessive Home Assistant MCP connection timeout was accepted
          ansible.builtin.fail:
            msg: The Home Assistant MCP connection timeout must not exceed 60 seconds.
      rescue:
        - name: Assert excessive connection timeout failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of excessive Home Assistant MCP connection timeout
          ansible.builtin.set_fact:
            hermes_agent_molecule_connection_timeout_rejected: true

    - name: Assert Home Assistant MCP timeout limits are enforced
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_request_timeout_rejected | default(false)
          - hermes_agent_molecule_connection_timeout_rejected | default(false)

    - name: Reject an excessive backup randomized delay
      block:
        - name: Validate an excessive backup randomized delay
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_manage_backup: true
            hermes_agent_backup_group: root
            hermes_agent_backup_randomized_delay: 999999w

        - name: Fail if excessive backup randomized delay was accepted
          ansible.builtin.fail:
            msg: Backup randomized delay must not exceed one day.
      rescue:
        - name: Assert excessive backup randomized delay failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of excessive backup randomized delay
          ansible.builtin.set_fact:
            hermes_agent_molecule_backup_randomized_delay_rejected: true

    - name: Reject an excessive dashboard authentication session lifetime
      block:
        - name: Validate excessive dashboard authentication session lifetime
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_dashboard_manage_basic_auth: true
            hermes_agent_dashboard_basic_auth_session_ttl_seconds: 86401

        - name: Fail if excessive dashboard authentication session lifetime was accepted
          ansible.builtin.fail:
            msg: Dashboard authentication session lifetime must not exceed one day.
      rescue:
        - name: Assert excessive dashboard authentication lifetime failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of excessive dashboard authentication session lifetime
          ansible.builtin.set_fact:
            hermes_agent_molecule_dashboard_ttl_rejected: true

    - name: Reject an unsafe inference provenance plugin name
      block:
        - name: Validate unsafe inference provenance plugin name
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-target.yml"
          vars:
            hermes_agent_manage_inference_provenance: false
            hermes_agent_inference_provenance_plugin_name: ../etc

        - name: Fail if unsafe inference provenance plugin name was accepted
          ansible.builtin.fail:
            msg: Inference provenance plugin names must not contain path separators.
      rescue:
        - name: Assert unsafe inference provenance plugin name failed target validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert supported Hermes Agent target platform'

        - name: Record rejection of unsafe inference provenance plugin name
          ansible.builtin.set_fact:
            hermes_agent_molecule_plugin_name_rejected: true

    - name: Assert dashboard and plugin validation limits are enforced
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_backup_randomized_delay_rejected | default(false)
          - hermes_agent_molecule_dashboard_ttl_rejected | default(false)
          - hermes_agent_molecule_plugin_name_rejected | default(false)

    - name: Reject privileged Hermes runtime identity during preflight
      block:
        - name: Preflight privileged Hermes runtime identity
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/runtime-user.yml"
          vars:
            hermes_agent_runtime_user_phase: preflight
            hermes_agent_user: root
            hermes_agent_group: root
            hermes_agent_home: /var/lib/hermes-root-fixture
            hermes_agent_install_dir: /usr/local/lib/hermes-root-fixture
            hermes_agent_installer_path: /usr/local/libexec/hermes-root-fixture

        - name: Fail if privileged Hermes runtime identity was accepted
          ansible.builtin.fail:
            msg: Privileged runtime identities must fail preflight.
      rescue:
        - name: Assert privileged identity failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Assert Hermes Agent runtime identity names are unprivileged'

    - name: Reject a system-root Hermes install path during preflight
      block:
        - name: Preflight system-root Hermes install path
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/runtime-user.yml"
          vars:
            hermes_agent_runtime_user_phase: preflight
            hermes_agent_install_dir: /usr/local

        - name: Fail if system-root Hermes install path was accepted
          ansible.builtin.fail:
            msg: System-root install paths must fail preflight.
      rescue:
        - name: Assert system-root path failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Assert Hermes Agent runtime identity names are unprivileged'

    - name: Inspect shared temporary directory before installer-path preflight
      ansible.builtin.stat:
        path: /tmp
      register: hermes_agent_molecule_tmp_before

    - name: Reject a Hermes installer beneath a shared temporary directory
      block:
        - name: Preflight shared temporary Hermes installer path
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/runtime-user.yml"
          vars:
            hermes_agent_runtime_user_phase: preflight
            hermes_agent_user: hermes-agent
            hermes_agent_group: hermes-agent
            hermes_agent_home: /var/lib/hermes-agent
            hermes_agent_install_dir: /usr/local/lib/hermes-agent
            hermes_agent_installer_path: /tmp/hermes-agent-installer

        - name: Fail if shared temporary Hermes installer path was accepted
          ansible.builtin.fail:
            msg: Shared temporary installer paths must fail preflight.
      rescue:
        - name: Assert shared temporary installer path failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Reject shared temporary Hermes installer paths'

    - name: Inspect shared temporary directory after installer-path preflight
      ansible.builtin.stat:
        path: /tmp
      register: hermes_agent_molecule_tmp_after

    - name: Assert rejected temporary installer path made no mutation
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_tmp_after.stat.mode ==
            hermes_agent_molecule_tmp_before.stat.mode
          - >-
            hermes_agent_molecule_tmp_after.stat.pw_name ==
            hermes_agent_molecule_tmp_before.stat.pw_name
          - >-
            hermes_agent_molecule_tmp_after.stat.gr_name ==
            hermes_agent_molecule_tmp_before.stat.gr_name

    - name: Create disposable UID-zero alias fixture group
      ansible.builtin.group:
        name: hermes-uid-zero-fixture
        gid: 3450
        state: present

    - name: Create disposable non-root-named UID-zero alias
      ansible.builtin.user:
        name: hermes-uid-zero-fixture
        uid: 0
        non_unique: true
        group: hermes-uid-zero-fixture
        home: /var/lib/hermes-uid-zero-fixture
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create disposable non-root-named GID-zero alias
      ansible.builtin.group:
        name: hermes-gid-zero-fixture
        gid: 0
        non_unique: true
        state: present

    - name: Create disposable GID-zero runtime user
      ansible.builtin.user:
        name: hermes-gid-zero-fixture
        uid: 3451
        group: hermes-gid-zero-fixture
        home: /var/lib/hermes-gid-zero-fixture
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Reject disposable UID-zero alias before mutation
      block:
        - name: Apply role with UID-zero identity alias
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_user: hermes-uid-zero-fixture
            hermes_agent_group: hermes-uid-zero-fixture
            hermes_agent_home: /var/lib/hermes-uid-zero-fixture
            hermes_agent_install_dir: /usr/local/lib/hermes-uid-zero-fixture
            hermes_agent_installer_path: /usr/local/libexec/hermes-uid-zero-fixture
            hermes_agent_packages: [sl]
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_backup: false

        - name: Fail if UID-zero identity alias was accepted
          ansible.builtin.fail:
            msg: UID-zero aliases must fail preflight.
      rescue:
        - name: Assert UID-zero identity alias failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require compatible existing Hermes Agent identity and roots'

    - name: Reject disposable GID-zero alias before mutation
      block:
        - name: Apply role with GID-zero identity alias
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_user: hermes-gid-zero-fixture
            hermes_agent_group: hermes-gid-zero-fixture
            hermes_agent_home: /var/lib/hermes-gid-zero-fixture
            hermes_agent_install_dir: /usr/local/lib/hermes-gid-zero-fixture
            hermes_agent_installer_path: /usr/local/libexec/hermes-gid-zero-fixture
            hermes_agent_packages: [sl]
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_backup: false

        - name: Fail if GID-zero identity alias was accepted
          ansible.builtin.fail:
            msg: GID-zero aliases must fail preflight.
      rescue:
        - name: Assert GID-zero identity alias failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require compatible existing Hermes Agent identity and roots'

    - name: Create foreign Hermes Git checkout fixture
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - init
          - /usr/local/lib/hermes-foreign-checkout-fixture
      changed_when: true

    - name: Configure foreign Hermes Git checkout origin
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - /usr/local/lib/hermes-foreign-checkout-fixture
          - remote
          - add
          - origin
          - https://example.invalid/foreign/hermes.git
      changed_when: true

    - name: Reject foreign Hermes Git checkout before mutation
      block:
        - name: Apply role with foreign Hermes Git checkout
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_user: hermes-foreign-checkout-fixture
            hermes_agent_group: hermes-foreign-checkout-fixture
            hermes_agent_home: /var/lib/hermes-foreign-checkout-fixture
            hermes_agent_install_dir: /usr/local/lib/hermes-foreign-checkout-fixture
            hermes_agent_installer_path: /usr/local/libexec/hermes-foreign-checkout-fixture
            hermes_agent_packages: [sl]
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_backup: false

        - name: Fail if foreign Hermes Git checkout was accepted
          ansible.builtin.fail:
            msg: Foreign Git checkout origins must fail preflight.
      rescue:
        - name: Assert foreign checkout origin failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require expected Hermes Agent checkout origin'

    - name: Create incompatible runtime identity fixture group
      ansible.builtin.group:
        name: hermes-incompatible-fixture
        gid: 2345
        state: present

    - name: Create incompatible runtime identity fixture user
      ansible.builtin.user:
        name: hermes-incompatible-fixture
        uid: 2345
        group: hermes-incompatible-fixture
        home: /var/lib/hermes-incompatible-wrong-home
        shell: /bin/sh
        create_home: false
        state: present

    - name: Reject incompatible existing Hermes runtime identity
      block:
        - name: Apply role with incompatible existing runtime identity
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_user: hermes-incompatible-fixture
            hermes_agent_group: hermes-incompatible-fixture
            hermes_agent_home: /var/lib/hermes-incompatible-fixture
            hermes_agent_install_dir: /usr/local/lib/hermes-incompatible-fixture
            hermes_agent_installer_path: /usr/local/libexec/hermes-incompatible-fixture
            hermes_agent_packages: [sl]
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_backup: false

        - name: Fail if incompatible existing runtime identity was accepted
          ansible.builtin.fail:
            msg: Incompatible existing identities must fail preflight.
      rescue:
        - name: Assert incompatible identity failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require compatible existing Hermes Agent identity and roots'

    - name: Create foreign Hermes persistent home fixture
      ansible.builtin.file:
        path: /var/lib/hermes-foreign-home-fixture
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Reject foreign existing Hermes persistent home
      block:
        - name: Apply role with foreign existing persistent home
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_user: hermes-foreign-home-fixture
            hermes_agent_group: hermes-foreign-home-fixture
            hermes_agent_home: /var/lib/hermes-foreign-home-fixture
            hermes_agent_install_dir: /usr/local/lib/hermes-foreign-home-fixture
            hermes_agent_installer_path: /usr/local/libexec/hermes-foreign-home-fixture
            hermes_agent_packages: [sl]
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_backup: false

        - name: Fail if foreign existing persistent home was accepted
          ansible.builtin.fail:
            msg: Foreign existing homes must fail preflight.
      rescue:
        - name: Assert foreign home failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require compatible existing Hermes Agent identity and roots'

    - name: Create Hermes symlink-parent target fixture
      ansible.builtin.file:
        path: /var/tmp/hermes-symlink-parent-target
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Hermes symlink-parent alias fixture
      ansible.builtin.file:
        src: /var/tmp/hermes-symlink-parent-target
        dest: /var/lib/hermes-symlink-parent
        state: link

    - name: Reject Hermes managed path beneath a symlinked parent
      block:
        - name: Apply role with symlink-parent persistent home
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_user: hermes-symlink-parent-fixture
            hermes_agent_group: hermes-symlink-parent-fixture
            hermes_agent_home: /var/lib/hermes-symlink-parent/home
            hermes_agent_install_dir: /usr/local/lib/hermes-symlink-parent-fixture
            hermes_agent_installer_path: /usr/local/libexec/hermes-symlink-parent-fixture
            hermes_agent_packages: [sl]
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_backup: false

        - name: Fail if symlink-parent managed path was accepted
          ansible.builtin.fail:
            msg: Symlink-parent managed paths must fail preflight.
      rescue:
        - name: Assert symlink-parent path failed before mutation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require canonical dedicated Hermes Agent managed paths'

    - name: Inspect preflight rejection mutation canaries
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/libexec/hermes-uid-zero-fixture
        - /usr/local/libexec/hermes-gid-zero-fixture
        - /usr/local/libexec/hermes-foreign-checkout-fixture
        - /usr/local/libexec/hermes-incompatible-fixture
        - /usr/local/libexec/hermes-foreign-home-fixture
        - /usr/local/libexec/hermes-symlink-parent-fixture
      register: hermes_agent_molecule_preflight_installer_canaries

    - name: Read preflight rejection account and package canaries
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - ["getent", "passwd", "hermes-incompatible-fixture"]
        - ["getent", "passwd", "hermes-foreign-home-fixture"]
        - ["getent", "passwd", "hermes-symlink-parent-fixture"]
        - ["getent", "group", "hermes-foreign-home-fixture"]
        - ["getent", "group", "hermes-symlink-parent-fixture"]
        - ["dpkg-query", "--show", "--showformat=${db:Status-Status}", "sl"]
      register: hermes_agent_molecule_preflight_command_canaries
      changed_when: false
      failed_when: false

    - name: Assert unsafe preflights made no package account or install mutation
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_preflight_installer_canaries.results |
            selectattr('stat.exists') | list | length == 0
          - >-
            hermes_agent_molecule_preflight_command_canaries.results[0].stdout
            is search(':/var/lib/hermes-incompatible-wrong-home:/bin/sh$')
          - hermes_agent_molecule_preflight_command_canaries.results[1].rc != 0
          - hermes_agent_molecule_preflight_command_canaries.results[2].rc != 0
          - hermes_agent_molecule_preflight_command_canaries.results[3].rc != 0
          - hermes_agent_molecule_preflight_command_canaries.results[4].rc != 0
          - hermes_agent_molecule_preflight_command_canaries.results[5].rc != 0

    - name: Create foreign local-model storage fixture
      ansible.builtin.file:
        path: /var/lib/hermes-local-storage-foreign
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Read unrelated package state before invalid local-model storage
      ansible.builtin.command:
        argv:
          - dpkg-query
          - --show
          - --showformat=${db:Status-Status}
          - sl
      register: hermes_agent_molecule_local_storage_package_before
      changed_when: false
      failed_when: false

    - name: Reject foreign local-model storage before installation
      block:
        - name: Apply role with foreign local-model storage
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_user: hermes-local-storage-fixture
            hermes_agent_group: hermes-local-storage-fixture
            hermes_agent_home: /var/lib/hermes-local-storage-fixture
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_backup: false
            hermes_agent_manage_local_models: true
            hermes_agent_packages:
              - sl
            hermes_agent_local_models_dir: /var/lib/hermes-local-storage-foreign
            hermes_agent_local_models_results_dir: >-
              /var/lib/hermes-local-storage-foreign/results
            hermes_agent_local_models: []

        - name: Fail if foreign local-model storage was accepted
          ansible.builtin.fail:
            msg: Foreign local-model storage must fail before installation begins.
      rescue:
        - name: Assert foreign local-model storage failed preflight
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require role-owned local-model directories when they already exist'

        - name: Record rejection of foreign local-model storage
          ansible.builtin.set_fact:
            hermes_agent_molecule_local_storage_rejected: true

    - name: Inspect foreign local-model storage after preflight rejection
      ansible.builtin.stat:
        path: /var/lib/hermes-local-storage-foreign
      register: hermes_agent_molecule_local_storage_after

