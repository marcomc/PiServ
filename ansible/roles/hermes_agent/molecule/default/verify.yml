---
- name: Verify  # noqa complexity[play] - one ordered lifecycle regression scenario
  hosts: all
  become: true
  vars:
    # The fixture exercises role behavior on the container architecture; the
    # production role default remains ARM64-only.
    hermes_agent_supported_architectures:
      - "{{ ansible_facts['architecture'] }}"
    hermes_agent_molecule_role_fixture_vars: &role_fixture_vars
      hermes_agent_repo_version: >-
        {{ hermes_agent_molecule_fixture_revision.content | b64decode | trim }}
      hermes_agent_installer_url: >-
        file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
      hermes_agent_installer_checksum: >-
        sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
      hermes_agent_codex_archive_url: >-
        file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
      hermes_agent_codex_archive_checksum: >-
        sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
  tasks:
    - name: Pin expected fixture origin across dynamic role inclusions
      ansible.builtin.set_fact:
        hermes_agent_expected_repo_origin: /usr/local/src/hermes-agent-fixture/upstream

    - name: Read Hermes Agent service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - hermes-agent-dashboard.service
      changed_when: false
      register: hermes_agent_molecule_dashboard_state

    - name: Read Hermes Agent backup timer state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-enabled
          - hermes-agent-backup.timer
      changed_when: false
      register: hermes_agent_molecule_backup_timer_state

    - name: Verify loopback dashboard response
      ansible.builtin.uri:
        url: http://127.0.0.1:9119/
        status_code: 200
        return_content: false

    - name: Read dashboard bind-read-only policy from unit source
      ansible.builtin.command:
        argv:
          - grep
          - -F
          - BindReadOnlyPaths=/etc/hermes-managed-policy:/var/lib/hermes-agent/workspace/AGENTS.md
          - /etc/systemd/system/hermes-agent-dashboard.service
      changed_when: false

    - name: Read effective dashboard bind-read-only policy
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - hermes-agent-dashboard.service
          - --property=BindReadOnlyPaths
          - --value
      register: hermes_agent_molecule_effective_bind_read_only_paths
      changed_when: false

    - name: Read dashboard service process identifier
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - hermes-agent-dashboard.service
          - --property=MainPID
          - --value
      register: hermes_agent_molecule_dashboard_main_pid
      changed_when: false

    - name: Read managed policy through the dashboard service identity
      ansible.builtin.command:
        argv:
          - nsenter
          - --target={{ hermes_agent_molecule_dashboard_main_pid.stdout }}
          - --mount
          - --
          - runuser
          - --user=hermes-agent
          - --
          - cat
          - /var/lib/hermes-agent/workspace/AGENTS.md
      register: hermes_agent_molecule_managed_policy_read
      changed_when: false

    - name: Reject managed policy writes through the dashboard service identity
      ansible.builtin.command:
        argv:
          - nsenter
          - --target={{ hermes_agent_molecule_dashboard_main_pid.stdout }}
          - --mount
          - --
          - runuser
          - --user=hermes-agent
          - --
          - sh
          - -c
          - printf mutation > /var/lib/hermes-agent/workspace/AGENTS.md
      register: hermes_agent_molecule_managed_policy_write
      changed_when: false
      failed_when: hermes_agent_molecule_managed_policy_write.rc == 0

    - name: Reject managed policy unlink through the dashboard service identity
      ansible.builtin.command:
        argv:
          - nsenter
          - --target={{ hermes_agent_molecule_dashboard_main_pid.stdout }}
          - --mount
          - --
          - runuser
          - --user=hermes-agent
          - --
          - rm
          - /var/lib/hermes-agent/workspace/AGENTS.md
      register: hermes_agent_molecule_managed_policy_unlink
      changed_when: false
      failed_when: hermes_agent_molecule_managed_policy_unlink.rc == 0

    - name: Assert managed policy bind-read-only contract
      ansible.builtin.assert:
        that:
          - >-
            '/etc/hermes-managed-policy:/var/lib/hermes-agent/workspace/AGENTS.md' in
            hermes_agent_molecule_effective_bind_read_only_paths.stdout
          - hermes_agent_molecule_dashboard_main_pid.stdout | int > 1
          - hermes_agent_molecule_managed_policy_read.stdout == 'managed smart-home policy fixture'
          - hermes_agent_molecule_managed_policy_write.rc != 0
          - hermes_agent_molecule_managed_policy_unlink.rc != 0

    - name: Enable unknown Hermes toolset fixture
      ansible.builtin.file:
        path: /tmp/hermes-enable-unknown-toolset
        state: touch
        owner: root
        group: root
        mode: "0600"

    - name: Reject an unknown newly enabled Hermes CLI toolset
      block:
        - name: Validate installation with unknown enabled toolset
          ansible.builtin.include_tasks: >-
            {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-install.yml

        - name: Fail if unknown enabled toolset was accepted
          ansible.builtin.fail:
            msg: Unknown newly enabled toolsets must fail validation.
      rescue:
        - name: Assert exact enabled-toolset validation rejected the fixture
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Assert configured Hermes CLI toolsets'
      always:
        - name: Disable unknown Hermes toolset fixture
          ansible.builtin.file:
            path: /tmp/hermes-enable-unknown-toolset
            state: absent

    - name: Run scheduled backup service
      ansible.builtin.command:
        argv:
          - systemctl
          - start
          - hermes-agent-backup.service
      changed_when: true

    - name: Find Hermes Agent backup archive
      ansible.builtin.find:
        paths: /var/backups/hermes-agent
        patterns: hermes-backup-*.zip
        file_type: file
      register: hermes_agent_molecule_backup_archives

    - name: Read Hermes Agent version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/hermes
          - --version
      changed_when: false
      register: hermes_agent_molecule_installed_hermes_version

    - name: Read Codex CLI version
      ansible.builtin.command:
        argv:
          - /usr/local/bin/codex
          - --version
      changed_when: false
      register: hermes_agent_molecule_installed_codex_version

    - name: Read fixture Hermes revision
      ansible.builtin.slurp:
        src: /usr/local/src/hermes-agent-fixture/revision
      changed_when: false
      register: hermes_agent_molecule_fixture_revision

    - name: Read fixture artifact checksums
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - /usr/local/src/hermes-agent-fixture/hermes-agent-installer
        - /usr/local/src/hermes-agent-fixture/codex.tar.gz
      register: hermes_agent_molecule_fixture_artifacts

    - name: Read Hermes dashboard terminal UI runtime revision
      ansible.builtin.command:
        argv:
          - cat
          - /usr/local/lib/hermes-agent-runtime/tui/.hermes-revision
      changed_when: false
      register: hermes_agent_molecule_dashboard_tui_revision

    - name: Inspect Hermes dashboard terminal UI runtime bundle
      ansible.builtin.stat:
        path: /usr/local/lib/hermes-agent-runtime/tui/dist/entry.js
      register: hermes_agent_molecule_dashboard_tui_bundle

    - name: Inspect installer-created Hermes node runtime file
      ansible.builtin.stat:
        path: /var/lib/hermes-agent/node/bin/npm
      register: hermes_agent_molecule_node_runtime_file

    - name: Read dashboard build identity fixtures
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /usr/local/lib/hermes-agent/hermes_cli/web_dist/build-uid
        - /usr/local/lib/hermes-agent-runtime/tui/dist/build-uid
      register: hermes_agent_molecule_dashboard_build_identities

    - name: Verify local-model capability is inert by default
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/hermes-local-model-gemma-4-e2b.service
        - /etc/systemd/system/hermes-local-model-granite-3-3-2b.service
        - /usr/local/libexec/hermes-agent/benchmark-local-model
        - /usr/local/lib/llama.cpp
        - /var/lib/hermes-models
      register: hermes_agent_molecule_local_model_artifacts

    - name: Assert installed role behavior
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_dashboard_state.stdout | trim == 'active'
          - hermes_agent_molecule_backup_timer_state.stdout | trim == 'enabled'
          - hermes_agent_molecule_backup_archives.matched | int == 1
          - hermes_agent_molecule_installed_hermes_version.stdout | trim == 'Hermes Agent v0.20.0'
          - hermes_agent_molecule_installed_codex_version.stdout | trim == 'codex-cli 0.145.0'
          - hermes_agent_molecule_dashboard_tui_revision.stdout | trim == (hermes_agent_molecule_fixture_revision.content | b64decode | trim)
          - hermes_agent_molecule_dashboard_tui_bundle.stat.exists
          - hermes_agent_molecule_dashboard_tui_bundle.stat.isreg
          - hermes_agent_molecule_dashboard_tui_bundle.stat.pw_name == 'root'
          - hermes_agent_molecule_dashboard_tui_bundle.stat.gr_name == 'root'
          - hermes_agent_molecule_dashboard_tui_bundle.stat.mode == '0644'
          - hermes_agent_molecule_node_runtime_file.stat.isreg
          - hermes_agent_molecule_node_runtime_file.stat.pw_name == 'hermes-agent'
          - hermes_agent_molecule_node_runtime_file.stat.gr_name == 'hermes-agent'
          - hermes_agent_molecule_node_runtime_file.stat.mode == '0755'
          - >-
            hermes_agent_molecule_dashboard_build_identities.results |
            map(attribute='content') | map('b64decode') | map('trim') |
            reject('equalto', '0') | list | length == 2
          - >-
            hermes_agent_molecule_local_model_artifacts.results |
            selectattr('stat.exists') | list | length == 0

    - name: Load role defaults for local-model capacity fixture
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"

    - name: Create foreign regular Codex link target fixture
      ansible.builtin.copy:
        content: foreign codex executable
        dest: /usr/local/bin/codex-foreign-regular-fixture
        owner: root
        group: root
        mode: "0755"

    - name: Reject foreign regular Codex link target fixture
      block:
        - name: Validate foreign regular Codex link target fixture
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: /usr/local/bin/codex-foreign-regular-fixture

        - name: Fail if foreign regular Codex target was accepted
          ansible.builtin.fail:
            msg: Foreign regular Codex targets must fail preflight.
      rescue:
        - name: Assert foreign regular Codex target failed identity validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require absent or recognized active Codex link'

    - name: Read foreign regular Codex target after rejection
      ansible.builtin.slurp:
        src: /usr/local/bin/codex-foreign-regular-fixture
      register: hermes_agent_molecule_foreign_codex_regular

    - name: Assert foreign regular Codex target was preserved exactly
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_foreign_codex_regular.content | b64decode ==
            'foreign codex executable'

    - name: Create foreign symlink Codex target fixture
      ansible.builtin.file:
        src: /bin/true
        dest: /usr/local/bin/codex-foreign-link-fixture
        state: link
        owner: root
        group: root

    - name: Reject foreign symlink Codex target fixture
      block:
        - name: Validate foreign symlink Codex target fixture
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: /usr/local/bin/codex-foreign-link-fixture

        - name: Fail if foreign symlink Codex target was accepted
          ansible.builtin.fail:
            msg: Foreign symlink Codex targets must fail preflight.
      rescue:
        - name: Assert foreign symlink Codex target failed identity validation
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require absent or recognized active Codex link'

    - name: Read foreign symlink Codex target after rejection
      ansible.builtin.command:
        argv:
          - /usr/bin/readlink
          - /usr/local/bin/codex-foreign-link-fixture
      register: hermes_agent_molecule_foreign_codex_link
      changed_when: false

    - name: Assert foreign symlink Codex target was preserved exactly
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_foreign_codex_link.stdout == '/bin/true'

    - name: Create Codex link symlink-parent fixture
      ansible.builtin.file:
        src: /usr/local/bin
        dest: /usr/local/hermes-codex-link-parent-alias
        state: link
        owner: root
        group: root

    - name: Create Codex link alias preservation canary
      ansible.builtin.copy:
        content: alias canary preserved
        dest: /usr/local/bin/codex-parent-alias-fixture
        owner: root
        group: root
        mode: "0600"

    - name: Reject symlink-parent Codex link alias
      block:
        - name: Validate symlink-parent Codex link alias
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: /usr/local/hermes-codex-link-parent-alias/codex-parent-alias-fixture

        - name: Fail if symlink-parent Codex alias was accepted
          ansible.builtin.fail:
            msg: Symlink-parent Codex link paths must fail preflight.
      rescue:
        - name: Assert symlink-parent Codex alias failed canonical validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require canonical Codex link parent'

    - name: Create lexical Codex link alias preservation canary
      ansible.builtin.copy:
        content: lexical canary preserved
        dest: /usr/local/bin/codex-lexical-alias-fixture
        owner: root
        group: root
        mode: "0600"

    - name: Reject lexical Codex link alias
      block:
        - name: Validate lexical Codex link alias
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: /usr/local/bin/../bin/codex-lexical-alias-fixture

        - name: Fail if lexical Codex alias was accepted
          ansible.builtin.fail:
            msg: Lexical Codex link paths must fail preflight.
      rescue:
        - name: Assert lexical Codex alias failed canonical validation
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require canonical Codex link parent'

    - name: Read rejected Codex link alias canaries
      ansible.builtin.slurp:
        src: "/usr/local/bin/{{ item }}"
      loop:
        - codex-parent-alias-fixture
        - codex-lexical-alias-fixture
      register: hermes_agent_molecule_codex_alias_canaries

    - name: Assert rejected Codex link aliases preserved exact content
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_codex_alias_canaries.results[0].content |
            b64decode == 'alias canary preserved'
          - >-
            hermes_agent_molecule_codex_alias_canaries.results[1].content |
            b64decode == 'lexical canary preserved'

    - name: Inspect managed runtime roots before Codex equality rejections
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ hermes_agent_dashboard_tui_runtime_dir }}"
        - "{{ hermes_agent_local_model_runtime_dir }}"
      register: hermes_agent_molecule_codex_runtime_roots_before

    - name: Reject Codex link equal to TUI runtime root
      block:
        - name: Validate Codex link equal to TUI runtime root
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: "{{ hermes_agent_dashboard_tui_runtime_dir }}"

        - name: Fail if TUI runtime root equality was accepted
          ansible.builtin.fail:
            msg: A Codex link equal to the TUI runtime root must fail preflight.
      rescue:
        - name: Record TUI runtime root equality rejection
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require Codex link outputs outside other managed roots'

        - name: Record accepted TUI runtime root rejection
          ansible.builtin.set_fact:
            hermes_agent_molecule_codex_tui_root_rejected: true

    - name: Reject Codex link equal to local-model runtime root
      block:
        - name: Validate Codex link equal to local-model runtime root
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: "{{ hermes_agent_local_model_runtime_dir }}"

        - name: Fail if local-model runtime root equality was accepted
          ansible.builtin.fail:
            msg: A Codex link equal to the local-model runtime root must fail preflight.
      rescue:
        - name: Record local-model runtime root equality rejection
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require Codex link outputs outside other managed roots'

        - name: Record accepted local-model runtime root rejection
          ansible.builtin.set_fact:
            hermes_agent_molecule_codex_local_runtime_root_rejected: true

    - name: Inspect managed runtime roots after Codex equality rejections
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ hermes_agent_dashboard_tui_runtime_dir }}"
        - "{{ hermes_agent_local_model_runtime_dir }}"
      register: hermes_agent_molecule_codex_runtime_roots_after

    - name: Assert managed runtime root equality was rejected without mutation
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_codex_tui_root_rejected | default(false)
          - hermes_agent_molecule_codex_local_runtime_root_rejected | default(false)
          - >-
            hermes_agent_molecule_codex_runtime_roots_before.results[0].stat.exists ==
            hermes_agent_molecule_codex_runtime_roots_after.results[0].stat.exists
          - >-
            not hermes_agent_molecule_codex_runtime_roots_before.results[0].stat.exists or
            hermes_agent_molecule_codex_runtime_roots_before.results[0].stat.inode ==
            hermes_agent_molecule_codex_runtime_roots_after.results[0].stat.inode
          - >-
            hermes_agent_molecule_codex_runtime_roots_before.results[1].stat.exists ==
            hermes_agent_molecule_codex_runtime_roots_after.results[1].stat.exists
          - >-
            not hermes_agent_molecule_codex_runtime_roots_before.results[1].stat.exists or
            hermes_agent_molecule_codex_runtime_roots_before.results[1].stat.inode ==
            hermes_agent_molecule_codex_runtime_roots_after.results[1].stat.inode

    - name: Create Codex-version-root containment fixture directory
      ansible.builtin.file:
        path: /usr/local/lib/codex/current-fixture
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Codex-version-root containment canary
      ansible.builtin.copy:
        content: codex root canary preserved
        dest: /usr/local/lib/codex/current-fixture/link-inside-fixture
        owner: root
        group: root
        mode: "0600"

    - name: Reject Codex link inside configured Codex version root
      block:
        - name: Validate Codex link inside configured version root
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: /usr/local/lib/codex/current-fixture/link-inside-fixture
            hermes_agent_codex_install_dir: /usr/local/lib/codex/current-fixture

        - name: Fail if Codex link inside version root was accepted
          ansible.builtin.fail:
            msg: Codex link paths inside the version root must fail preflight.
      rescue:
        - name: Record Codex version-root containment rejection
          ansible.builtin.set_fact:
            hermes_agent_molecule_codex_version_root_rejected: true

    - name: Read Codex-version-root canary after rejection
      ansible.builtin.slurp:
        src: /usr/local/lib/codex/current-fixture/link-inside-fixture
      register: hermes_agent_molecule_codex_version_root_canary

    - name: Create derived-marker managed-root collision fixture
      ansible.builtin.file:
        path: /usr/local/bin/codex-marker-root-fixture.hermes-agent-managed.yml
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create derived-marker managed-root collision canary
      ansible.builtin.copy:
        content: marker root canary preserved
        dest: /usr/local/bin/codex-marker-root-fixture.hermes-agent-managed.yml/canary
        owner: root
        group: root
        mode: "0600"

    - name: Reject derived Codex marker equal to managed root
      block:
        - name: Validate derived Codex marker equal to managed root
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: /usr/local/bin/codex-marker-root-fixture
            hermes_agent_dashboard_tui_runtime_dir: /usr/local/bin/codex-marker-root-fixture.hermes-agent-managed.yml

        - name: Fail if derived marker managed-root collision was accepted
          ansible.builtin.fail:
            msg: Derived Codex markers equal to managed roots must fail preflight.
      rescue:
        - name: Record derived-marker managed-root collision rejection
          ansible.builtin.set_fact:
            hermes_agent_molecule_codex_marker_root_rejected: true

    - name: Read derived-marker managed-root canary after rejection
      ansible.builtin.slurp:
        src: /usr/local/bin/codex-marker-root-fixture.hermes-agent-managed.yml/canary
      register: hermes_agent_molecule_codex_marker_root_canary

    - name: Create protected Codex path fixture
      ansible.builtin.copy:
        content: protected codex path preserved
        dest: /etc/codex-protected-fixture
        owner: root
        group: root
        mode: "0600"

    - name: Reject protected Codex path fixture
      block:
        - name: Validate protected Codex path fixture
          ansible.builtin.include_tasks:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/tasks/validate-codex-link.yml"
          vars:
            hermes_agent_codex_binary_path: /etc/codex-protected-fixture

        - name: Fail if protected Codex path was accepted
          ansible.builtin.fail:
            msg: Codex link paths beneath /etc must fail preflight.
      rescue:
        - name: Record protected Codex path rejection
          ansible.builtin.set_fact:
            hermes_agent_molecule_codex_protected_path_rejected: true

    - name: Read protected Codex path fixture after rejection
      ansible.builtin.slurp:
        src: /etc/codex-protected-fixture
      register: hermes_agent_molecule_codex_protected_path

    - name: Assert explicit Codex root and protected-path regressions
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_codex_version_root_rejected | default(false)
          - hermes_agent_molecule_codex_marker_root_rejected | default(false)
          - hermes_agent_molecule_codex_protected_path_rejected | default(false)
          - >-
            hermes_agent_molecule_codex_version_root_canary.content | b64decode ==
            'codex root canary preserved'
          - >-
            hermes_agent_molecule_codex_marker_root_canary.content | b64decode ==
            'marker root canary preserved'
          - >-
            hermes_agent_molecule_codex_protected_path.content | b64decode ==
            'protected codex path preserved'

    - name: Create prior and current Codex upgrade directories
      ansible.builtin.file:
        path: "/usr/local/lib/codex/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
