          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
        hermes_agent_manage_backup: true
        hermes_agent_backup_group: root
        hermes_agent_backup_dir: /var/backups/hermes-agent
        hermes_agent_manage_dashboard_chat: true
        hermes_agent_manage_home_assistant_mcp: true
        hermes_agent_home_assistant_mcp_url: http://home-assistant.example.test/api/mcp
        hermes_agent_home_assistant_mcp_token_env_file: >-
          /var/lib/hermes-agent/mcp-token-fixture/home-assistant-mcp.env

    - name: Read repaired Hermes dashboard terminal UI state
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /usr/local/lib/hermes-agent-runtime/tui/package.json
        - /usr/local/lib/hermes-agent-runtime/tui/dist/entry.js
        - /usr/local/lib/hermes-agent-runtime/tui/.hermes-managed-state.yml
      register: hermes_agent_molecule_repaired_tui_state
      changed_when: false

    - name: Assert managed Hermes dashboard terminal UI state is repaired
      ansible.builtin.assert:
        that:
          - >-
            (hermes_agent_molecule_repaired_tui_state.results[0].content | b64decode | trim) ==
            '{"name":"hermes-tui-fixture"}'
          - >-
            (hermes_agent_molecule_repaired_tui_state.results[1].content | b64decode | trim) ==
            'export default {};'
          - >-
            'revision: ' ~ (hermes_agent_molecule_fixture_revision.content | b64decode | trim) in
            (hermes_agent_molecule_repaired_tui_state.results[2].content | b64decode)

    - name: Disable dashboard chat while the dashboard remains managed
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hermes_agent_repo_version: >-
          {{ hermes_agent_molecule_fixture_revision.content | b64decode | trim }}
        hermes_agent_installer_url: >-
          file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
        hermes_agent_installer_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
        hermes_agent_codex_archive_url: >-
          file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
        hermes_agent_codex_archive_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
        hermes_agent_manage_backup: true
        hermes_agent_backup_group: root
        hermes_agent_backup_dir: /var/backups/hermes-agent
        hermes_agent_manage_dashboard: true
        hermes_agent_manage_dashboard_chat: false
        hermes_agent_manage_home_assistant_mcp: true
        hermes_agent_home_assistant_mcp_url: http://home-assistant.example.test/api/mcp
        hermes_agent_home_assistant_mcp_token_env_file: >-
          /var/lib/hermes-agent/mcp-token-fixture/home-assistant-mcp.env

    - name: Inspect dashboard after dashboard chat cleanup
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /usr/local/lib/hermes-agent-runtime/tui
        - /etc/systemd/system/hermes-agent-dashboard.service
      register: hermes_agent_molecule_dashboard_chat_cleanup

    - name: Read dashboard unit after dashboard chat cleanup
      ansible.builtin.slurp:
        src: /etc/systemd/system/hermes-agent-dashboard.service
      register: hermes_agent_molecule_dashboard_without_chat
      changed_when: false

    - name: Assert dashboard chat cleanup preserves the dashboard service
      ansible.builtin.assert:
        that:
          - not hermes_agent_molecule_dashboard_chat_cleanup.results[0].stat.exists
          - hermes_agent_molecule_dashboard_chat_cleanup.results[1].stat.exists
          - >-
            'HERMES_TUI_DIR' not in
            (hermes_agent_molecule_dashboard_without_chat.content | b64decode)

    - name: Disable dashboard and backup services in the fixture
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hermes_agent_repo_version: >-
          {{ hermes_agent_molecule_fixture_revision.content | b64decode | trim }}
        hermes_agent_installer_url: >-
          file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
        hermes_agent_installer_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
        hermes_agent_codex_archive_url: >-
          file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
        hermes_agent_codex_archive_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
        hermes_agent_manage_dashboard: false
        hermes_agent_manage_backup: false
        hermes_agent_manage_dashboard_chat: false

    - name: Inspect disabled Hermes Agent units
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/hermes-agent-dashboard.service
        - /etc/systemd/system/hermes-agent-backup.service
        - /etc/systemd/system/hermes-agent-backup.timer
        - /usr/local/lib/hermes-agent-runtime/tui
      register: hermes_agent_molecule_disabled_units

    - name: Read disabled Hermes Agent dashboard state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - --quiet
          - hermes-agent-dashboard.service
      register: hermes_agent_molecule_disabled_dashboard_state
      changed_when: false
      failed_when: false

    - name: Read root group membership after backup disable
      ansible.builtin.getent:
        database: group
        key: root

    - name: Assert disabled feature cleanup
      ansible.builtin.assert:
        that:
          - >-
            hermes_agent_molecule_disabled_units.results |
            selectattr('stat.exists') | list | length == 0
          - hermes_agent_molecule_disabled_dashboard_state.rc != 0
          - "'hermes-agent' not in ansible_facts.getent_group.root[2]"

    - name: Create foreign Hermes dashboard terminal UI runtime directory
      ansible.builtin.file:
        path: /usr/local/lib/hermes-agent-runtime/foreign-tui
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create foreign Hermes dashboard terminal UI runtime fixture
      ansible.builtin.copy:
        content: foreign
        dest: /usr/local/lib/hermes-agent-runtime/foreign-tui/unmanaged.txt
        owner: root
        group: root
        mode: "0644"

    - name: Refuse removal of foreign Hermes dashboard terminal UI runtime
      block:
        - name: Apply role with foreign Hermes dashboard terminal UI runtime
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_repo_version: >-
              {{ hermes_agent_molecule_fixture_revision.content | b64decode | trim }}
            hermes_agent_installer_url: >-
              file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
            hermes_agent_installer_checksum: >-
              sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
            hermes_agent_codex_archive_url: >-
              file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
            hermes_agent_codex_archive_checksum: >-
              sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
            hermes_agent_manage_dashboard: false
            hermes_agent_manage_dashboard_chat: false
            hermes_agent_manage_backup: false
            hermes_agent_dashboard_tui_runtime_dir: >-
              /usr/local/lib/hermes-agent-runtime/foreign-tui
            hermes_agent_dashboard_tui_runtime_revision_file: >-
              /usr/local/lib/hermes-agent-runtime/foreign-tui/.hermes-revision
            hermes_agent_dashboard_tui_runtime_manifest_file: >-
              /usr/local/lib/hermes-agent-runtime/foreign-tui/.hermes-managed-state.yml

        - name: Fail if foreign Hermes dashboard terminal UI runtime was accepted
          ansible.builtin.fail:
            msg: Foreign Hermes dashboard terminal UI runtime must not be removed.
      rescue:
        - name: Assert foreign Hermes dashboard terminal UI runtime was refused
          ansible.builtin.assert:
            that:
              - >-
                ansible_failed_task.name ==
                'Require a recognized disabled Hermes dashboard terminal UI runtime'

        - name: Record refusal of foreign Hermes dashboard terminal UI runtime
          ansible.builtin.set_fact:
            hermes_agent_molecule_foreign_tui_rejected: true

    - name: Inspect foreign Hermes dashboard terminal UI runtime after refusal
      ansible.builtin.stat:
        path: /usr/local/lib/hermes-agent-runtime/foreign-tui/unmanaged.txt
      register: hermes_agent_molecule_foreign_tui_artifact

    - name: Assert foreign Hermes dashboard terminal UI runtime is untouched
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_foreign_tui_rejected | default(false)
          - hermes_agent_molecule_foreign_tui_artifact.stat.exists
          - hermes_agent_molecule_foreign_tui_artifact.stat.pw_name == 'root'
          - hermes_agent_molecule_foreign_tui_artifact.stat.gr_name == 'root'
          - hermes_agent_molecule_foreign_tui_artifact.stat.mode == '0644'

    - name: Create root-owned node symlink target canary
      ansible.builtin.copy:
        content: node ownership canary
        dest: /var/tmp/hermes-node-ownership-canary
        owner: root
        group: root
        mode: "0644"

    - name: Create nested Hermes node runtime symlink fixture
      ansible.builtin.file:
        src: /var/tmp/hermes-node-ownership-canary
        dest: /var/lib/hermes-agent/node/bin/ownership-canary-link
        state: link
        owner: hermes-agent
        group: hermes-agent
        follow: false

    - name: Add second fixture revision source file
      ansible.builtin.copy:
        content: second fixture revision
        dest: /usr/local/src/hermes-agent-fixture/upstream/second-revision
        owner: root
        group: root
        mode: "0644"

    - name: Commit second fixture revision
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - /usr/local/src/hermes-agent-fixture/upstream
          - add
          - second-revision
      changed_when: true

    - name: Record second fixture revision commit
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - /usr/local/src/hermes-agent-fixture/upstream
          - commit
          - -m
          - Second fixture revision
      changed_when: true

    - name: Read second fixture revision
      ansible.builtin.command:
        argv:
          - /usr/bin/git
          - -C
          - /usr/local/src/hermes-agent-fixture/upstream
          - rev-parse
          - HEAD
      register: hermes_agent_molecule_second_fixture_revision
      changed_when: false

    - name: Reinstall Hermes at second fixture revision
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      vars:
        hermes_agent_repo_version: "{{ hermes_agent_molecule_second_fixture_revision.stdout }}"
        hermes_agent_installer_url: >-
          file:///usr/local/src/hermes-agent-fixture/hermes-agent-installer
        hermes_agent_installer_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[0].stat.checksum }}
        hermes_agent_codex_archive_url: >-
          file:///usr/local/src/hermes-agent-fixture/codex.tar.gz
        hermes_agent_codex_archive_checksum: >-
          sha256:{{ hermes_agent_molecule_fixture_artifacts.results[1].stat.checksum }}
        hermes_agent_manage_dashboard: false
        hermes_agent_manage_backup: false

    - name: Inspect node symlink target after bounded ownership handoff
      ansible.builtin.stat:
        path: /var/tmp/hermes-node-ownership-canary
      register: hermes_agent_molecule_node_ownership_canary

    - name: Assert bounded ownership handoff did not follow nested symlink
      ansible.builtin.assert:
        that:
          - hermes_agent_molecule_node_ownership_canary.stat.pw_name == 'root'
          - hermes_agent_molecule_node_ownership_canary.stat.gr_name == 'root'
          - hermes_agent_molecule_node_ownership_canary.stat.mode == '0644'
