    - name: Corrupt disabled Hermes dashboard terminal UI managed state fixture
      ansible.builtin.copy:
        content: "revision: [malformed\n"
        dest: /usr/local/lib/hermes-agent-runtime/tui/.hermes-managed-state.yml
        owner: root
        group: root
        mode: "0644"

    - name: Refuse disabled cleanup with malformed terminal UI managed state
      block:
        - name: Disable dashboard chat with malformed terminal UI managed state
          ansible.builtin.include_role:
            name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            hermes_agent_repo_version: >-
              {{ hermes_agent_molecule_fixture_revision.content | b64decode | trim }}
