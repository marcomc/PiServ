    - name: Restore Hermes dashboard terminal UI managed state fixture
      ansible.builtin.copy:
        content: >-
          {{ hermes_agent_molecule_repaired_tui_state.results[2].content | b64decode }}
        dest: /usr/local/lib/hermes-agent-runtime/tui/.hermes-managed-state.yml
        owner: root
        group: root
        mode: "0644"

    - name: Add upgraded Hermes dashboard terminal UI fixture source
