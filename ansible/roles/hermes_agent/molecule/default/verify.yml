          - >-
            hermes_agent_molecule_malformed_tui_refusal_state.results[1].content |
            b64decode == 'revision: [malformed\n'
          - >-
            hermes_agent_molecule_malformed_tui_refusal_state.results[2].content |
            b64decode | trim == '{"name":"hermes-tui-fixture"}'
          - >-
            hermes_agent_molecule_malformed_tui_refusal_state.results[3].content |
