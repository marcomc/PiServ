---
# PiServ service endpoints shared by the base and firewall playbooks.
# Risk accepted in decision 0015: publish Glances directly only to the trusted
# LAN and Tailnet identities allowed by ACLs while Debian security updates apply.
piserv_glances_bind_address: 0.0.0.0
piserv_glances_validation_address: 127.0.0.1
piserv_glances_port: 61208

# PiServ is the consumer of the reusable cgroup_memory_controller role. These
# values retain the already-applied boot artifacts while keeping the role free
# of PiServ-specific paths and kernel assumptions.
cgroup_memory_controller_vendor_dtb: /boot/firmware/bcm2712-rpi-5-b.dtb
cgroup_memory_controller_config_path: /boot/firmware/config.txt
cgroup_memory_controller_managed_dtb_path: >-
  /boot/firmware/piserv-cgroup-memory.dtb
cgroup_memory_controller_helper_path: >-
  /usr/local/libexec/piserv/manage-cgroup-memory-dtb
cgroup_memory_controller_kernel_hook_path: >-
  /etc/kernel/postinst.d/zz-piserv-cgroup-memory-controller
cgroup_memory_controller_kernel_refresh_dependency_path: >-
  /etc/kernel/postinst.d/z50-raspi-firmware
cgroup_memory_controller_reboot_mode_path: /sys/kernel/reboot/mode
cgroup_memory_controller_required_reboot_mode: cold
cgroup_memory_controller_backup_dir: >-
  /var/lib/piserv/boot-backups/cgroup-memory-controller
cgroup_memory_controller_config_backup_filename: >-
  config.txt.before-cgroup-memory-controller
cgroup_memory_controller_vendor_dtb_backup_filename: >-
  vendor.dtb.before-cgroup-memory-controller
cgroup_memory_controller_config_marker: >-
  ANSIBLE MANAGED: PiServ cgroup v2 memory controller
cgroup_memory_controller_runtime_systemd_service: docker.service

# PiServ-owned external storage. The existing filesystem is discovered by its
# managed label; the playbook refuses zero or multiple candidates before any
# package, mount, ACL, or service mutation.
piserv_external_storage_volume_label: external-data
piserv_external_storage_mountpoint: /mnt/external-data
piserv_external_storage_group: external-data
piserv_external_storage_service_users: []
piserv_external_storage_service_units: []
piserv_external_storage_revoked_service_units: []
piserv_external_storage_mount_options: >-
  defaults,nofail,nodev,nosuid,x-systemd.device-timeout=15s
piserv_external_storage_smart_required: false
piserv_external_storage_directories:
  - name: shared
    mode: "2775"
    other_permissions: r-x
  - name: backups
    mode: "2770"
    other_permissions: "---"

# Hermes MCP SSH defaults remain available when an ignored local
# ansible/vars/hermes-agent.yml overrides the example vars file entirely.
piserv_hermes_mcp_ssh_manage: true
piserv_hermes_mcp_ssh_user: codex-hermes-mcp
piserv_hermes_mcp_ssh_group: codex-hermes-mcp
piserv_hermes_mcp_ssh_home: /var/lib/codex-hermes-mcp
piserv_hermes_mcp_ssh_authorized_keys_path: >-
  /var/lib/codex-hermes-mcp/.ssh/authorized_keys
piserv_hermes_mcp_ssh_wrapper_path: >-
  /usr/local/libexec/hermes-agent/codex-mcp-ssh
piserv_hermes_mcp_ssh_wrapper_template: hermes-mcp-ssh-wrapper.sh.j2
piserv_hermes_mcp_ssh_sudoers_path: /etc/sudoers.d/codex-hermes-mcp
piserv_hermes_mcp_ssh_sshd_config_path: >-
  /etc/ssh/sshd_config.d/60-codex-hermes-mcp.conf
piserv_hermes_mcp_ssh_state_path: >-
  /usr/local/libexec/hermes-agent/.codex-hermes-mcp-state.json
piserv_hermes_mcp_ssh_trusted_preceding_match_configs: []
piserv_hermes_mcp_ssh_copy_admin_authorized_keys: true
piserv_hermes_mcp_ssh_source_user: admin
piserv_hermes_mcp_ssh_source_authorized_keys_path: >-
  /home/admin/.ssh/authorized_keys

# A separate restricted principal exposes a bounded agent turn. The existing
# messaging bridge remains permanently bound to `hermes mcp serve`.
piserv_hermes_agent_home_assistant_mcp_name: home-assistant-assist
piserv_hermes_delegation_mcp_ssh_manage: true
piserv_hermes_delegation_mcp_ssh_user: codex-hermes-delegate
piserv_hermes_delegation_mcp_ssh_group: codex-hermes-delegate
piserv_hermes_delegation_mcp_ssh_home: /var/lib/codex-hermes-delegate
piserv_hermes_delegation_mcp_ssh_authorized_keys_path: >-
  /var/lib/codex-hermes-delegate/.ssh/authorized_keys
piserv_hermes_delegation_mcp_ssh_wrapper_path: >-
  /usr/local/libexec/hermes-agent/codex-delegation-mcp-ssh
piserv_hermes_delegation_mcp_ssh_sudoers_path: >-
  /etc/sudoers.d/codex-hermes-delegate
piserv_hermes_delegation_mcp_ssh_sshd_config_path: >-
  /etc/ssh/sshd_config.d/61-codex-hermes-delegate.conf
piserv_hermes_delegation_mcp_ssh_state_path: >-
  /usr/local/libexec/hermes-agent/.codex-hermes-delegation-mcp-state.json
piserv_hermes_delegation_mcp_ssh_trusted_preceding_match_configs:
  - path: /etc/ssh/sshd_config.d/60-codex-hermes-mcp.conf
    user: codex-hermes-mcp
    authorized_keys_path: /var/lib/codex-hermes-mcp/.ssh/authorized_keys
    wrapper_path: /usr/local/libexec/hermes-agent/codex-mcp-ssh
piserv_hermes_delegation_mcp_ssh_copy_admin_authorized_keys: true
piserv_hermes_delegation_mcp_ssh_source_user: admin
piserv_hermes_delegation_mcp_ssh_source_authorized_keys_path: >-
  /home/admin/.ssh/authorized_keys
piserv_hermes_delegation_mcp_adapter_path: >-
  /usr/local/libexec/hermes-agent/hermes-delegation-mcp.py
piserv_hermes_delegation_mcp_config_path: >-
  /usr/local/lib/hermes-agent/.hermes-delegation-config.yaml
piserv_hermes_delegation_mcp_python_path: >-
  /usr/local/lib/hermes-agent/venv/bin/python
piserv_hermes_delegation_mcp_timeout_seconds: 300
piserv_hermes_delegation_mcp_terminate_grace_seconds: 5
piserv_hermes_delegation_mcp_max_prompt_bytes: 32768
piserv_hermes_delegation_mcp_max_output_bytes: 1048576
piserv_hermes_delegation_mcp_max_turns: 50
piserv_hermes_delegation_mcp_native_toolsets:
  - delegation
  - file
  - memory
  - session_search
  - skills
  - terminal
  - todo
piserv_hermes_delegation_mcp_integration_toolsets:
  - home-assistant-assist
